 ISR_neglect_haredi:0 "Neglect the Haredi"
 ISR_neglect_haredi_desc:0 "-200 political power. Removes Silent Mutiny. Requires the Orthodox to have stayed out of the coalition."
 ISR_restore_yeshiva:0 "Restore Yeshiva Traditions"
 ISR_restore_yeshiva_desc:0 "Requires the Orthodox to have joined the coalition. Spirit: Protected Torah Study. Recruitable population -2%. Daily political power +0.10."
 ISR_netanyahu_invincible:0 "Netanyahu Invincible"
 ISR_netanyahu_invincible_desc:0 "Requires Neglect the Haredi or Restore Yeshiva Traditions. Likud +20%. +100 political power. Spirit: Netanyahu Invincible. Political power gain +20%. Research speed +6%. Stability +10%."
 ISR_extremists_reins:0 "The Extremists Take the Reins"
 ISR_extremists_reins_desc:0 "Requires Neglect the Haredi or Restore Yeshiva Traditions. Otzma Yehudit +20%. Itamar Ben-Gvir becomes prime minister. Spirit: The Extremists Take the Reins. Division attack +20%. Division breakthrough +20%."
 ISR_deri_camp:0 "Deri's Arrangement"
