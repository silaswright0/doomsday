 dd_isr_netanyahu_invincible:0 "Netanyahu Invincible"
 dd_isr_netanyahu_invincible_desc:0 "Daily political power +0.20. Research speed +6%. Stability +10%."
 dd_isr_extremists_reins:0 "The Extremists Take the Reins"
 dd_isr_extremists_reins_desc:0 "Division attack +20%. Division breakthrough +20%."
 ISR_false_flag:0 "The Utility of a False Flag"
 ISR_false_flag_desc:0 "Elections are no longer held. Base war support +10%. The current prime minister stays in office. Removes The Reactionary Ripple."
