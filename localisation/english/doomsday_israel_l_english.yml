 dd_isr.1.t:0 "Diaspora Arms Shipment"
 dd_isr.1.d:0 "The partner ships a month of equipment: 350 infantry equipment, 35 artillery, 10 long-range SAMs, and 5 tanks."
 dd_isr.1.a:0 "Unload it."
 dd_isr_diaspora_opinion:0 "Diaspora Outreach"
 dd_isr_expansion_category:0 "Israeli Expansion"
 dd_isr_expansion_category_desc:0 "Annexing the Palestinian Authority raises the left if communist support is above 25%. The party in office does not matter."
 dd_isr_increase_settlements:0 "Increase Illegal Settlements"
 dd_isr_increase_settlements_desc:0 "Pay 100 political power. The Palestinian Authority moves closer to being annexed. Can be taken again after 60 days."
 dd_isr_expansion_open_tt:0 "Opens the Israeli Expansion decision menu."
 dd_isr_illegal_settlements_tt:0 "The Palestinian Authority loses a large amount of autonomy."
 dd_isr_expand_settlements_tt:0 "The Palestinian Authority loses a very large amount of autonomy."
 dd_isr_remove_attention_tt:0 "Removes International Attention."
 dd_isr_news.6.t:0 "Netanyahu Arrested"
 dd_isr_news.6.d:0 "Benjamin Netanyahu has been arrested. The October 7 commission has forced the former prime minister into custody."
 dd_isr_news.6.a:0 "The country watches."
