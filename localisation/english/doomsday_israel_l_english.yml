 dd_isr_election_countdown:0 "2026 Election"
 dd_isr_election_countdown_desc:0 "Counted on 1 November 2026. The larger starting bloc has 28 days to hold more than half the pie. The opposition starts with the market conservatives and the social liberals. Netanyahu starts with the national populists and Otzma Yehudit. Partners can join during those 28 days. If the first side is still short, the other side gets 28 days. If both fail, the next election is four months later."
 dd_isr_form_government:0 "Form a Government"
 dd_isr_form_government_desc:0 "28 days. This side must hold more than half the pie when the clock ends. The coalition list is on this tab. [GetDdIsrFormBloc]"
