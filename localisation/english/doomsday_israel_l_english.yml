 ISR_dismantle_orthodox:0 "Dismantle Orthodox Institutions"
 ISR_dismantle_orthodox_desc:0 "+75 political power. Base stability -5%. Orthodox -10%. Torah exemptions are removed."
 ISR_shared_republic:0 "One State for All People"
 ISR_shared_republic_desc:0 "Spirit: One State for All People. Recruitable population +2%. Stability +20%. War support +20%. Daily political power +0.15. Compliance gain +0.75. Non-core manpower +15%. Supply consumption -20%. Division attack +5%. Division defense +5%. Surrender limit +40%."
 ISR_stir_workers:0 "Stir the Workers Beyond the Border"
 ISR_stir_workers_desc:0 "Claims on Lebanon, South Lebanon, Syria, Jordan, Sinai, Gaza, and the West Bank. Every other Middle Eastern country gains Communist Influence, communism +5%."
 ISR_puppet_middle_east:0 "Puppet the Middle East"
 ISR_puppet_middle_east_desc:0 "Puppet war goals against every other Middle Eastern country we are not already fighting or ruling."
 ISR_reverse_overhaul:0 "Reverse the Judicial Overhauls"
 ISR_reverse_overhaul_desc:0 "Judicial Overhaul is removed. Base stability +10%. +100 political power."
 ISR_protect_court:0 "Protect the Supreme Court"
 ISR_protect_court_desc:0 "Spirit: Protected Supreme Court. Fascism -3%. Theocratic absolutism -3%."
 ISR_democrat_policy:0 "A Liberal Policy Set"
 ISR_democrat_policy_desc:0 "Women become Promote Feminism. Minorities become Minority Uplift Programs. Labour becomes Protected Labour. +100 political power if those laws are already in place."
 ISR_constitution:0 "Establish a Formal Constitution"
 ISR_constitution_desc:0 "Israel has basic laws, not a single constitution. This entrenches them as one. +100 political power. Spirit: Basic Law as Constitution. Gaza passes to the Palestinian Authority. +100 political power if they already hold it."
 ISR_cut_extremists:0 "Cut Off the Extremists"
 ISR_cut_extremists_desc:0 "Base stability +5%. Likud -5%. Otzma Yehudit -3%. Orthodox -3%."
 ISR_reapproach_europe:0 "Reapproach Europe"
 ISR_reapproach_europe_desc:0 "After Enforce Universal Service or The Servant Leader. +50 political power. Opinion +40 with Britain, France, Germany, Italy, Spain, and Poland, both ways. Every European diaspora slot gains 10 influence."
 ISR_repair_usa:0 "Repair the American Alliance"
 ISR_repair_usa_desc:0 "After Enforce Universal Service or The Servant Leader. +75 political power. Opinion +50 with the United States, both ways. If the United States still holds a diaspora slot, that slot gains 20 influence."
 ISR_universal_service:0 "Enforce Universal Service"
 ISR_universal_service_desc:0 "Torah exemptions end. Spirit: Universal Service. Base stability -3%. Removes Silent Mutiny and International Attention."
 ISR_democratic_israel:0 "Israeli Democracy Saved"
 ISR_democratic_israel_desc:0 "Spirit: Israeli Democracy Saved. War support +10%. Stability +20%. Factory output +10%. Research speed +10%. Division attack +10%. Division defense +10%."
 ISR_october_7:0 "Accountability for October 7"
 ISR_october_7_desc:0 "+100 political power. A global announcement that Netanyahu has been arrested."
 ISR_peoples_army:0 "The People's Army"
 ISR_peoples_army_desc:0 "Base stability +5%. Removes Silent Mutiny. Spirit: The People's Army. Recruitable population +2%. War support +5%."
 ISR_hostages_home:0 "Bring the Hostages Home"
 ISR_hostages_home_desc:0 "Base stability +10%. Base war support -5%. Yashar +2%."
 ISR_defined_aims:0 "Defined War Aims"
 ISR_defined_aims_desc:0 "War support +5%. Spirit: Defined War Aims. Planning speed +15%. Division attack +5%. Division defense +5%. Division organization +5%."
 ISR_coalition_survives:0 "The Coalition Survives"
