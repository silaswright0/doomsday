 ISR_arabic_national_desc:0 "Spirit: Arabic as a National Language. Progressive populism +3%. Communism +2%. Removes International Attention."
 ISR_declare_palestine:0 "Declare Israel-Palestine"
 ISR_declare_palestine_desc:0 "Completed when the revolt begins. The state is renamed Israel-Palestine. The IDF rises in Jerusalem and the Golan and keeps any IDF spirits. Those spirits are removed here, and the IDF focuses close. Israel keeps a share of the army equal to communist support, then twelve fully equipped 2x6 militia divisions appear in the capital. Recognize Arabic as a National Language follows."
 ISR_palestinian_citizenship:0 "Grant Palestinian Citizenship"
 ISR_palestinian_citizenship_desc:0 "Spirit: Palestinian Citizenship. Communism +2%."
 ISR_protect_minorities:0 "Protect Minority Rights"
 ISR_protect_minorities_desc:0 "Minorities become National Minority Equalization. +100 political power if that law is already in place."
 ISR_idf_arabs:0 "Extend Mandatory IDF Service to Arabs"
 ISR_idf_arabs_desc:0 "Recruitable population +2%. Base stability -5%. Communism +2%."
 ISR_arabic_education:0 "Arabic Education Efforts"
