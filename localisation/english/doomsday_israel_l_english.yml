 ISR_disengagement_710:0 "Disengagement 710"
 ISR_disengagement_710_desc:0 "Opens Israeli Expansion. Increase Illegal Settlements costs 100 political power and pulls the Palestinian Authority closer to annexation."
 ISR_election_hadash:0 "Hadash"
 ISR_election_hadash_desc:0 "Hadash can no longer win the election. This branch opens only if the revolt begins after the Palestinian Authority is annexed."
 ISR_election_democrats:0 "Lapid"
 ISR_election_democrats_desc:0 "Completed when the opposition forms a government and B'Yachad is at least as large as Yashar. Yair Lapid takes office. Then choose Golan or Lieberman."
 ISR_election_yashar:0 "Eisenkot"
 ISR_election_yashar_desc:0 "Completed when the opposition forms a government and Yashar is larger than B'Yachad. Gadi Eisenkot takes office. His path answers for October 7 and ends with the servant leader. Then choose Golan or Lieberman."
 ISR_election_netanyahu:0 "Netanyahu"
 ISR_election_netanyahu_desc:0 "Completed when Netanyahu's side forms a government. He starts with the national populists and Otzma Yehudit. The Orthodox join if they accept. Benjamin Netanyahu stays in office."
 ISR_side_golan:0 "Side with Golan"
 ISR_side_golan_desc:0 "After Lapid or Eisenkot takes office. +50 political power. The Democrats +3%. Opens the old left. Closes Greater Israel."
 ISR_side_lieberman:0 "Side with Lieberman"
 ISR_side_lieberman_desc:0 "After Lapid or Eisenkot takes office. +50 political power. War support +5%. Yashar +2%. B'Yachad +2%. Likud -2%. Opens Expand the Settlements. Closes the old left."
 ISR_old_left_golan:0 "Golan in Command"
 ISR_old_left_golan_desc:0 "At the end of the old left path. Yair Golan becomes prime minister. The Democrats +5%. Spirit: Golan in Command. Stability +10%. Daily political power +0.15. Research speed +5%."
 ISR_old_left_gantz:0 "Gantz's Cabinet"
 ISR_old_left_gantz_desc:0 "At the end of the old left path. Benny Gantz becomes prime minister. The Democrats +5%. Spirit: Gantz's Cabinet. War support +10%. Division defense +10%. Division recovery +10%."
 ISR_old_left_purse:0 "The Public Purse"
 ISR_old_left_purse_desc:0 "Spirit: The Public Purse. Daily political power +0.10. Stability +5%. Consumer goods +5%. The Democrats +3%."
 ISR_old_left_freeze:0 "Freeze the Settlements"
 ISR_old_left_freeze_desc:0 "Requires The Democrats at 30%. Base stability +5%. War support -5%. Likud -3%. Orthodox -2%. If the Palestinian Authority is our subject, it regains autonomy."
 ISR_old_left_freeze_tt:0 "The Democrats hold at least 30% of the pie."
 ISR_old_left_histadrut:0 "The Histadrut Returns"
 ISR_old_left_histadrut_desc:0 "Spirit: The Histadrut. Factory output +10%. Civilian factory construction +15%. Base stability +5%."
