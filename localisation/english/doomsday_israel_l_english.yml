 dd_isr_eternal_premiership_desc:0 "War support +10%. Daily political power +0.50. Justify war goal time -50%. World tension from war goals -75%. Resistance target -50%. Resistance growth in occupied states -50%. Garrison damage from resistance -50%. Required garrison -40%. Compliance gain +0.15."
