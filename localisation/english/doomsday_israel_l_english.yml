 dd_kurd_us_support_desc:0 "+2 off-map military factories. Division organization +10%. Division defense +10%. Max entrenchment +5 and +25%."
 dd_isr_greater:0 "Greater Israel"
 dd_isr_greater_desc:0 "War support +30%. Stability +20%. Division recovery rate +10%. Resistance target -35%. Resistance growth in occupied states -35%. Garrison damage from resistance -35%. Required garrison -30%. Compliance gain +0.10."
 ISR_northern_frontier:0 "Secure the Northern Frontier"
 ISR_northern_frontier_desc:0 "Claims and state war goals on Lebanon and South Lebanon, plus annex war goals on Syria and Rojava. Requires Oppose a Palestinian State."
 ISR_protect_kurds:0 "Protect the Kurds"
 ISR_protect_kurds_desc:0 "Requires Rojava to exist. Rojava becomes our puppet and we declare war on Syria. Requires Oppose a Palestinian State."
 ISR_target_shiites:0 "Target Shiites in Iraq"
 ISR_target_shiites_desc:0 "Annex war goal on Iraq."
 ISR_jordan_overlord:0 "Demand Jordanian Overlordship"
 ISR_jordan_overlord_desc:0 "Jordan can accept puppet status. If they refuse, we go to war to puppet them."
 ISR_toward_greater:0 "Toward Greater Israel"
 ISR_toward_greater_desc:0 "Claims on Gaza, the West Bank, Jordan, Lebanon, South Lebanon, Sinai, Damascus, Aleppo, and Al Anbar."
 ISR_proclaim_greater:0 "Proclaim Greater Israel"
 ISR_proclaim_greater_desc:0 "Requires every Greater Israel claim to be held by us or a subject. The country is renamed and gains the Greater Israel spirit."
 dd_isr_northern_frontier_tt:0 "Claim Lebanon and South Lebanon, and take a war goal for each state. Annex war goals on Syria and Rojava if they still exist and are not already our subjects or enemies."
 dd_isr_protect_kurds_tt:0 "Puppet Rojava and declare war on Syria."
 dd_isr_target_shiites_tt:0 "Annex war goal on Iraq."
 dd_isr_demand_jordan_tt:0 "Jordan receives an event. Accept: they become our puppet. Refuse: we declare a puppet war."
 dd_isr_greater_claims_tt:0 "Claims on Gaza, the West Bank, Jordan, Lebanon, South Lebanon, Sinai, Damascus, Aleppo, and Al Anbar."
 dd_isr_proclaim_greater_tt:0 "Rename the country Greater Israel. Gain the Greater Israel spirit. Core each of those states that we own."
 dd_isr.2.t:0 "Israel Demands Overlordship"
 dd_isr.2.d:0 "Israel demands that Jordan accept puppet status."
 dd_isr.2.a:0 "Accept."
 dd_isr.2.b:0 "Refuse."

 dd_isr_news.1.t:0 "Hadash Wins in Israel"
 dd_isr_news.1.d:0 "Progressive populists and communists outpolled every other bloc. Ayman Odeh will form the next government unless the communists outnumber the progressives, in which case Ofer Cassif takes office."
 dd_isr_news.1.a:0 "A new coalition."
 dd_isr_news.2.t:0 "Lapid Wins in Israel"
 dd_isr_news.2.d:0 "The opposition held a majority of the pie, and B'Yachad led Yashar. Yair Lapid will form the next government."
 dd_isr_news.2.a:0 "A new coalition."
 dd_isr_news.3.t:0 "Eisenkot Wins in Israel"
 dd_isr_news.3.d:0 "The opposition held a majority of the pie, and Yashar led B'Yachad. Gadi Eisenkot will form the next government."
 dd_isr_news.3.a:0 "A new coalition."
 dd_isr_news.4.t:0 "Netanyahu Holds On"
 dd_isr_news.4.d:0 "The national populists and Otzma Yehudit held a majority of the pie, with the Orthodox if they joined. Benjamin Netanyahu stays prime minister."
 dd_isr_news.4.a:0 "The coalition continues."
 dd_isr_news.5.t:0 "Israel-Palestine Declared"
 dd_isr_news.5.d:0 "The government has renamed the state Israel-Palestine. The IDF has taken Jerusalem and the Golan, and most of the army with them, rather than accept it."
 dd_isr_news.5.a:0 "The country is splitting."

 dd_isr_palestine_war_tt:0 "The country is renamed Israel-Palestine under Ofer Cassif. The flag changes. Generals are dismissed. The Servant Leader is removed here and from the revolt. Any war with Iran ends in a white peace. If Tel Aviv and Jerusalem are held, the capital moves to Tel Aviv. An IDF revolt takes Jerusalem and the Golan, and any IDF spirits. Those spirits are removed here, and the IDF focuses close. Israel keeps a share of the divisions equal to communist support. Twelve fully equipped 2x6 militia divisions appear in the capital. The Golan joins the revolt when it is held. Declare Israel-Palestine completes, and Recognize Arabic as a National Language opens under it."
 dd_isr_hadash_policy_tt:0 "Minorities become National Minority Equalization. +100 political power if that law is already in place."
 dd_isr_democrat_policy_tt:0 "Women become Promote Feminism. Minorities become Minority Uplift Programs. Labour becomes Protected Labour. +100 political power if those laws are already in place."
 dd_isr_grant_gaza_tt:0 "Gaza passes to the Palestinian Authority, if they are our subject. +100 political power if they already hold it."
 dd_isr_strip_idf_tt:0 "The IDF spirit is removed. The IDF focuses stay closed under a communist government."
 dd_isr_idf_sealed_tt:0 "The IDF has revolted. These focuses stay closed."
 dd_isr_border_claims_tt:0 "Claims on Lebanon, South Lebanon, Syria, Jordan, Sinai, Gaza, and the West Bank."
 dd_isr_communist_wave_tt:0 "Every other Middle Eastern country gains Communist Influence: communism +5%."
 dd_isr_puppet_me_tt:0 "Puppet war goals against every other Middle Eastern country we are not already fighting or ruling."
 dd_isr_oppose_palestine_tt:0 "Large annexation progress against the Palestinian Authority. Grants a core on the West Bank."
 dd_isr_silent_mutiny:0 "Silent Mutiny"
 dd_isr_silent_mutiny_desc:0 "Daily political power -0.05. Recruitable population -1%."
 dd_isr_shrinking_growth:0 "Shrinking Economic Growth"
 dd_isr_shrinking_growth_desc:0 "Consumer goods +10%. Construction speed -30%."
 dd_isr_commodities:0 "International Commodities"
 dd_isr_commodities_desc:0 "Foreign buyers keep Israeli goods moving. This adds 12 off-map civilian factories."
 dd_isr_commodities_tt:0 "Off-map civilian factories: §G+12§!"
 dd_isr_idf:0 "The IDF"
 dd_isr_idf_desc:0 "Army experience gain +20%. Planning speed +20%. Division organization +10%. Division recovery rate +15%. Organization loss when moving -20%. AI focus on offense +100%."
 dd_isr_idf_urban:0 "The IDF"
 dd_isr_idf_urban_desc:0 "The IDF, retrained for cities. Organization +15%. Attack and defense +10%. Experience gain +20%. Planning speed +20%. Recovery rate +15%. Organization loss when moving -20%."
 dd_isr_idf_arms:0 "The IDF"
 dd_isr_idf_arms_desc:0 "The IDF with combined arms. Organization +15%. Division attack +10%. Breakthrough +10%. Armor speed +15%. Armor attack +10%. Experience gain +20%. Planning speed +20%. Recovery rate +15%. Organization loss when moving -20%."
 dd_isr_idf_both:0 "The IDF"
 dd_isr_idf_both_desc:0 "Cities and combined arms together. Organization +20%. Division attack +20%. Division defense +10%. Breakthrough +10%. Armor speed +15%. Armor attack +10%. Experience gain +20%. Planning speed +20%. Recovery rate +15%. Organization loss when moving -20%."
 dd_isr_idf_spirit:0 "The IDF"
 dd_isr_idf_spirit_desc:0 "The standing army. It keeps the AI focused on offense. Urban fighting and combined arms change the combat figures on this spirit."
 dd_isr_air_spirit:0 "Israeli Air Force"
 dd_isr_air_spirit_desc:0 "The air force. Air dominance adds the sortie, night, and close air support figures on this spirit."
 dd_isr_airforce:0 "Israeli Air Force"
 dd_isr_airforce_desc:0 "Air mission efficiency +15%. Air range +20%."
 dd_isr_airforce_dominance:0 "Israeli Air Force"
 dd_isr_airforce_dominance_desc:0 "Air mission efficiency +15%. Air range +20%. Fighter sortie efficiency +15%. Sortie efficiency +10%. Night penalty -20%. Close air support efficiency +15%."
 dd_isr_navy:0 "Israeli Navy"
 dd_isr_navy_desc:0 "Fleet range +40%. Submarines are 40% less visible and have +50% range."
 dd_isr_navy_brown:0 "Brownwater Fleet"
 dd_isr_navy_brown_desc:0 "Keeps the navy's range and submarine bonuses. Destroyers and coastal defense ships cost 20% less to build."
 ISR_rebuild_infra:0 "Rebuild Infrastructure"
 ISR_rebuild_infra_desc:0 "Requires peace. +1 infrastructure in every owned state that is not already at the maximum. Removes Shrinking Economic Growth."
 ISR_foreign_capital:0 "Attract Foreign Capital"
 ISR_foreign_capital_desc:0 "+4 off-map civilian factories."
 ISR_defence_infra:0 "Israeli Defence Infrastructure"
 ISR_defence_infra_desc:0 "One military factory and one anti-air site in the capital and in Tel Aviv. One anti-air site on the Golan, if those states are held."
 ISR_expand_civ_industry:0 "Expand Civilian Industry"
 ISR_expand_civ_industry_desc:0 "Two civilian factories in the capital. One in Tel Aviv. One on the Golan Heights."
 ISR_expand_mil_production:0 "Expand Military Production"
 ISR_expand_mil_production_desc:0 "One military factory in the capital and one in Tel Aviv."
 ISR_the_idf:0 "The IDF"
 ISR_the_idf_desc:0 "Spirit: The IDF. Army experience gain +20%. Planning speed +20%. Organization +10%. Recovery rate +15%. Organization loss when moving -20%. AI focus on offense +100%."
 ISR_urban_fighting:0 "Adjusting to Urban Fighting"
 ISR_urban_fighting_desc:0 "The IDF spirit gains organization +5% and attack and defense +10%."
 ISR_combined_arms:0 "Combined Arms"
 ISR_combined_arms_desc:0 "The IDF spirit gains organization +5%, division attack +10%, breakthrough +10%, armor speed +15%, and armor attack +10%."
 ISR_airforce:0 "Israeli Air Force"
 ISR_airforce_desc:0 "Spirit: Israeli Air Force. Air mission efficiency +15%. Air range +20%."
 ISR_air_tech:0 "Stay on Top of Tech"
 ISR_air_tech_desc:0 "Three research bonuses for air equipment."
 ISR_air_tech_bonus:0 "Israeli air research"
 ISR_air_dominance:0 "Aerial Dominance"
 ISR_air_dominance_desc:0 "The air force spirit gains sortie efficiency, a smaller night penalty, and close air support efficiency."
 ISR_navy:0 "Israeli Navy"
 ISR_navy_desc:0 "Spirit: Israeli Navy. Fleet range +40%. Submarine visibility -40%. Submarine range +50%."
 ISR_brownwater:0 "Expand the Brownwater Fleet"
 ISR_brownwater_desc:0 "Replaces Israeli Navy with Brownwater Fleet. Destroyers and coastal defense ships cost 20% less to build."
 ISR_expand_dockyards:0 "Expand Dockyards"
 ISR_expand_dockyards_desc:0 "Two dockyards in Tel Aviv."
 ISR_the_diaspora:0 "The Diaspora"
 ISR_the_diaspora_desc:0 "Opens the Diaspora menu. Click an empty slot, then click a qualifying country capital on the map for 200 political power. Each slot starts at 10 influence."
 dd_isr_diaspora_open_tt:0 "Opens the Diaspora decision menu with five slots."
 dd_isr_fight_antisemitism_tt:0 "Every filled diaspora slot gains 10 influence."
 dd_isr_europe_inf_tt:0 "Every European diaspora slot gains 10 influence."
 dd_isr_repair_usa_inf_tt:0 "If the United States still holds a diaspora slot, that slot gains 20 influence."
 ISR_fight_antisemitism:0 "Fight Against Antisemitism"
 ISR_fight_antisemitism_desc:0 "Every filled diaspora slot gains 10 influence."
 ISR_diaspora_leverage:0 "Expand Political Leverage"
 ISR_diaspora_leverage_desc:0 "Unlocks a decision to puppet a country in a diaspora slot for 100 influence. They stay in the slot."
 dd_isr_diaspora_assign:0 "Assign to the Diaspora"
 dd_isr_diaspora_assign_desc:0 "Pay 200 political power. The country must be democratic socialist (not a democratic-socialist United States), market liberal, conservative, or a national-populist United States. The slot starts at 10 influence."
 dd_isr_diaspora_expand:0 "Expand Influence"
 dd_isr_diaspora_expand_desc:0 "Pay 200 political power. This slot gains 20 influence."
 dd_isr_diaspora_boost:0 "Boost Relations"
 dd_isr_diaspora_boost_desc:0 "Spend 5 influence. That country gains +100 opinion of us for one year."
 dd_isr_diaspora_arms:0 "Secure Arms"
 dd_isr_diaspora_arms_desc:0 "Spend 10 influence. That country ships one month of the American arms package: 350 infantry equipment, 35 artillery, 10 long-range SAMs, and 5 tanks."
 dd_isr_diaspora_puppet:0 "Puppet through the Diaspora"
 dd_isr_diaspora_puppet_desc:0 "Spend 100 influence. That country becomes our puppet and stays in the slot."
