 dd_isr_diaspora_map_assign_desc:0 "Pay 200 political power. Place this country in the selected empty slot at 10 influence."

 dd_isr.10.t:0 "He Sat on the Warning"
 dd_isr.10.d:0 "A newspaper prints the warning that reached the prime minister before 7 October. It named the attack. It was not passed on."
 dd_isr.10.a:0 "Buried the warning"
 dd_isr.10.b:0 "He held firm"
 dd_isr.10.c:0 "The state failed"
 dd_isr.10.e:0 "Betrayed the army"
 dd_isr.10.f:0 "Ask the generals"

 dd_isr.11.t:0 "The Trial Goes On"
 dd_isr.11.d:0 "The Jerusalem court will not delay again. The prime minister is still a defendant while he asks for another term."
 dd_isr.11.a:0 "Unfit to lead"
 dd_isr.11.b:0 "A rigged court"
 dd_isr.11.c:0 "Rule by gifts"
 dd_isr.11.e:0 "Finish the trial"
 dd_isr.11.f:0 "Face the court"

 dd_isr.12.t:0 "Payments from Doha"
 dd_isr.12.d:0 "Reporters tie the prime minister's circle to Qatari money, paid while Doha mediated with Hamas. The aides deny it."
 dd_isr.12.a:0 "Sold the office"
 dd_isr.12.b:0 "A smear"
 dd_isr.12.c:0 "Sold the war"
 dd_isr.12.e:0 "Clean house"
 dd_isr.12.f:0 "The aides were bought"

 dd_isr_reactionary_ripple:0 "The Reactionary Ripple"
 dd_isr_reactionary_ripple_desc:0 "Weekly communism support +0.05%."
 dd_isr_reactionary_ripple_tt:0 "Weekly communism support +0.05%."

 dd_isr.20.t:0 "The Authority Is Gone"
 dd_isr.20.d:0 "The Palestinian Authority has been annexed. Communist support is above 25%, so the left treats the annexation as proof that the government will not stop."
 dd_isr.20.a:0 "Communist support grows"
 dd_isr.21.t:0 "The Tyrant Must Fall"
 dd_isr.21.d:0 "Two days later the same current demands the prime minister be brought down. The army that still answers to him will not accept it."
 dd_isr.21.a:0 "The tyrant must fall"
 dd_isr.22.t:0 "Hendel and Zelekha"
 dd_isr.22.d:0 "Yoaz Hendel and Yaron Zelekha will take administrative posts. Giving them the posts costs 50 political power. The leading list in this coalition gains support."
 dd_isr.22.a:0 "Give them the posts"
 dd_isr.22.b:0 "Leave the offices empty"
 dd_isr.23.t:0 "The Opposition Is Asked"
 dd_isr.23.d:0 "The opposition has 28 days."
 dd_isr.23.a:0 "The clock starts."
 dd_isr.24.t:0 "Netanyahu Is Asked"
 dd_isr.24.d:0 "Netanyahu has 28 days. He starts with the national populists and Otzma Yehudit. The Orthodox join if they accept."
 dd_isr.24.a:0 "The clock starts."
 dd_isr.25.t:0 "No Government"
 dd_isr.25.d:0 "Neither side held a majority of the pie. A new election is called. In four months the count begins again, and each side may try once more to form a government."
 dd_isr.25.a:0 "Back to the campaign."
 dd_isr.26.t:0 "Golan or Lieberman"
 dd_isr.26.d:0 "Yair Golan or Avigdor Lieberman."
 dd_isr.26.a:0 "Side with Golan"
 dd_isr.26.b:0 "Side with Lieberman"
 dd_isr.27.t:0 "Meet with Hadash"
 dd_isr.27.d:0 "Hadash will enter the coalition, or stay out."
 dd_isr.27.a:0 "Bring them in"
 dd_isr.27.b:0 "Keep them out"
 dd_isr_hadash_join_tt:0 "Hadash joins the coalition."
 dd_isr_hadash_out_tt:0 "Hadash stays out of the coalition."
 dd_isr.28.t:0 "The Orthodox Join"
 dd_isr.28.d:0 "Protect Torah Study brought Shas and United Torah Judaism into the coalition."
 dd_isr.28.a:0 "They join."
 dd_isr.31.t:0 "The Orthodox Refuse"
 dd_isr.31.d:0 "The draft without exemptions keeps Shas and United Torah Judaism out of the coalition."
 dd_isr.31.a:0 "They stay out."
 dd_isr.32.t:0 "The Orthodox"
 dd_isr.32.d:0 "Neither No Exemptions nor Protect Torah Study has settled the draft. Shas and United Torah Judaism will enter the coalition, or stay out. Letting them in opens Restore Yeshiva Traditions. Keeping them out opens Neglect the Haredi."
 dd_isr.32.a:0 "Let them in"
 dd_isr.32.b:0 "Keep them out"
 dd_isr.29.t:0 "Lapid or Eisenkot"
 dd_isr.29.d:0 "Lapid or Eisenkot. Yashar is the larger list, so Gadi Eisenkot leads the coalition."
 dd_isr.29.a:0 "Eisenkot leads."
 dd_isr.30.t:0 "Lapid or Eisenkot"
 dd_isr.30.d:0 "Lapid or Eisenkot. B'Yachad is at least as large as Yashar, so Yair Lapid leads the coalition."
 dd_isr.30.a:0 "Lapid leads."
