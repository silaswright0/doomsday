 ISR_expand_settlements:0 "Expand the Settlements"
 ISR_expand_settlements_desc:0 "Requires Side with Lieberman or The Coalition Survives. War support +5%. Base stability -5%. Large annexation progress against the Palestinian Authority. Claims on the West Bank and Gaza. Opinion of the Palestinian Authority -50."
 ISR_dahiya_doctrine:0 "Enshrine the Dahiya Doctrine"
