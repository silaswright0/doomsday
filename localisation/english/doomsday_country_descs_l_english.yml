l_english:
 ABK_DOOMSDAY_DESC:0 "Abkhazia is a Russian-backed Black Sea republic that Georgia still claims. Its budget and its security both run through Moscow."
 AFG_DOOMSDAY_DESC:0 "Afghanistan is ruled by a jihadist emirate. The state is clerical, armed, and unrecognized by most of the world."
 ALB_DOOMSDAY_DESC:0 "Albania is a small Adriatic NATO member under a social-democratic cabinet, with a weak industrial base and a large diaspora."
 ALG_DOOMSDAY_DESC:0 "Algeria is a managed petrostate with a large army and a closed politics. Gas pays the social peace."
 ANG_DOOMSDAY_DESC:0 "Angola is a managed oil and diamond state on the Atlantic. The old ruling party still holds the presidency."
 ARG_DOOMSDAY_DESC:0 "Argentina is a large South American democracy under a liberal-conservative shock cabinet. Industry, soy, and a chronic currency crisis share the country."
 ARM_DOOMSDAY_DESC:0 "Armenia is a small Caucasus democracy under a liberal cabinet, defeated in Karabakh and looking for a security patron that is not only Russia."
 AST_DOOMSDAY_DESC:0 "Australia is a wealthy Pacific democracy with ore, gas, and a small population. A social-democratic cabinet is rearming for a contest with China."
 ATG_DOOMSDAY_DESC:0 "Antigua and Barbuda is a small Caribbean democracy under a conservative cabinet. Tourism is the state."
 AUS_DOOMSDAY_DESC:0 "Austria is a rich, neutral industrial state under a conservative cabinet. It sits between Germany, Italy, and a more dangerous eastern neighbourhood."
 AZA_DOOMSDAY_DESC:0 "Azawad is the junta-backed Tuareg and Islamist-contested north of Mali, claimed as a state. Bamako does not agree."
 AZR_DOOMSDAY_DESC:0 "Azerbaijan is a managed petrostate on the Caspian. It has won on the battlefield in Karabakh and is armed by Turkey and Israel."
 BAH_DOOMSDAY_DESC:0 "The Bahamas are a small, rich-on-paper Caribbean democracy under a liberal cabinet. Finance and tourism are the economy, and the hurricane is the risk."
 BAN_DOOMSDAY_DESC:0 "Bangladesh is a dense industrializing democracy under a conservative restoration after the fall of the old ruling party. Garments and the delta are the economy."
 BEL_DOOMSDAY_DESC:0 "Belgium is a wealthy, divided federation and the host of NATO and the European institutions. A conservative cabinet governs a country that argues in two languages."
 BHR_DOOMSDAY_DESC:0 "Bahrain is a small island monarchy tied to Saudi Arabia and to the American fleet. The ruling family is Sunni. Much of the population is not."
 BHU_DOOMSDAY_DESC:0 "Bhutan is a small Himalayan kingdom-in-practice under an elected conservative cabinet. India is the security patron."
 BLR_DOOMSDAY_DESC:0 "Belarus is a managed state tied to Moscow, used as a rear area for the war in Ukraine. The presidency does not rotate."
 BLZ_DOOMSDAY_DESC:0 "Belize is a small English-speaking Central American democracy under a liberal cabinet, with a Guatemalan claim it has never quite shaken."
 BOL_DOOMSDAY_DESC:0 "Bolivia is a highland state under a left-nationalist government. Gas and lithium are the economy, and the lowlands do not love La Paz."
 BOS_DOOMSDAY_DESC:0 "Bosnia is a locked consociational state under a conservative-led presidency. The entities still disagree on whether the country should hold."
 BOT_DOOMSDAY_DESC:0 "Botswana is a small, relatively rich southern African democracy under a conservative cabinet. Diamonds built the state."
 BRA_DOOMSDAY_DESC:0 "Brazil is the largest economy in Latin America, democratic and unequal, with industry, soy, and the Amazon. A social-democratic cabinet is back in Brasilia."
 BRB_DOOMSDAY_DESC:0 "Barbados is a small Caribbean republic under a liberal cabinet. Tourism and the offshore sector pay the bills."
 BRD_DOOMSDAY_DESC:0 "Burundi is a poor Great Lakes state under a military presidency. Land is scarce and politics is not gentle."
 BRM_DOOMSDAY_DESC:0 "Myanmar is under a military junta at war with the National Unity Government and a dozen ethnic armies. The cities and the borders are not the same country."
 BRN_DOOMSDAY_DESC:0 "Brunei is a tiny, very rich absolute monarchy on Borneo. Oil and gas are the state."
 BUL_DOOMSDAY_DESC:0 "Bulgaria is a poorer NATO and EU member under a conservative cabinet, pulled between Brussels and older ties to Russia."
 CAM_DOOMSDAY_DESC:0 "Cambodia is a managed state under a hereditary premiership, close to China, with a weak industrial base beyond garments and the Chinese coast."
 CAN_DOOMSDAY_DESC:0 "Canada is a rich, sparsely settled federation with oil, grain, and a long Arctic coast. A liberal cabinet is tied to the United States on trade and defence."
 CAR_DOOMSDAY_DESC:0 "The Central African Republic is a poor, landlocked state under a military presidency, with Russian auxiliaries and little else."
 CBV_DOOMSDAY_DESC:0 "Cabo Verde is a small Atlantic island democracy under a liberal cabinet. The diaspora is larger than the country."
 CHA_DOOMSDAY_DESC:0 "Chad is a poor Saharan state under a military succession. The army is the state, and the borders leak."
 CHL_DOOMSDAY_DESC:0 "Chile is a stable South American democracy under a social-democratic cabinet. Copper and lithium pay for a state the voters keep arguing over."
 CMR_DOOMSDAY_DESC:0 "Cameroon is a managed Central African state with an aging presidency, oil, and a war in the Anglophone west."
 COG_DOOMSDAY_DESC:0 "The DR Congo is a vast, weakly governed state under a liberal cabinet, sitting on cobalt and copper and at war in the east."
 COL_DOOMSDAY_DESC:0 "Colombia is a democratic Andean state under a left-populist presidency, still living with the remnants of guerrilla and cocaine economies."
 COM_DOOMSDAY_DESC:0 "Comoros is a small Indian Ocean island state under a military presidency. The economy is vanilla, remittances, and the diaspora."
 COS_DOOMSDAY_DESC:0 "Costa Rica is a Central American democracy under a liberal cabinet, without a standing army. The exception in the isthmus is the point."
 CRO_DOOMSDAY_DESC:0 "Croatia is a small Adriatic NATO and EU member under a conservative cabinet, still organized by the memory of the Yugoslav wars."
 CUB_DOOMSDAY_DESC:0 "Cuba is a one-party socialist island, poor, armed, and ninety miles from the United States."
 CYP_DOOMSDAY_DESC:0 "Cyprus is a divided EU member under a conservative Greek-Cypriot government. The Turkish north is the unfinished war."
 CZE_DOOMSDAY_DESC:0 "Czechia is a central European industrial democracy under a conservative cabinet. It is inside NATO and exposed to the war further east."
 DAH_DOOMSDAY_DESC:0 "Benin is a small West African democracy under a liberal cabinet, next to a coup belt it is trying not to join."
 DEN_DOOMSDAY_DESC:0 "Denmark is a small, rich social democracy that controls the entrance to the Baltic. Greenland and the Arctic are part of its strategic problem."
 DJI_DOOMSDAY_DESC:0 "Djibouti is a tiny Red Sea state under a military presidency. Foreign bases are the national industry."
 DMA_DOOMSDAY_DESC:0 "Dominica is a small Caribbean island democracy under a liberal cabinet. The economy is tourism, passports, and bananas."
 DOM_DOOMSDAY_DESC:0 "The Dominican Republic is the larger Caribbean industrial state, under a conservative cabinet, sharing Hispaniola with a collapsed Haiti."
 DPK_DOOMSDAY_DESC:0 "North Korea is a hereditary party-state with nuclear weapons and a ruined civilian economy. The army and the Kim family are the state."
 DRZ_DOOMSDAY_DESC:0 "Suwayda is a Druze-led enclave in southern Syria that has slipped the new government's grip. It is local rule with a gun, not a recognized state."
 ECU_DOOMSDAY_DESC:0 "Ecuador is an Andean oil democracy under a conservative cabinet, at war with its own gangs."
 EGY_DOOMSDAY_DESC:0 "Egypt is the largest Arab state, ruled by a military presidency since 2013. The Suez Canal, the Nile, and the army are the regime."
 ELS_DOOMSDAY_DESC:0 "El Salvador is a small Central American state under a national-populist presidency that has jailed its way through the gang problem."
 EQG_DOOMSDAY_DESC:0 "Equatorial Guinea is a small, closed oil state. The family rules. The voters do not."
 ERI_DOOMSDAY_DESC:0 "Eritrea is a closed mobilization state on the Red Sea. Politics does not exist outside the presidency and the army."
 EST_DOOMSDAY_DESC:0 "Estonia is a small, digital Baltic NATO member under a liberal cabinet, with a Russian-speaking minority and a hard border to the east."
 ETH_DOOMSDAY_DESC:0 "Ethiopia is a managed federal state, the demographic giant of the Horn, still armed and still divided after the Tigray war."
 FIJ_DOOMSDAY_DESC:0 "Fiji is the main island state of the South Pacific, under a conservative cabinet after a long coup era."
 FIN_DOOMSDAY_DESC:0 "Finland is a well-armed democracy that has joined NATO, under a conservative cabinet. It shares a long border with Russia."
 FOR_DOOMSDAY_DESC:0 "Taiwan is a self-governing democracy under a liberal presidency. Beijing claims it, and the strait is the most dangerous water in Asia."
 FSM_DOOMSDAY_DESC:0 "Micronesia is a small Pacific state in free association with the United States. The compact is the budget."
 GAB_DOOMSDAY_DESC:0 "Gabon is an oil state under a junta that ended the Bongo succession. The coast is rich and the interior is not."
 GAM_DOOMSDAY_DESC:0 "The Gambia is a small river state under a conservative cabinet, surrounded by Senegal except at the sea."
 GEO_DOOMSDAY_DESC:0 "Georgia is a managed Caucasus state that still wants Europe and still lives with Russian troops in Abkhazia and South Ossetia."
 GHA_DOOMSDAY_DESC:0 "Ghana is a West African social democracy with gold, cocoa, and a debt problem. Elections still change the government."
 GNA_DOOMSDAY_DESC:0 "Guinea is under a junta that took the bauxite state and has not given it back. Simandou and the port are the prize."
 GNB_DOOMSDAY_DESC:0 "Guinea-Bissau is a small coastal state under a junta, known more for coups and cocaine routes than for industry."
 GND_DOOMSDAY_DESC:0 "Grenada is a small Caribbean democracy under a social-democratic cabinet. Tourism is the economy."
 GRE_DOOMSDAY_DESC:0 "Greece is a democratic Aegean state under a conservative cabinet. It balances Turkey, the islands, and a heavy debt legacy."
 GRN_DOOMSDAY_DESC:0 "Greenland is a self-governing social democracy with a tiny population, vast ice, and growing outside interest in its minerals and bases."
 GUA_DOOMSDAY_DESC:0 "Guatemala is a Central American democracy under a conservative cabinet, with a weak state and a long oligarchic argument."
 GYA_DOOMSDAY_DESC:0 "Guyana is a small South American social democracy sitting on a sudden offshore oil boom."
 HAI_DOOMSDAY_DESC:0 "Haiti is a Caribbean state under a military-backed transitional authority. Gangs hold more of the capital than the ministries do."
 HAM_DOOMSDAY_DESC:0 "Hamas is the jihadist administration of Gaza, at war with Israel. It governs a ruined strip by gun and tunnel."
 HEZ_DOOMSDAY_DESC:0 "Hezbollah is an armed clerical movement that holds south Lebanon and a share of the Lebanese state. It fights Israel and answers, in the end, to Tehran."
 HOL_DOOMSDAY_DESC:0 "The Netherlands is a rich trading state with ports, gas politics, and a conservative cabinet. Its security still runs through NATO and the North Sea."
 HON_DOOMSDAY_DESC:0 "Honduras is a poor Central American democracy under a left-populist presidency. Migration and the army are the standing facts."
 HOU_DOOMSDAY_DESC:0 "The Houthis hold northern Yemen, including Sanaa, as an armed clerical movement. They close the Red Sea when they choose."
 HUN_DOOMSDAY_DESC:0 "Hungary is an EU and NATO member under a long-running national-populist government. It bargains with Brussels and keeps a line open to Moscow."
 ICE_DOOMSDAY_DESC:0 "Iceland is a small North Atlantic social democracy in NATO, without an army of its own. Fish, energy, and the GIUK gap are the strategic facts."
 INS_DOOMSDAY_DESC:0 "Indonesia is the largest state in Southeast Asia, democratic, Muslim-majority, and spread across thousands of islands. A conservative former general holds the presidency."
 IRE_DOOMSDAY_DESC:0 "Ireland is a rich, neutral republic whose economy is built on foreign investment. A conservative cabinet keeps the country outside NATO."
 IRQ_DOOMSDAY_DESC:0 "Iraq is an elected Islamic-democratic state split among Shia, Sunni, and Kurdish power. Oil pays the budget, and militias share the gun."
 ISR_DOOMSDAY_DESC:0 "Israel is a high-tech, nuclear-ambiguous democracy at war, under a national-populist cabinet. Gaza, Lebanon, and Iran are the fronts."
 ITA_DOOMSDAY_DESC:0 "Italy is a G7 industrial power under a national-populist cabinet. Debt is heavy, and the state is pulled between Brussels, the Mediterranean, and Libya."
 IVO_DOOMSDAY_DESC:0 "Cote d'Ivoire is the economic heavyweight of French-speaking West Africa, under a conservative presidency. Cocoa and the port of Abidjan pay for the state."
 JAM_DOOMSDAY_DESC:0 "Jamaica is a small Caribbean democracy under a conservative cabinet. Debt, tourism, and the diaspora are the economy."
 JOR_DOOMSDAY_DESC:0 "Jordan is a Hashemite absolute monarchy, poor in oil and rich in strategic rent. It holds the West Bank border and a large refugee population."
 JUB_DOOMSDAY_DESC:0 "Jubaland is the Somali federal state on the Kenyan border. It has its own presidency, its own clan army, and a quarrel with Mogadishu."
 KAZ_DOOMSDAY_DESC:0 "Kazakhstan is a large, managed Central Asian state with oil, uranium, and a long border on Russia and China."
 KEN_DOOMSDAY_DESC:0 "Kenya is East Africa's commercial hub, a democracy under a conservative presidency, with a Somali-border war that never quite ends."
 KIR_DOOMSDAY_DESC:0 "Kiribati is a Pacific island state spread across an ocean, under a conservative cabinet. Sea level and fishing licences are the national questions."
 KOR_DOOMSDAY_DESC:0 "South Korea is a wealthy industrial democracy facing a nuclear neighbour across a live armistice. A social-democratic cabinet has to fund chips, ships, and the army."
 KOS_DOOMSDAY_DESC:0 "Kosovo is a partially recognized republic under a left-nationalist cabinet. Serbia does not accept it, and the north remains tense."
 KUW_DOOMSDAY_DESC:0 "Kuwait is a small oil monarchy on the Gulf, rich per head and permanently aware of Iraq and Iran."
 KYR_DOOMSDAY_DESC:0 "Kyrgyzstan is a poor, mountainous Central Asian state under a personalized presidency, with Russian and Chinese leverage overhead."
 LAO_DOOMSDAY_DESC:0 "Laos is a one-party socialist state, poor and landlocked, financed by dams, mines, and Chinese credit."
 LAT_DOOMSDAY_DESC:0 "Latvia is a small Baltic NATO member under a conservative cabinet. Its politics are shaped by the Russian border and a large Russian-speaking minority."
 LBA_DOOMSDAY_DESC:0 "The Government of National Unity sits in Tripoli and claims all of Libya. It holds the west, the oil negotiations, and little of the east."
 LEB_DOOMSDAY_DESC:0 "Lebanon is a bankrupt consociational state under a military president, with Hezbollah still armed inside its borders."
 LES_DOOMSDAY_DESC:0 "Lesotho is a mountain kingdom entirely inside South Africa, under a conservative cabinet. The economy is water, labour, and Maseru."
 LIB_DOOMSDAY_DESC:0 "Liberia is a small West African democracy under a conservative cabinet, still poor after two civil wars."
 LIT_DOOMSDAY_DESC:0 "Lithuania is a Baltic NATO member under a social-democratic cabinet, sitting between Belarus, Kaliningrad, and the war."
 LNA_DOOMSDAY_DESC:0 "The Libyan National Army holds Benghazi, Cyrenaica, and much of Fezzan under a military command. It is the eastern half of a country that never reunified."
 LUX_DOOMSDAY_DESC:0 "Luxembourg is a tiny, very rich liberal state. Finance is the country."
 M23_DOOMSDAY_DESC:0 "M23 is an armed movement in eastern Congo, backed from Rwanda. It holds towns and a negotiation, not a country."
 MAC_DOOMSDAY_DESC:0 "North Macedonia is a small Balkan NATO member under a conservative cabinet, still waiting on the European Union."
 MAD_DOOMSDAY_DESC:0 "Madagascar is a large, poor island under a conservative presidency. Vanilla, nickel, and politics that keep resetting are the constants."
 MAL_DOOMSDAY_DESC:0 "Malaysia is a middle-income Islamic democracy under an elected reform cabinet. Oil, chips, and the Strait of Malacca pay the bills."
 MAU_DOOMSDAY_DESC:0 "Mauritius is a small, relatively rich Indian Ocean social democracy. Sugar, finance, and the port are the economy."
 MEX_DOOMSDAY_DESC:0 "Mexico is a large industrial democracy tied to the United States by trade and by the border. A left-populist succession is deepening the state and the army's domestic role."
 MHL_DOOMSDAY_DESC:0 "The Marshall Islands are a Pacific republic in free association with the United States. The missile range and the rising sea are both national facts."
 MLD_DOOMSDAY_DESC:0 "The Maldives are a small Indian Ocean state under a conservative cabinet, living on tourism and the argument between India and China."
 MLI_DOOMSDAY_DESC:0 "Mali is under a junta that has broken with France and brought in Russian auxiliaries. The north and the center are not pacified."
 MLT_DOOMSDAY_DESC:0 "Malta is a small EU social democracy in the central Mediterranean. Finance, flags of convenience, and migration are the standing issues."
 MLW_DOOMSDAY_DESC:0 "Malawi is a poor, densely settled southern African democracy under a conservative cabinet. Tobacco and aid are the budget."
 MNT_DOOMSDAY_DESC:0 "Montenegro is a small Adriatic NATO member under a conservative cabinet, newly separated from Serbia and still politically brittle."
 MOL_DOOMSDAY_DESC:0 "Moldova is a poor democracy under a liberal cabinet, with Russian troops in Transnistria and a long exposure to the war next door."
 MON_DOOMSDAY_DESC:0 "Mongolia is a democratic buffer between Russia and China, under a conservative cabinet. Its leverage is coal, copper, and distance."
 MOR_DOOMSDAY_DESC:0 "Morocco is a monarchy that allows parties and does not allow them to rule. Western Sahara is the national cause."
 MRT_DOOMSDAY_DESC:0 "Mauritania is a Saharan state under a military presidency, between Morocco, Mali, and the jihadist desert."
 MZB_DOOMSDAY_DESC:0 "Mozambique is a long Indian Ocean state under a social-democratic ruling party, with gas in the north and an insurgency on top of it."
 NAU_DOOMSDAY_DESC:0 "Nauru is a tiny phosphate island with a conservative government and an offshore-processing economy."
 NCY_DOOMSDAY_DESC:0 "Northern Cyprus is a Turkish-backed republic that only Turkey recognizes. The Green Line is the border that matters."
 NEP_DOOMSDAY_DESC:0 "Nepal is a poor Himalayan democracy under a social-democratic cabinet, squeezed between India and China."
 NGA_DOOMSDAY_DESC:0 "Nigeria is Africa's demographic giant, a federal democracy under a conservative presidency, with oil, a huge internal market, and several live insurgencies."
 NGR_DOOMSDAY_DESC:0 "Niger is under a junta that followed Mali and Burkina Faso out of the Western security system. Uranium and the Sahel insurgency remain."
 NIC_DOOMSDAY_DESC:0 "Nicaragua is a left-nationalist family state. Elections happen. The opposition does not really compete."
 NMB_DOOMSDAY_DESC:0 "Namibia is a sparsely settled social democracy with diamonds, uranium, and a long Atlantic coast."
 NOR_DOOMSDAY_DESC:0 "Norway is a small, rich social democracy funded by oil and gas. It watches the High North and the Russian border."
 NRF_DOOMSDAY_DESC:0 "The National Resistance Front holds pockets of northern Afghanistan against the Taliban. It is an armed liberal claim, not a settled government."
 NUG_DOOMSDAY_DESC:0 "The National Unity Government claims to be Myanmar's elected successor. It fights the junta from exile and through allied ethnic armies."
 NZL_DOOMSDAY_DESC:0 "New Zealand is a rich, remote Pacific democracy under a conservative cabinet. Its security is distance plus Australia and the United States."
 OMA_DOOMSDAY_DESC:0 "Oman is a quiet absolute monarchy at the mouth of the Gulf. It keeps open to Iran and to the Arab capitals at the same time."
 PAK_DOOMSDAY_DESC:0 "Pakistan is a nuclear state with an elected Islamic-democratic government and an army that has not left politics. India and the Afghan border organize its strategy."
 PAL_DOOMSDAY_DESC:0 "The Palestinian Authority is a managed administration in the West Bank. It is not a full state, and it does not control Gaza."
 PAN_DOOMSDAY_DESC:0 "Panama is a service democracy under a conservative cabinet. The canal is the state."
 PAR_DOOMSDAY_DESC:0 "Paraguay is a landlocked South American democracy under a conservative party that rarely loses. Beef, soy, and cheap electricity are the economy."
 PER_DOOMSDAY_DESC:0 "Iran is a clerical state with a large missile force, a sanctioned economy, and proxies from Lebanon to Yemen. An elected president administers. He does not rule."
 PHI_DOOMSDAY_DESC:0 "The Philippines is a large island democracy under a conservative dynastic presidency. The South China Sea is the strategic fact."
 PLU_DOOMSDAY_DESC:0 "Palau is a tiny Pacific republic in free association with the United States. The base rights are the strategic fact."
 PMR_DOOMSDAY_DESC:0 "Transnistria is a Russian-backed strip along the Dniester. It is not a normal state, and it survives on Moscow and the old Soviet garrison."
 PNG_DOOMSDAY_DESC:0 "Papua New Guinea is a large, fragmented Melanesian democracy under a conservative cabinet. Gas, gold, and clan politics are the country."
 PNT_DOOMSDAY_DESC:0 "Puntland is the north-eastern Somali federal state. It runs its own coast, its own forces, and a long argument with Mogadishu."
 POL_DOOMSDAY_DESC:0 "Poland is a front-line NATO state with a growing army and a conservative cabinet. The war in Ukraine is the fact that organizes its politics."
 POR_DOOMSDAY_DESC:0 "Portugal is a democratic Atlantic state under a conservative cabinet, with a small industrial base and old ties to Africa and Brazil."
 PRU_DOOMSDAY_DESC:0 "Peru is an Andean mining democracy under a conservative cabinet, politically brittle and central to the world's copper."
 QAT_DOOMSDAY_DESC:0 "Qatar is a gas monarchy with a global media arm and a diplomatic habit of talking to everyone, including people its neighbours will not."
 RCG_DOOMSDAY_DESC:0 "The Republic of the Congo is a managed oil state on the right bank of the river. Politics is the presidency and the field."
 ROJ_DOOMSDAY_DESC:0 "Rojava is the Kurdish-led confederal administration of northeast Syria. It governs by council and holds its ground with its own armed forces."
 ROM_DOOMSDAY_DESC:0 "Romania is a Black Sea NATO state under a conservative cabinet, with a growing army and a long border on Ukraine."
 RSF_DOOMSDAY_DESC:0 "The Rapid Support Forces are the paramilitary that is trying to become a state in western Sudan. Gold, guns, and Gulf money keep it in the field."
 RWA_DOOMSDAY_DESC:0 "Rwanda is a managed development state with a disciplined army and a long reach into eastern Congo."
 SAF_DOOMSDAY_DESC:0 "South Africa is the industrial core of the continent, a social democracy with failing power, high unemployment, and regional ambitions."
 SAM_DOOMSDAY_DESC:0 "Samoa is a small Polynesian state with a managed, customary democracy. Remittances and the ocean are the economy."
 SAU_DOOMSDAY_DESC:0 "Saudi Arabia is an absolute monarchy funded by oil and run by the crown prince. It is rearming and trying to exit the Yemen war on its own terms."
 SEN_DOOMSDAY_DESC:0 "Senegal is a West African democracy under a young left-populist presidency. It is the stable neighbour in a coup belt."
 SER_DOOMSDAY_DESC:0 "Serbia is a Balkan state under a national-populist presidency. It wants the EU, refuses to sanction Russia, and does not recognize Kosovo."
 SEY_DOOMSDAY_DESC:0 "Seychelles is a small Indian Ocean social democracy. Tourism and the tuna licence are the economy."
 SHB_DOOMSDAY_DESC:0 "Al-Shabaab is the jihadist administration that still holds much of southern Somalia. It taxes the roads the government does not control."
 SIA_DOOMSDAY_DESC:0 "Thailand is a middle-income industrial state under a progressive-populist cabinet, with the palace and the army still in the room."
 SIE_DOOMSDAY_DESC:0 "Sierra Leone is a poor West African democracy under a conservative cabinet, with iron ore and a long recovery from civil war."
 SIO_DOOMSDAY_DESC:0 "The SPLM-IO is the armed opposition that never fully entered the South Sudanese peace. It holds ground and a claim on the government."
 SLO_DOOMSDAY_DESC:0 "Slovakia is a small industrial state under a national-populist cabinet that is cooler toward Ukraine than its neighbours."
 SLV_DOOMSDAY_DESC:0 "Slovenia is a small, rich Alpine democracy under a liberal cabinet, inside NATO and the EU."
 SML_DOOMSDAY_DESC:0 "Somaliland is the unrecognized republic in the north, more orderly than Somalia and still without a seat."
 SNA_DOOMSDAY_DESC:0 "The Syrian National Army is the Turkish-backed force in the north. It holds a strip of Syria as Ankara's instrument."
 SNG_DOOMSDAY_DESC:0 "Singapore is a rich city-state run by technocrats. The port, the banks, and the strait are the country."
 SOE_DOOMSDAY_DESC:0 "South Ossetia is a Russian-backed enclave inside Georgia's old borders. It does not survive without the Russian garrison."
 SOL_DOOMSDAY_DESC:0 "The Solomon Islands are a Pacific state that has swung toward China for police and infrastructure. Australia has not stopped noticing."
 SOM_DOOMSDAY_DESC:0 "Somalia is a federal government in Mogadishu under a military-political presidency. It does not control the country it claims."
 SPR_DOOMSDAY_DESC:0 "Spain is a democratic industrial state with a social-democratic cabinet, high youth unemployment, and unfinished arguments over Catalonia."
 SRL_DOOMSDAY_DESC:0 "Sri Lanka is an island democracy under a left social-democratic cabinet, still climbing out of a debt collapse."
 SSD_DOOMSDAY_DESC:0 "South Sudan is an oil state under a military presidency, formally at peace and locally still armed."
 STC_DOOMSDAY_DESC:0 "The Southern Transitional Council holds Aden and much of the old South Yemen. It wants a state of its own and takes Emirati support."
 STL_DOOMSDAY_DESC:0 "Saint Lucia is a small Caribbean social democracy. Tourism is the state."
 STP_DOOMSDAY_DESC:0 "Sao Tome and Principe is a tiny Gulf of Guinea social democracy. Cocoa and the hope of oil are the economy."
 SUD_DOOMSDAY_DESC:0 "Sudan is a state at war with itself. The army holds the rump government. The Rapid Support Forces hold much of the west and parts of the capital region."
 SUR_DOOMSDAY_DESC:0 "Suriname is a small South American democracy under a conservative cabinet, with oil offshore and a Dutch-speaking coast."
 SVG_DOOMSDAY_DESC:0 "Saint Vincent and the Grenadines is a small Caribbean social democracy. Bananas, tourism, and the volcano are the facts."
 SWE_DOOMSDAY_DESC:0 "Sweden is a high-income industrial state that has just joined NATO, under a conservative cabinet. The Baltic is no longer a quiet shore."
 SWI_DOOMSDAY_DESC:0 "Switzerland is a rich, armed, neutral federation under a conservative federal council. Its leverage is banks, precision industry, and Alpine geography."
 SWZ_DOOMSDAY_DESC:0 "Eswatini is an absolute monarchy squeezed against South Africa. The king rules. Parties do not."
 SYR_DOOMSDAY_DESC:0 "Syria is in the hands of a jihadist-led government after the fall of the old regime. The country is still broken into Rojava, the coast, the south, and the Turkish zone."
 TAJ_DOOMSDAY_DESC:0 "Tajikistan is a poor, managed Central Asian state with a long-serving president and a fragile border on Afghanistan."
 TML_DOOMSDAY_DESC:0 "Timor-Leste is a young social democracy on the edge of Indonesia, living on a finite oil fund."
 TMS_DOOMSDAY_DESC:0 "Turkmenistan is a closed gas state on the Caspian. Politics does not rotate, and the budget is the gas field."
 TOG_DOOMSDAY_DESC:0 "Togo is a managed West African state under a family succession. The port of Lome is the useful asset."
 TRI_DOOMSDAY_DESC:0 "Trinidad and Tobago is a small Caribbean energy state under a conservative cabinet. Gas is the budget."
 TUN_DOOMSDAY_DESC:0 "Tunisia is the Arab Spring's last democracy, now a managed presidency. The factories are few and the debt is not."
 TUR_DOOMSDAY_DESC:0 "Turkey is a regional military power under a national-populist presidency. It sits in NATO while bargaining with Russia, Syria, and the Kurds."
 TUV_DOOMSDAY_DESC:0 "Tuvalu is one of the smallest states on earth, a liberal Pacific democracy that may not have dry land for long."
 TZN_DOOMSDAY_DESC:0 "Tanzania is a large East African social democracy under a long-ruling party. Gas, the port, and a cautious foreign policy are the assets."
 UAE_DOOMSDAY_DESC:0 "The Emirates are a federation of absolute monarchies with oil, ports, and a small expeditionary habit from Yemen to Sudan."
 UGA_DOOMSDAY_DESC:0 "Uganda is a managed state under a decades-long presidency. It exports troops, coffee, and oil hopes."
 UKR_DOOMSDAY_DESC:0 "Ukraine is a large European state at war with Russia, under a liberal wartime presidency. Industry, ports, and the army are the state."
 URG_DOOMSDAY_DESC:0 "Uruguay is a small, stable social democracy between Argentina and Brazil. The pastures and the banks are the economy."
 UZB_DOOMSDAY_DESC:0 "Uzbekistan is the most populous state in Central Asia, managed from Tashkent, with gas, cotton, and a young population."
 VAN_DOOMSDAY_DESC:0 "Vanuatu is a small Melanesian state with a managed politics, a Chinese courtship, and almost no industry."
 VEN_DOOMSDAY_DESC:0 "Venezuela is an oil state under a left-nationalist government, sanctioned, militarized, and still sitting on the largest reserves in the world."
 VIN_DOOMSDAY_DESC:0 "Vietnam is a one-party socialist state with a capitalist factory coast. It trades with everyone and prepares for China."
 VOL_DOOMSDAY_DESC:0 "Burkina Faso is under a junta fighting jihadists across most of its countryside. The capital governs. The roads often do not."
 WES_DOOMSDAY_DESC:0 "The Sahrawi administration claims Western Sahara against Morocco. It holds the refugee camps and a strip of desert, and little else."
 YEM_DOOMSDAY_DESC:0 "Yemen is a broken state. This government is the recognized rump. The Houthis, the southern council, and the resistance hold the rest."
 YNR_DOOMSDAY_DESC:0 "The Yemeni National Resistance holds the western coast against the Houthis. It is an armed local government, not a restored republic."
 ZAM_DOOMSDAY_DESC:0 "Zambia is a copper state under a liberal cabinet, landlocked and indebted, between Congo and Zimbabwe."
 ZIM_DOOMSDAY_DESC:0 "Zimbabwe is a managed southern African state with minerals, a broken currency, and a ruling party that does not lose."
