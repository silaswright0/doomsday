 doomsday_merc.1.t:0 "Mercenary request"
 doomsday_merc.1.d:0 "[From.GetName] wants to hire one [GetDdMercListedName] for $[?dd_merc_ask|2]B.\n\nAccept is available only while the division you posted is still on the map. Accept takes it off your map and raises that template at their capital, under your command. Decline, or if that division is already gone, charges them nothing."
 doomsday_merc.1.a:0 "Accept"
 doomsday_merc.1.b:0 "Decline"
 doomsday_merc.2.t:0 "Mercenaries hired"
 doomsday_merc.2.d:0 "[From.GetName] accepted. Their division is at your capital. They still command it, and they can recall it."
 doomsday_merc.2.a:0 "Understood"
 doomsday_merc.3.t:0 "Mercenary request declined"
 doomsday_merc.3.d:0 "[From.GetName] declined the mercenary request. You were not charged."
 doomsday_merc.3.a:0 "Understood"
 doomsday_merc.4.t:0 "No division to send"
 doomsday_merc.4.d:0 "[From.GetName] no longer has the posted division on the map. You were not charged."
 doomsday_merc.4.a:0 "Understood"

 doomsday_intel_category:0 "[GetDdIntelAgencyName]"
 doomsday_intel_category_desc:0 "Covert missions. Pick a mission, then click the target country on the map. Invalid targets and water do nothing. 12-month cooldown after any mission."
 DD_INTEL_HEADER:0 "[GetDdIntelAgencyName]"
 DD_INTEL_TIER_LINE:0 "[GetDdIntelAgencyName]  ·  [GetDdIntelTier]"
 DD_INTEL_TIER_TT:0 "Tier 1 ($1.5B/year): CIA, SVR, Mossad.\nTier 2 ($0.5B/year): RGB, VAJA, DGSE, MI6, MSS.\nClick a mission, then click the target on the map. There is no country list in this menu.\nTier 1 destabilize: any country, including yourself.\nTier 1 steal: any other country that is ahead of you in technology.\nTier 1-only missions (assassinate, arm, coup): targets with no agency (or yourself).\nShared missions (sabotage, cyber, and Tier 2 steal): any peer-or-weaker agency. Steal cannot target yourself.\nAfter a self-target, click another country to blame. 12-month cooldown."
 DD_INTEL_TIER_1:0 "§YTier 1§!  ·  $1.5B/year"
 DD_INTEL_TIER_2:0 "§HTier 2§!  ·  $0.5B/year"
