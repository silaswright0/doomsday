 DD_THREAT_SYRIA:0 "Syria Civil War"
 DD_THREAT_MYANMAR:0 "Myanmar Civil War"
 DD_THREAT_SUDAN:0 "Sudan Civil War"
 DD_THREAT_SOUTH_SUDAN:0 "South Sudan Civil War"
 DD_THREAT_CONGO:0 "Kivu War"
 DD_THREAT_AFGHANISTAN:0 "Afghan Civil War"
 DD_THREAT_SAHEL:0 "Azawad War"
 DD_THREAT_WESTERN_SAHARA:0 "Western Sahara War"
 dd_welfare_1:0 "Work or Die"
 dd_welfare_1_desc:0 "No safety net. Factories stay on war work. Stability collapses. No treasury surcharge."
 dd_welfare_2:0 "No Welfare"
 dd_welfare_2_desc:0 "Charity only. Cheaper consumer goods, lower stability. No treasury surcharge."
 dd_welfare_3:0 "Limited Welfare"
 dd_welfare_3_desc:0 "A thin public safety net. Small treasury surcharge (8% of administration)."
 dd_welfare_4:0 "Welfare State"
 dd_welfare_4_desc:0 "Broad entitlements. Higher stability and consumer demand. Large treasury surcharge (32% of administration)."
 dd_welfare_5:0 "Universal Basic Income"
 dd_welfare_5_desc:0 "Cash to every household, paid from the treasury. Extreme surcharge (64% of administration). Consumer-goods factor falls because the state already bought the demand."
 dd_education_1:0 "No Public Education"
 dd_education_1_desc:0 "Schooling is private or none. Research collapses. The public is easier to hold and easier to mobilize."
 dd_education_2:0 "Austerity Education"
 dd_education_2_desc:0 "Bare-bones classrooms. Slow research, high drift defence and war support. No treasury surcharge."
 dd_education_3:0 "Basic Literacy"
 dd_education_3_desc:0 "The state teaches reading and arithmetic. Small treasury surcharge (8% of administration)."
 dd_education_4:0 "Free Primary Schooling"
 dd_education_4_desc:0 "Universal primary school. Faster research. Large treasury surcharge (32% of administration)."
 dd_education_5:0 "Free Secondary Schooling"
 dd_education_5_desc:0 "Free secondary school for all. Much faster research, lower war support. Extreme treasury surcharge (64% of administration)."
 dd_immigration_1:0 "Closed Borders"
 dd_immigration_1_desc:0 "Almost nobody gets in. High stability and war support. Research slows. No treasury surcharge."
 dd_immigration_2:0 "Temporary Student Visas"
 dd_immigration_2_desc:0 "Students only, and they go home. Modest stability and war support. No treasury surcharge."
 dd_immigration_3:0 "Small Immigration Quotas"
 dd_immigration_3_desc:0 "Tight quotas. Slight population growth and a little more ideology drift. No treasury surcharge."
 dd_immigration_4:0 "Large Immigration Quotas"
 dd_immigration_4_desc:0 "Wide quotas. Faster population growth, weaker cohesion. Small treasury surcharge (8% of administration)."
 dd_immigration_5:0 "Mass Migration"
 dd_immigration_5_desc:0 "Open intake. Rapid population growth, heavy stability and war-support cost. Large treasury surcharge (32% of administration)."
 dd_taxes_1:0 "Low Taxes"
 dd_taxes_1_desc:0 "No extra tax take. Faster construction."
 dd_taxes_2:0 "Standard Taxes"
 dd_taxes_2_desc:0 "Standard take: $0.02B per million people plus $0.80B per civilian factory in owned states."
 dd_taxes_3:0 "High Taxes"
 dd_taxes_3_desc:0 "Double the standard take ($0.04B per million people and $1.60B per civilian factory). Political and efficiency cost."
 dd_women_1:0 "No Women's Rights"
 dd_women_1_desc:0 "Women are kept out of civic and industrial life. Higher stability. Slower research and factories. No treasury surcharge."
 dd_women_2:0 "Basic Human Rights"
 dd_women_2_desc:0 "Civil protection without political equality. Mild research and factory penalties. No treasury surcharge."
 dd_women_3:0 "Right to Vote"
 dd_women_3_desc:0 "Equal franchise. Slight stability and a little extra research. No treasury surcharge."
 dd_women_4:0 "Promote Feminism"
 dd_women_4_desc:0 "The state pushes women into labs and factories. Faster research and output, slower population growth (growth rate only, never a headcount cut). Abortion law cannot sit below legal-to-two-months; it is raised to that floor if needed. No treasury surcharge."
 dd_women_5:0 "Attack on the Patriarchy"
 dd_women_5_desc:0 "A hard drive against traditional family law. Factory output jumps. Population growth slows further (still a growth-rate cut, not a purge). Abortion law cannot sit below legal-to-nine-months; it is raised to that floor if needed. No treasury surcharge."
 dd_minority_1:0 "Persecuted Minorities"
 dd_minority_1_desc:0 "Minorities are hunted. Core stability and war support rise. Occupied manpower and resistance collapse. No treasury surcharge."
 dd_minority_2:0 "Disenfranchised Minorities"
 dd_minority_2_desc:0 "No vote, thin rights. Less non-core manpower, more resistance. No treasury surcharge."
 dd_minority_3:0 "Enshrined Minority Rights"
 dd_minority_3_desc:0 "Equal civic law. Slight extra non-core manpower and lower resistance. No treasury surcharge."
 dd_minority_4:0 "Minority Uplift Programs"
 dd_minority_4_desc:0 "Targeted public spending in minority regions. More non-core manpower, less resistance, a trickle of compliance. Large treasury surcharge (32% of administration)."
 dd_minority_5:0 "National Minority Equalization"
 dd_minority_5_desc:0 "Heavy transfers and hiring quotas. Occupied areas comply much faster. Extreme treasury surcharge (64% of administration)."
 dd_investment_1:0 "No State Manipulation"
 dd_investment_1_desc:0 "The treasury stays out of construction. Buildings and infrastructure go up slower. No surcharge."
 dd_investment_2:0 "Limited State Investment"
 dd_investment_2_desc:0 "A thin public-works budget. Small treasury surcharge (8% of administration)."
 dd_investment_3:0 "State Investment Strategies"
 dd_investment_3_desc:0 "Planned public works. Slightly faster construction, faster infrastructure. Medium treasury surcharge (16% of administration)."
 dd_investment_4:0 "Subsidise Key Industry"
 dd_investment_4_desc:0 "Civilians yards get the money. Large treasury surcharge (32% of administration)."
 dd_investment_5:0 "Heavy State Investment and Manipulation"
 dd_investment_5_desc:0 "The state directs yards, mills, and docks. Extreme treasury surcharge (64% of administration)."
 dd_security_1:0 "Abolished Police Force"
 dd_security_1_desc:0 "No police. Chaos, weak encryption, cheap consumer goods, and a little extra war fever. No treasury surcharge."
 dd_security_2:0 "Light Policing"
 dd_security_2_desc:0 "Thin patrols. Lower stability and encryption. No treasury surcharge."
 dd_security_3:0 "Standard Security"
 dd_security_3_desc:0 "Ordinary police and courts. Modest stability and encryption. Consumer goods pay for it. No extra administration surcharge."
 dd_security_4:0 "Heavy Punishment for Crime"
 dd_security_4_desc:0 "Harsh sentences. Higher stability. Consumer goods rise. No extra administration surcharge."
 dd_security_5:0 "Mass Surveillance and Brutal Policing"
 dd_security_5_desc:0 "Cameras, informants, and exemplary punishment. Large treasury surcharge (32% of administration)."
 dd_healthcare_1:0 "No Public Healthcare"
 dd_healthcare_1_desc:0 "Pay or die. Stability and wounded-return rates fall. Population growth slows (it does not reverse). No treasury surcharge."
 dd_healthcare_2:0 "Private and Charity Care"
 dd_healthcare_2_desc:0 "Hospitals exist if you can pay. Milder penalties. No treasury surcharge."
 dd_healthcare_3:0 "Basic Public Clinics"
 dd_healthcare_3_desc:0 "Rural clinics and emergency wards. Small treasury surcharge (8% of administration)."
 dd_healthcare_4:0 "National Health Service"
 dd_healthcare_4_desc:0 "Public hospitals. Faster population growth, more wounded return to the line. Large treasury surcharge (32% of administration)."
 dd_healthcare_5:0 "Universal Comprehensive Care"
 dd_healthcare_5_desc:0 "Cradle-to-grave coverage. Extreme treasury surcharge (64% of administration). Better casualty recovery and a slightly larger manpower pool."
 dd_labor_1:0 "Forced Labour"
 dd_labor_1_desc:0 "Corvée and camps. Factories scream. Stability and occupied areas suffer. No treasury surcharge."
 dd_labor_2:0 "Unregulated Labour"
 dd_labor_2_desc:0 "At-will hiring, no unions. Extra factory output, less stability. No treasury surcharge."
 dd_labor_3:0 "Standard Contracts"
 dd_labor_3_desc:0 "Ordinary employment law. A little extra stability. No treasury surcharge."
 dd_labor_4:0 "Protected Labour"
 dd_labor_4_desc:0 "Hours, safety, and the right to organize. Higher stability, slightly slower factories. No treasury surcharge."
 dd_labor_5:0 "National Labour Direction"
 dd_labor_5_desc:0 "The state assigns labour to yards and conscription boards. Factory output falls 5%. No treasury surcharge."
 dd_fertility_1:0 "No Abortions, Encourage Childrearing"
 dd_fertility_1_desc:0 "Abortion is banned and the state pays families to have children. Population growth jumps. Factories lose women. Medium treasury surcharge (16% of administration). Blocked if feminism policy is at Promote Feminism or higher."
 dd_fertility_2:0 "Abortions on Special Circumstance, Encourage Childrearing"
 dd_fertility_2_desc:0 "Narrow exceptions only, plus natalist spending. Small treasury surcharge (8% of administration). Blocked if feminism policy is at Promote Feminism or higher."
 dd_fertility_3:0 "Legal Abortions until 2 Months, Encourage Women in Workforce"
 dd_fertility_3_desc:0 "Early abortion is legal. Population growth slows a little (it does not reverse). Factory output rises. No treasury surcharge. Blocked by Attack on the Patriarchy."
 dd_fertility_4:0 "Abortion until 9 Months, Encourage Women in Workforce"
 dd_fertility_4_desc:0 "Late abortion is legal. Growth slows further without shrinking the existing population. Factory output rises. No treasury surcharge."
 dd_fertility_5:0 "Decriminalized Infanticide, Encourage Women in Workforce"
 dd_fertility_5_desc:0 "The state will not police births. Growth slows the most (still a growth-rate cut). Factory output jumps. No treasury surcharge."
 dd_aid_1:0 "No Foreign Aid"
 dd_aid_1_desc:0 "Keep the money at home. Worse opinion, much harder lend-lease, guarantees, and volunteers."
 dd_aid_2:0 "Selective Foreign Aid"
 dd_aid_2_desc:0 "A few clients, no open cheque. Still harder diplomacy. No treasury surcharge."
 dd_aid_3:0 "Limited Foreign Aid"
 dd_aid_3_desc:0 "A modest aid budget. Easier relations, one extra volunteer division. Small treasury surcharge (8% of administration)."
 dd_aid_4:0 "Global Aid Objectives"
 dd_aid_4_desc:0 "Wide programmes. Easier factions, lend-lease, and guarantees. Large treasury surcharge (32% of administration)."
 dd_aid_5:0 "Extensive Nationbuilding"
 dd_aid_5_desc:0 "We underwrite other governments. Extreme treasury surcharge (64% of administration)."
 dd_religion_laws:0 "State and Religion"
 dd_media_laws:0 "Media and Internet"
 dd_civil_military_laws:0 "AI Regulation"
 dd_religion_1:0 "Fanatical Religious Enforcement"
 dd_religion_1_desc:0 "The faith is the state. War support and ideology lock down. Research and stability suffer. No treasury surcharge."
 dd_religion_2:0 "State Religion"
 dd_religion_2_desc:0 "An official church. More war support and drift defence. Slightly slower research. No treasury surcharge."
 dd_religion_3:0 "State Recognized Religions"
 dd_religion_3_desc:0 "Several faiths are legal and public. Mild war support and drift defence. No treasury surcharge."
 dd_religion_4:0 "Secular State"
 dd_religion_4_desc:0 "Law is civil. Faster research, weaker war support and ideology lock. No treasury surcharge."
 dd_religion_5:0 "Atheist Policing"
 dd_religion_5_desc:0 "Public religion is punished. Stability rises. War support and ideology defence collapse. No treasury surcharge."
 dd_media_1:0 "Total Internet Isolation"
 dd_media_1_desc:0 "The net is a national intranet. Ideology and encryption lock down. Research collapses. No treasury surcharge."
 dd_media_2:0 "Strong Internet Firewalls"
 dd_media_2_desc:0 "Foreign sites are filtered. Less research, more political control. No treasury surcharge."
 dd_media_3:0 "Prevent Foreign Influence"
 dd_media_3_desc:0 "Licensed platforms and a foreign-agent law. Mild research cost, a little extra stability. No treasury surcharge."
 dd_media_4:0 "Protections from Direct Foreign Interference"
 dd_media_4_desc:0 "Narrow bans on covert media ops. Slightly weaker encryption and political power. No treasury surcharge."
 dd_media_5:0 "No Internet Regulation"
 dd_media_5_desc:0 "The net is open. Faster research, weaker encryption, more ideology drift. No treasury surcharge."
 dd_civil_military_1:0 "Race to AGI!"
 dd_civil_military_1_desc:0 "No safety board. Faster research and a little extra factory output. Stability takes the hit. No treasury surcharge."
 dd_civil_military_2:0 "No AI Restrictions"
 dd_civil_military_2_desc:0 "Licenses exist on paper. Milder research and output bonuses. No treasury surcharge."
 dd_civil_military_3:0 "Limited AI Restrictions"
 dd_civil_military_3_desc:0 "Safety rules on weapons and labs. A little extra research, a little less stability. No treasury surcharge."
 dd_civil_military_4:0 "Heavy AI Restrictions"
 dd_civil_military_4_desc:0 "Tight compute and model controls. More stability, slower labs and factories. No treasury surcharge."
 dd_civil_military_5:0 "War on AI"
 dd_civil_military_5_desc:0 "A ban in all but name. Stability soars. Research and factory output fall. No treasury surcharge."

