 dd_debt_burden:0 "Debt Burden"
 dd_debt_burden_desc:0 "Public debt is [?dd_debt_rev_ratio|0]% of yearly revenue. Each full 100% applies −10% construction speed and −2% stability ([?dd_debt_burden_stacks|0]×)."
 dd_dec_take_loan_small:0 "Take Small Loan"
 dd_dec_take_loan_small_desc:0 "Borrow one month of revenue. Adds the same amount to debt. Interest is 3% a year (charged monthly)."
 DD_TAKE_LOAN_SMALL_TT:0 "Adds [?dd_loan_small|1]B US$ to cash and debt.\nRequires monthly revenue above 0."
 dd_dec_take_loan_large:0 "Take Large Loan"
 dd_dec_take_loan_large_desc:0 "Borrow five months of revenue. Adds the same amount to debt. Interest is 3% a year (charged monthly)."
 DD_TAKE_LOAN_LARGE_TT:0 "Adds [?dd_loan_large|1]B US$ to cash and debt.\nRequires monthly revenue above 0."
 dd_dec_repay_loan:0 "Repay Loan"
 dd_dec_repay_loan_desc:0 "Pay down principal: one month of revenue, or whatever cash and remaining debt allow. Lowers next month's interest."
 DD_REPAY_LOAN_TT:0 "Pays [?dd_repay_preview|1]B US$ from cash into debt."
 dd_dec_pay_interest_groups:0 "Pay Interest Groups"
 dd_dec_pay_interest_groups_desc:0 "Spend [GetDdPpCost] for 50 political power. Costs 1% of yearly revenue. Once per month."
 DD_PAY_PP_TT:0 "Costs [GetDdPpCost]. Grants 50 political power. Once per month."
 dd_dec_subsidize_business:0 "Subsidize Business"
 dd_dec_subsidize_business_desc:0 "Spend [GetDdSubCost]. Costs 0.5% of yearly revenue. Civilian demand falls 5% for 90 days. Cannot be stacked; take it again after it expires."
 DD_SUBSIDIZE_BUSINESS_TT:0 "Costs [GetDdSubCost]. −5% consumer goods for 3 months."
