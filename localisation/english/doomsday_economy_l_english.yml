 DD_ECON_STATS_TT:0 "[GetDdStatsTt]"
 DD_ECON_STATS_TT_READY:0 "Debt as a percent of yearly revenue (twelve months).\nEach full 100% applies −10% construction speed and −2% stability.\n50% = none. 150% = 1×. 280% = 2×. 305% = 3×.\nCurrent stacks: [?dd_debt_burden_stacks|0]× ([?dd_debt_con_pen|%1] construction, [?dd_debt_stab_pen|%1] stability)"
 DD_ECON_BUDGET_PENDING_TT:0 "No budget has posted yet. Cash and debt are current. Revenue, expenses, net, and debt/revenue stay §g??§! until the first monthly close."
 DD_ECON_INCOME_TOTAL:0 "Revenue: [GetDdIncome]"
 DD_ECON_EXPENSE_TOTAL:0 "Expenses: [GetDdExpense]"
 DD_ECON_INCOME_TT:0 "[GetDdIncomeTt]"
