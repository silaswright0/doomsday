 DD_ECON_INCOME_TT_READY:0 "Last month's revenue (US$)\nTaxes: [GetDdTax] (owned-state people × $[?dd_rate_tax_pop|2]B plus civilian factories × $[?dd_rate_tax_civ|2]B; high tax doubles, low tax is zero)\nCivilian factories: [GetDdCivInc]\nFinance: [GetDdFinance] ($[?dd_rate_finance|2]B × level × (local civilian factories + services + [?dd_rate_fin_floor|0]))\nServices: [GetDdServices] ($[?dd_rate_services|2]B × level × (local civilian factories + [?dd_rate_srv_floor|0]))"
 DD_ECON_EXPENSE_TT_READY:0 "Last month's expenses (US$)\nAdministration: [GetDdAdmin] ($[?dd_rate_admin_pop|2]B per million people + $[?dd_rate_admin_civ|2]B per civilian factory, [?dd_pop_m|1]M in owned states)\nPolicy surcharge: [GetDdPolicyExp] ([?dd_admin_factor|2]× administration − base)\nInterest: [GetDdInterest] (3% a year / 12 of debt)"
