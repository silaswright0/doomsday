 dd_welfare_1:0 "Minimal Welfare"
 dd_welfare_1_desc:0 "Thin safety net. Cheaper budget, slightly lower stability."
 dd_welfare_2:0 "Standard Welfare"
 dd_welfare_2_desc:0 "Baseline social spending. Adds 28% of administration cost."
 dd_welfare_3:0 "Expanded Welfare"
 dd_welfare_3_desc:0 "Heavy social spending. Adds 60% of administration cost."
 dd_education_1:0 "Austerity Education"
 dd_education_1_desc:0 "Cuts research speed."
 dd_education_2:0 "Public Education"
 dd_education_2_desc:0 "Baseline schooling. Adds 12% of administration cost."
 dd_education_3:0 "Mass Higher Education"
 dd_education_3_desc:0 "Faster research. Adds 25% of administration cost."
 dd_immigration_1:0 "Closed Borders"
 dd_immigration_1_desc:0 "Lower population growth, slightly higher stability."
 dd_immigration_2:0 "Selective Immigration"
 dd_immigration_2_desc:0 "Baseline migration policy."
 dd_immigration_3:0 "Open Immigration"
 dd_immigration_3_desc:0 "Faster population growth, stability cost. Adds 5% of administration cost."
 dd_taxes_1:0 "Low Taxes"
 dd_taxes_1_desc:0 "No extra tax take. Faster construction."
 dd_taxes_2:0 "Standard Taxes"
 dd_taxes_2_desc:0 "Standard take: $0.02B per million people plus $0.80B per civilian factory in owned states."
 dd_taxes_3:0 "High Taxes"
 dd_taxes_3_desc:0 "Double the standard take ($0.04B per million people and $1.60B per civilian factory). Political and efficiency cost."
 dd_women_1:0 "Restricted Women's Rights"
 dd_women_1_desc:0 "Limits women's participation in research and industry. Slightly higher stability."
 dd_women_2:0 "Equal Women's Rights"
 dd_women_2_desc:0 "Baseline women's civic law."
 dd_women_3:0 "Expanded Women's Rights"
 dd_women_3_desc:0 "Faster research and factory output. Higher consumer goods. Adds 4% of administration cost."
 dd_minority_1:0 "Assimilative Policy"
 dd_minority_1_desc:0 "Less non-core manpower. Occupied areas resist more. Slightly higher stability."
 dd_minority_2:0 "Managed Minorities"
 dd_minority_2_desc:0 "Baseline minority law."
 dd_minority_3:0 "Equal Minority Rights"
 dd_minority_3_desc:0 "More non-core manpower and compliance. Modest population growth. Stability cost. Adds 4% of administration cost."
 dd_investment_1:0 "Austerity Investment"
 dd_investment_1_desc:0 "Cuts public works. Construction is slower, treasury is cheaper."
 dd_investment_2:0 "Routine Public Works"
 dd_investment_2_desc:0 "Baseline state construction spending. Adds 8% of administration cost."
 dd_investment_3:0 "Heavy State Investment"
 dd_investment_3_desc:0 "Much faster construction. Adds 18% of administration cost."
 dd_security_1:0 "Light Policing"
 dd_security_1_desc:0 "Low surveillance. Stability and encryption suffer; a little extra construction speed."
 dd_security_2:0 "Standard Security"
 dd_security_2_desc:0 "Baseline crime and intelligence policy."
 dd_security_3:0 "Mass Surveillance"
 dd_security_3_desc:0 "Higher stability and encryption. Consumer goods cost. Adds 12% of administration cost."
 dd_healthcare_1:0 "Private Care"
 dd_healthcare_1_desc:0 "Thin public health. No monthly cost, but population growth and stability fall."
 dd_healthcare_2:0 "Public Healthcare"
 dd_healthcare_2_desc:0 "Modest population growth. Adds 20% of administration cost."
 dd_healthcare_3:0 "Universal Healthcare"
 dd_healthcare_3_desc:0 "Higher population growth, +1% stability, +1% war support. Adds 42% of administration cost."
 dd_labor_1:0 "No Right of Assembly"
 dd_labor_1_desc:0 "Unions and street organizing are banned. Factories run harder. Stability suffers."
 dd_labor_2:0 "Managed Labor"
 dd_labor_2_desc:0 "Limited organizing under state rules."
 dd_labor_3:0 "Right to Organize"
 dd_labor_3_desc:0 "Unions are legal. Higher stability, more consumer demand, slightly lower factory output."
 dd_fertility_1:0 "Natalist Restrictions"
 dd_fertility_1_desc:0 "Abortion is tightly limited and the state pays for births. Population grows. Research is slower. Adds 14% of administration cost."
 dd_fertility_2:0 "Regulated Fertility"
 dd_fertility_2_desc:0 "Limited abortion access and modest family support. Adds 6% of administration cost."
 dd_fertility_3:0 "Liberal Abortion Access"
 dd_fertility_3_desc:0 "Legal abortion and little natalist spending. Population growth falls. Research is slightly faster. No extra administration cost."
 dd_aid_1:0 "No Foreign Aid"
 dd_aid_1_desc:0 "Keep the money at home. Worse world opinion, harder guarantees and volunteers, slightly lower consumer goods."
 dd_aid_2:0 "Selective Aid"
 dd_aid_2_desc:0 "Limited assistance. Modest opinion gain and cheaper diplomacy. Adds 4% of administration cost."
 dd_aid_3:0 "Global Aid Commitments"
 dd_aid_3_desc:0 "Faster opinion, cheaper relations, extra volunteers, easier lend-lease and guarantees. Harder to justify wars. Adds 8% of administration cost."
 dd_religion_laws:0 "State and Religion"
 dd_media_laws:0 "Media and Internet"
 dd_civil_military_laws:0 "AI Regulation"
 dd_religion_1:0 "State Religion"
 dd_religion_1_desc:0 "The state backs an official faith. Stability, war support, and political power rise. Research slows. Ideology is harder to shift."
 dd_religion_2:0 "Recognized Faiths"
 dd_religion_2_desc:0 "Religion is public and regulated, not the constitution."
 dd_religion_3:0 "Secular State"
 dd_religion_3_desc:0 "Law is civil. Faster research and occupied compliance. Stability and war support take a hit."
 dd_media_1:0 "Censored Internet"
 dd_media_1_desc:0 "The state filters news and the net. More political power and encryption. Research slows. Ideology is locked down."
 dd_media_2:0 "Managed Media"
 dd_media_2_desc:0 "Licensed press and partial net controls."
 dd_media_3:0 "Open Internet"
 dd_media_3_desc:0 "Unfiltered media. Faster research and a little stability. Weaker encryption and more ideology drift."
 dd_civil_military_1:0 "Unrestricted AI"
 dd_civil_military_1_desc:0 "Models and autonomous weapons with few limits. Research and factory output rise. Encryption and stability fall."
 dd_civil_military_2:0 "Licensed AI"
 dd_civil_military_2_desc:0 "Licenses, safety boards, and export controls. Neither a ban nor a free-for-all."
 dd_civil_military_3:0 "AI Restrictions"
 dd_civil_military_3_desc:0 "Human-in-the-loop rules and tight compute controls. More stability, political power, and encryption. Research and factory output slow."

