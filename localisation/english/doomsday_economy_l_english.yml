 DD_ECON_EXPENSE_TT_READY:0 "Last month's expenses (US$)\nAdministration: [GetDdAdmin] ($[?dd_rate_admin_pop|2]B per million people + $[?dd_rate_admin_civ|2]B per civilian factory, [?dd_pop_m|1]M in owned states)\nPolicy surcharge: [GetDdPolicyExp] ([?dd_admin_factor|2]× administration − base)\nInterest: [GetDdInterest] (this month; 3% a year / 12 of principal)"
 DD_ECON_NET_TT_READY:0 "Last month's net (US$). Revenue minus expenses, posted to cash at the monthly close."
