l_english:
 DOOMSDAY_NAME:0 "Doomsday"
 DOOMSDAY_DESC:0 "The world of January 2026. Industry sits where factories actually are. The old wartime coalitions are gone."
 USA_DOOMSDAY_DESC:0 "The United States is still the strongest military power, now under a national-populist presidency. Its alliances are intact and its factories are thinner than its commitments."
 CHI_DOOMSDAY_DESC:0 "The People's Republic is a party-state and the workshop of the world. It occupies Tibet, East Turkistan, and Aksai Chin, and it is pressing Taiwan and the South China Sea."
 SOV_DOOMSDAY_DESC:0 "Russia is a managed petrostate still at war in Ukraine. The presidency does not rotate, and the budget follows oil, gas, and the army."
 RAJ_DOOMSDAY_DESC:0 "India is a vast elected state under a Hindu-nationalist government, with a growing industrial core. China occupies Aksai Chin. India still holds Arunachal Pradesh."
 ENG_DOOMSDAY_DESC:0 "The United Kingdom is a wealthy, nuclear-armed island whose factories have largely gone. A social-democratic cabinet is trying to fund the navy and the welfare state together."
 FRA_DOOMSDAY_DESC:0 "France is a nuclear power with a smaller industrial base than its diplomacy assumes. A liberal cabinet faces debt, the Sahel, and a loud right."
 GER_DOOMSDAY_DESC:0 "Germany is still Europe's industrial heavyweight, under a conservative cabinet after years of energy shock. Rearmament is real and politically contested."
 JAP_DOOMSDAY_DESC:0 "Japan is a high-tech workshop with a constrained military and a huge public debt held at home. A conservative cabinet is rearming against China and North Korea."
 JAP_boj_home_bias:0 "Home-Bias Government Debt"
 JAP_boj_home_bias_desc:0 "Households, banks, and the Bank of Japan hold most of the public debt at suppressed yields. Annual interest on the treasury ledger is 2 percentage points lower (1% a year instead of 3%)."
 OTHER_DOOMSDAY_DESC:0 "Select a country to read its situation in January 2026."
