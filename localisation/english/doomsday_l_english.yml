 VICTORY_POINTS_13418:0 "Tessalit"
 VICTORY_POINTS_13419:0 "Kidal"
 VICTORY_POINTS_13420:0 "Timbuktu"
 USA_LEADER_DESC:0 "Donald Trump is back in the White House for a second term, pressing the border, tariffs, and the agencies under a tighter presidency."
 CHI_LEADER_DESC:0 "Xi Jinping remains general secretary, president, and chairman of the central military commission. The party sets the line."
 SOV_LEADER_DESC:0 "Vladimir Putin remains president. The security ministries and the presidential administration run the state around him."
 RAJ_LEADER_DESC:0 "Narendra Modi is prime minister. The BJP holds the centre of Indian politics, and the prime minister's office holds the government."
 ENG_LEADER_DESC:0 "Keir Starmer is prime minister after Labour's 2024 victory, running a tight fiscal line with a party less united than its majority."
 FRA_LEADER_DESC:0 "Emmanuel Macron is still president, deep in his second term, and still without a reliable majority in the National Assembly."
 GER_LEADER_DESC:0 "Friedrich Merz is chancellor of a CDU-led coalition, more Atlanticist and tighter on spending than the government he replaced."
 JAP_LEADER_DESC:0 "Shigeru Ishiba is prime minister, leading a weaker LDP through a defence build-up aimed at China and North Korea."
 ITA_LEADER_DESC:0 "Giorgia Meloni is prime minister. Brothers of Italy holds the coalition, hard on migration and conventional on the Atlantic alliance."
 CAN_LEADER_DESC:0 "Mark Carney is prime minister, trying to hold the federation together on trade, housing, and the American relationship."
 KOR_LEADER_DESC:0 "Lee Jae-myung is president, balancing the American alliance, a wary China, and a North Korea that has not slowed its missiles."
 DPK_LEADER_DESC:0 "Kim Jong-un rules through the party, the army, and the family. The nuclear force is the regime's guarantee."
 BRA_LEADER_DESC:0 "Luiz Inacio Lula da Silva is in his third presidency, leaning on a broad and fractious coalition in Congress."
 MEX_LEADER_DESC:0 "Claudia Sheinbaum is president, continuing Morena's hold on the executive with a large bloc in Congress and a tense line toward Washington."
 INS_LEADER_DESC:0 "Prabowo Subianto is president. The former general runs a broad cabinet and keeps the army close to civilian administration."
 TUR_LEADER_DESC:0 "Recep Tayyip Erdogan remains president. The palace, not the parliament, is the centre of Turkish decisions."
 SAU_LEADER_DESC:0 "Mohammed bin Salman is crown prince and prime minister. Vision 2030 and the security services both answer to him."
 AST_LEADER_DESC:0 "Anthony Albanese is prime minister. Labor governs with a cautious line on China and the American alliance."
 SPR_LEADER_DESC:0 "Pedro Sanchez remains prime minister of a minority government that survives by deals with regional parties."
 POL_LEADER_DESC:0 "Donald Tusk is prime minister of the coalition that unseated Law and Justice, and is still fighting it over the courts."
 HOL_LEADER_DESC:0 "Dick Schoof is prime minister of a right-leaning cabinet formed after the PVV's election shock."
 BEL_LEADER_DESC:0 "Bart De Wever is prime minister, a Flemish nationalist trying to hold a divided Belgian coalition together."
 SWE_LEADER_DESC:0 "Ulf Kristersson is prime minister, dependent on Sweden Democrat support for a stricter line on migration and crime."
 NOR_LEADER_DESC:0 "Jonas Gahr Store is prime minister. Labour governs a wealthy oil state that argues over how far to spend it."
 DEN_LEADER_DESC:0 "Mette Frederiksen is prime minister. The Social Democrats keep a hard migration line and a firm place in NATO."
 GRN_LEADER_DESC:0 "Jens-Frederik Nielsen leads Greenland's government while Copenhagen and Washington both press on the island's future."
 FIN_LEADER_DESC:0 "Petteri Orpo is prime minister. Finland is inside NATO, and the coalition is built to pay for that."
 SWI_LEADER_DESC:0 "Viola Amherd sits on the Federal Council. The presidency rotates each year, and the council governs, not one person."
 AUS_LEADER_DESC:0 "Christian Stocker is chancellor of a coalition assembled after a fractured election."
 IRE_LEADER_DESC:0 "Simon Harris is taoiseach. Fine Gael leads a government still arguing over housing."
 POR_LEADER_DESC:0 "Luis Montenegro is prime minister of a centre-right government with a thin margin in parliament."
 GRE_LEADER_DESC:0 "Kyriakos Mitsotakis is prime minister. New Democracy holds a clear majority and a pro-NATO line."
 CZE_LEADER_DESC:0 "Petr Fiala is prime minister of a centre-right coalition that has made Ukraine and the budget its tests."
 SLO_LEADER_DESC:0 "Robert Fico is prime minister again, at the head of a coalition that slowed aid to Ukraine and fought the press."
 HUN_LEADER_DESC:0 "Viktor Orban remains prime minister. Fidesz controls the state, the media environment, and foreign policy."
 ROM_LEADER_DESC:0 "Ilie Bolojan is prime minister, trying to hold a pro-European cabinet together."
 BUL_LEADER_DESC:0 "Rosen Zhelyazkov is prime minister of a fragile coalition in a country that has burned through governments."
 SER_LEADER_DESC:0 "Aleksandar Vucic is president, and the real centre of power. The prime minister's office follows the presidency."
 CRO_LEADER_DESC:0 "Andrej Plenkovic is prime minister. HDZ has governed long enough that the state and the party are hard to separate."
 SLV_LEADER_DESC:0 "Robert Golob is prime minister of the liberal coalition that replaced Janez Jansa."
 BOS_LEADER_DESC:0 "Denis Becirovic is the Bosniak member of the presidency. The state still turns on three peoples and a foreign high representative."
 MAC_LEADER_DESC:0 "Hristijan Mickoski is prime minister, returning VMRO-DPMNE on a nationalist ticket."
 ALB_LEADER_DESC:0 "Edi Rama is prime minister, as he has been for more than a decade. The Socialist Party's machine is the government."
 MNT_LEADER_DESC:0 "Milojko Spajic is prime minister of a small pro-European government still split over Serbia and the church."
 KOS_LEADER_DESC:0 "Albin Kurti is prime minister. Vetevendosje treats the dialogue with Belgrade as something to endure, not to rush."
 UKR_LEADER_DESC:0 "Volodymyr Zelenskyy is president of a country at war. Martial law has suspended the election that would otherwise have been held."
 BLR_LEADER_DESC:0 "Alexander Lukashenko remains president. The security organs, not the ballot, keep him there."
 EST_LEADER_DESC:0 "Kristen Michal is prime minister. Estonian politics are built around the Russian threat and a thin fiscal margin."
 LAT_LEADER_DESC:0 "Evika Silina is prime minister of a coalition that treats Russia as the main fact of Latvian security."
 LIT_LEADER_DESC:0 "Gintautas Paluckas is prime minister. Lithuania stays one of Kyiv's firmest backers."
 MOL_LEADER_DESC:0 "Maia Sandu is president. The government is pro-European, and Transnistria remains a Russian-held problem on the river."
 PMR_LEADER_DESC:0 "Vadim Krasnoselsky presides over a strip of land that exists because Russian troops are still there."
 GEO_LEADER_DESC:0 "Irakli Kobakhidze is prime minister. Georgian Dream holds the state and has cooled the European track."
 ABK_LEADER_DESC:0 "Badra Gunba leads Abkhazia under Russian protection. Sukhumi is not a Georgian government."
 SOE_LEADER_DESC:0 "Alan Gagloev leads South Ossetia, a Russian garrison with a local presidency attached."
 ARM_LEADER_DESC:0 "Nikol Pashinyan is prime minister, still in office after the 2020 defeat and the loss of Nagorno-Karabakh."
 AZR_LEADER_DESC:0 "Ilham Aliyev is president. The 2023 recovery of Karabakh settled the war on Baku's terms."
 KAZ_LEADER_DESC:0 "Kassym-Jomart Tokayev is president, balancing Moscow, Beijing, and his own security services."
 UZB_LEADER_DESC:0 "Shavkat Mirziyoyev is president, opening the economy without opening the political system."
 TMS_LEADER_DESC:0 "Serdar Berdimuhamedow is president in name. The family, and his father, still sit over the gas state."
 KYR_LEADER_DESC:0 "Sadyr Japarov is president, a populist who concentrated power after the 2020 uprising."
 TAJ_LEADER_DESC:0 "Emomali Rahmon has been president since the civil war. A family succession is the only transition under discussion."
 MON_LEADER_DESC:0 "Khurelsukh Ukhnaa is president. Mongolia balances Chinese trade against a careful distance from Moscow."
 PAK_LEADER_DESC:0 "Shehbaz Sharif is prime minister. The army remains the institution that decides how long a civilian government lasts."
 BAN_LEADER_DESC:0 "Muhammad Yunus heads the interim government installed after Hasina's fall. An election is supposed to come next."
 BRM_LEADER_DESC:0 "Min Aung Hlaing is the junta's commander. The army holds the cities. It does not hold the country."
 NUG_LEADER_DESC:0 "Duwa Lashi La is acting president of the National Unity Government, the civilian claim against the junta."
 SIA_LEADER_DESC:0 "Paetongtarn Shinawatra is prime minister, the latest Shinawatra face on a government the palace and the army still watch."
 MAL_LEADER_DESC:0 "Anwar Ibrahim is prime minister of a unity government he spent decades trying to reach."
 VIN_LEADER_DESC:0 "To Lam leads the party and the state. Vietnam's succession is a politburo decision, not an election."
 PHI_LEADER_DESC:0 "Ferdinand Marcos Jr is president, a dynasty's return with a firm American security line and a cautious China policy."
 SNG_LEADER_DESC:0 "Lawrence Wong is prime minister, the PAP's managed succession from Lee Hsien Loong."
 FOR_LEADER_DESC:0 "Lai Ching-te is president. The DPP holds the office, and Beijing treats that as a provocation."
 CAM_LEADER_DESC:0 "Hun Manet is prime minister, his father's successor. The party and the army did not change when the name did."
 LAO_LEADER_DESC:0 "Thongloun Sisoulith is president and party chief of a one-party state deep in Chinese debt."
 NEP_LEADER_DESC:0 "K.P. Sharma Oli is prime minister again, balancing India, China, and a parliament that rarely sits still."
 BHU_LEADER_DESC:0 "Tshering Tobgay is prime minister. The king remains the centre of the Bhutanese state."
 SRL_LEADER_DESC:0 "Anura Kumara Dissanayake is president, a left nationalist elected on the wreckage of the 2022 collapse."
 AFG_LEADER_DESC:0 "Hibatullah Akhundzada is supreme leader. The emirate is clerical rule from Kandahar, not a cabinet in Kabul."
 NRF_LEADER_DESC:0 "Ahmad Massoud leads the National Resistance from the Panjshir and from exile. It is an armed claim, not a government in Kabul."
 PER_LEADER_DESC:0 "Masoud Pezeshkian is president. The supreme leader, not the president, decides war, the nuclear file, and the Guards."
 IRQ_LEADER_DESC:0 "Mohammed Shia al-Sudani is prime minister, a Coordination Framework choice trying to keep militias and Americans in one state."
 KUR_LEADER_DESC:0 "Masrour Barzani is prime minister of the Kurdistan Region. Erbil runs its own oil, peshmerga, and argument with Baghdad."
 SYR_LEADER_DESC:0 "Ahmed al-Sharaa leads Syria after Assad's fall. The former HTS command is now the government in Damascus."
 ROJ_LEADER_DESC:0 "Mazloum Abdi commands the SDF. Rojava's autonomy depends on an American presence and a hostile Damascus."
 DRZ_LEADER_DESC:0 "Hikmat al-Hijri is the Druze lead in Suwayda. The province is armed and is not taking orders from Damascus."
 SNA_LEADER_DESC:0 "Fadlallah al-Hajji leads the Syrian National Army, Turkish-backed factions on the northern border, not a Damascus ministry."
 LEB_LEADER_DESC:0 "Joseph Aoun is president, a former army commander elected to put a state back over a country of militias."
 HEZ_LEADER_DESC:0 "Naim Qassem leads Hezbollah after Nasrallah's death. The party is weaker, still armed, and still outside the cabinet's control."
 JOR_LEADER_DESC:0 "Abdullah II is king. The prime minister serves at his pleasure, and the security services are the real government."
 ISR_LEADER_DESC:0 "Benjamin Netanyahu is prime minister of a right-religious coalition, still at war on more than one front."
 PAL_LEADER_DESC:0 "Mahmoud Abbas presides over a Palestinian Authority that administers fragments of the West Bank and does not control Gaza."
 HAM_LEADER_DESC:0 "Khalil al-Hayya speaks for Hamas's political office. The movement still holds Gaza and is not the Ramallah authority."
 EGY_LEADER_DESC:0 "Abdel Fattah el-Sisi is president. The army is the economy, and the electorate is not the constraint."
 LBA_LEADER_DESC:0 "Abdul Hamid Dbeibeh heads the Tripoli-based Government of National Unity. Mohamed al-Menfi remains Presidential Council chair, but the GNU's western ministries and militias answer to the prime minister."
 LNA_LEADER_DESC:0 "Field Marshal Khalifa Haftar commands the Benghazi-based Libyan National Army. His sons, notably Saddam Haftar, hold the key army and security posts that keep Cyrenaica and Fezzan in line."
 TUN_LEADER_DESC:0 "Kais Saied is president, ruling by decree after he closed the old parliament and wrote a constitution around himself."
 ALG_LEADER_DESC:0 "Abdelmadjid Tebboune is president. The army and the security services remain the partners that matter."
 MOR_LEADER_DESC:0 "Mohammed VI is king. The head of government administers. The palace decides."
 WES_LEADER_DESC:0 "Brahim Ghali leads the Polisario. The Sahrawi claim is a camp at Tindouf and a diplomatic file, not a capital in Laayoune."
 SAF_LEADER_DESC:0 "Cyril Ramaphosa is president of an ANC that no longer governs alone and has had to share the cabinet."
 LES_LEADER_DESC:0 "Letsie III is king. The prime minister governs a poor enclave inside South Africa, and the palace is the referee."
 SWZ_LEADER_DESC:0 "Mswati III is an absolute king. Parties are banned, and the government is the monarchy."
 NGA_LEADER_DESC:0 "Bola Tinubu is president, bringing Lagos-machine politics to Abuja along with a subsidy crisis and a restless north."
 ETH_LEADER_DESC:0 "Abiy Ahmed is prime minister at the centre of a federation that has already fought one war and is managing others."
 KEN_LEADER_DESC:0 "William Ruto is president, elected against the old dynasties and now governing through a broad, transactional coalition."
 GHA_LEADER_DESC:0 "John Mahama is president again, returned by voters after the NPP's term."
 COG_LEADER_DESC:0 "Felix Tshisekedi is president. Kinshasa holds the title. The east is a war with M23 and several armies."
 M23_LEADER_DESC:0 "Corneille Nangaa fronts the M23 alliance. The rifles in North Kivu are the movement, and Kigali's role is the open argument."
 ANG_LEADER_DESC:0 "Joao Lourenco is president, the MPLA's successor to dos Santos, still running a party-state on oil."
 MZB_LEADER_DESC:0 "Daniel Chapo is president, FRELIMO's latest nominee. The Cabo Delgado insurgency did not end with the succession."
 ZIM_LEADER_DESC:0 "Emmerson Mnangagwa is president. ZANU-PF and the army remain the succession that matters."
 SUD_LEADER_DESC:0 "Abdel Fattah al-Burhan commands the army and what remains of the Khartoum government, at war with the RSF."
 RSF_LEADER_DESC:0 "Mohamed Hamdan Dagalo (Hemedti) commands the Rapid Support Forces from Nyala. After taking El Fasher in late 2025 his army holds Darfur against Burhan's SAF in Khartoum and the east."
 SSD_LEADER_DESC:0 "Salva Kiir is president. The peace agreement is a ceasefire between armed parties, not a settled state."
 SIO_LEADER_DESC:0 "Riek Machar remains the SPLM-IO leader from house arrest in Juba. The Nuer White Army and IO units hold Nasir and eastern Jonglei against Kiir's SSPDF."
 SOM_LEADER_DESC:0 "Hassan Sheikh Mohamud is president in Mogadishu. The federal government does not control most of the countryside."
 SML_LEADER_DESC:0 "Abdirahman Mohamed Abdullahi is president of Somaliland, a working administration that almost nobody recognizes."
 PNT_LEADER_DESC:0 "Said Abdullahi Deni is president of Puntland, autonomous from Mogadishu and fighting al-Shabaab on his own account."
 JUB_LEADER_DESC:0 "Ahmed Madobe is president of Jubaland, holding Kismayo with his own forces and a difficult line to Mogadishu."
 SHB_LEADER_DESC:0 "Ahmed Diriye leads al-Shabaab, an insurgency with taxation and courts and no interest in the federal constitution."
 UGA_LEADER_DESC:0 "Yoweri Museveni has been president since 1986. The army and the family are the succession plan."
 TZN_LEADER_DESC:0 "Samia Suluhu Hassan is president, CCM's successor to Magufuli, looser on the press and no looser on the party."
 RWA_LEADER_DESC:0 "Paul Kagame is president. The RPF's victory margins are not how the state is actually held."
 SEN_LEADER_DESC:0 "Bassirou Diomaye Faye is president, with Ousmane Sonko as the partner who brought the youth vote in."
 IVO_LEADER_DESC:0 "Alassane Ouattara is president again, past the term the opposition said he should not have had."
