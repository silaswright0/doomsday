 PER_restore_order:0 "Restore Public Order"
 PER_restore_order_desc:0 "Requires Promise Popular Reforms or Press Demands Against the USA, and peace with the United States. Removes Mounting Popular Unrest. If that spirit is already gone, gain 200 political power."
 dd_per_peace_usa_tt:0 "At peace with the United States."
 PER_rebuild_infra:0 "Rebuild Our Infrastructure"
 PER_rebuild_infra_desc:0 "Yazd and Kerman each gain 2 infrastructure, if we still hold them."
 PER_rebuild_industry:0 "Rebuild Our Industry"
 PER_rebuild_industry_desc:0 "The capital gains 2 building slots and 2 civilian factories."
 PER_rebuild_stockpile:0 "Rebuild Our Weapons Stockpile"
 PER_rebuild_stockpile_desc:0 "Rebuilding Our Weapons Stockpile for 365 days. Factory output +20%. Production efficiency gain +10%."
 PER_hefz:0 "Hefz-e Nezam, Yeganeh Bazdarandeh"
 PER_hefz_desc:0 "Requires Press Demands Against the USA, and peace with the United States. Preservation of the system is the only deterrent. War support +10%. Stability +5%."
 PER_race_for_the_bomb:0 "Race for the Bomb"
 PER_race_for_the_bomb_desc:0 "Requires Hefz-e Nezam and Rebuild Our Weapons Stockpile. Unlocks atomic research, nuclear reactors, and nuclear weapons. A reactor is built in Yazd, or in the capital if Yazd is lost. Adds Racing for the Bomb."
 PER_play_for_iraq:0 "Make a Play for Iraq"
 PER_play_for_iraq_desc:0 "Requires Squeeze the Saudis. The Shiite militias take Basra and Al Hajara, become our puppet, and we join their war against Iraq. Iraq takes Taken by Surprise for 14 days."
 PER_deploy_brigades:0 "Deploy the Foreign Brigades"
 PER_deploy_brigades_desc:0 "Iran can lend its own divisions to the Shiite puppet as expeditionary forces. The Iranian AI will try to send them."
 PER_anonymous_drones:0 "Anonymous Drone Attacks"
 PER_anonymous_drones_desc:0 "The Shiite puppet gains Iranian Direct Support. Iraq gains Anonymous Drone Attacks. The Proxy Network can now send rifles, artillery, and support gear to the Shiites."
 PER_restore_hezbollah:0 "Restore Supply to Hezbollah"
 PER_restore_hezbollah_desc:0 "War goals to puppet Syria and Rojava, if they still exist."
 PER_reconstitute_hezbollah:0 "Reconstitute Hezbollah"
 PER_reconstitute_hezbollah_desc:0 "Requires Make a Play for Iraq, and a land route to South Lebanon held by Iran or an Iranian puppet. Hezbollah gains Iranian Support, the same spirit the Houthis carry, and the Proxy Network can supply them. If they no longer exist, they return as a government in exile with that spirit."
 dd_per_hez_syria_wargoal_tt:0 "Has a war goal against Syria, Syria is our puppet, or Syria no longer exists."
 dd_per_hez_corridor_tt:0 "Iran or an Iranian puppet controls a land route to South Lebanon."
 PER_march_kuwait:0 "March on Kuwait"
 PER_march_kuwait_desc:0 "A war goal to annex Kuwait, if it still exists."
 PER_confront_israel:0 "Confront Israel"
 PER_confront_israel_desc:0 "A war goal to puppet Jordan, if it still exists. Attack and defense +10% against Israel."
 PER_iran_triumphant:0 "Iran Triumphant"
 PER_iran_triumphant_desc:0 "Requires that Israel no longer exists. Stability +20%. War support +20%. Justify war goal time -40%. Division attack and defense +10%."

