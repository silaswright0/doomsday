 IRG_REVOLT:0 "Islamic Revolutionary Guard Corps"
 IRG_REVOLT_DEF:0 "the Islamic Revolutionary Guard Corps"
 IRG_REVOLT_ADJ:0 "Revolutionary Guard"

 dd_ham_fractured_support:0 "Fractured Iranian Support"
 dd_ham_fractured_support_desc:0 "Tehran's pipeline to Gaza is cracked. One off-map military factory still arrives."
 dd_hez_hindered_support:0 "Hindered Iranian Support"
 dd_hez_hindered_support_desc:0 "The road through Syria is damaged. Three off-map military factories still arrive."
 dd_hez_iranian_support:0 "Iranian Support"
 dd_hez_iranian_support_desc:0 "A second, heavier line from the Revolutionary Guard. Five off-map military factories and division organization +5%."
 dd_fight_for_survival:0 "Fight for Survival"
 dd_fight_for_survival_desc:0 "Core attack and defense +30%. Max entrenchment +5 and entrenchment speed +50%. Attacks do not strip entrenchment. War support +50%. Surrender limit +20%."
 dd_holy_war:0 "Holy War"
 dd_holy_war_desc:0 "Division recovery rate +20%. War support +20%. Division attack and defense +10%. Breakthrough +10%. Surrender limit +20%."
 dd_irq_shiite_militias:0 "Shiite Militias"
 dd_irq_shiite_militias_desc:0 "The Popular Mobilization Forces keep one off-map military factory in the field."
 dd_irq_shiite_militias_active:0 "Shiite Militias"
 dd_irq_shiite_militias_active_desc:0 "The militias are armed and preaching. One off-map military factory, and daily theocratic absolutism support +0.1."
 dd_per_popular_unrest:0 "Mounting Popular Unrest"
 dd_per_popular_unrest_desc:0 "Stability -20%. Daily political power -0.10."
 dd_per_underfunded_artesh:0 "Underfunded Artesh"
 dd_per_underfunded_artesh_desc:0 "The regular army is the poor cousin of the Guard. Division organization, attack, and defense -10%."
 dd_per_irgc_dominance:0 "IRGC Dominance"
 dd_per_irgc_dominance_desc:0 "Consumer goods -30%. Factory output +30%. Military factory construction +20%. Civilian factory construction -50%."
 dd_per_crippling_sanctions:0 "Crippling Sanctions"
 dd_per_crippling_sanctions_desc:0 "Trade opinion is sharply reduced. Consumer goods +20%. Construction speed -30%. Improve-relations gains are weaker and cost more to maintain."
 dd_per_nuclear_ban:0 "Centrifuges Dismantled"
 dd_per_nuclear_ban_desc:0 "The enrichment plants are gone. New reactors cannot be built, and nuclear-material output is shut off."
 dd_irg_no_faction:0 "Guard Alone"
 dd_irg_no_faction_desc:0 "The Revolutionary Guard will not join or lead a faction."
 dd_per_open_bazaar:0 "Open the Bazaar"
 dd_per_open_bazaar_desc:0 "Trade opinion +20%. Consumer goods -5%. Daily political power +0.10."
 dd_per_release_prisoners:0 "Release the Prisoners"
 dd_per_release_prisoners_desc:0 "Stability +10%. War support -5%. Daily political power +0.05."
 dd_per_new_military:0 "New Iranian Military"
 dd_per_new_military_desc:0 "Division organization +10%. Factory output +15%. Military factory construction +15%."
 dd_per_total_war:0 "Total War"
 dd_per_total_war_desc:0 "Surrender limit +20%. Division recovery rate +10%. Consumer goods -20%. War support +20%."
 dd_per_ration_goods:0 "Ration Basic Goods"
 dd_per_ration_goods_desc:0 "Placeholder. Stability +5% and consumer goods +5% stand in until the ration system is written."
 dd_per_diplomatic_stalling:0 "Diplomatic Stalling"
 dd_per_diplomatic_stalling_desc:0 "Repair speed +40% and construction speed +15% for 60 days."
 dd_per_muslim_rally:0 "Called to the Defense of Islam"
 dd_per_muslim_rally_desc:0 "Daily theocratic absolutism support +0.01 for a year."
 dd_sau_squeezed:0 "Squeezed by Iran"
 dd_sau_squeezed_desc:0 "Stability -30%. Oil profits are cut by 70%. Each month a fixed Saudi state loses buildings, rotating through Riyadh, the Hejaz, Asir, Tabuk, and Dammam."
 dd_hormuz_blockade_shock:0 "Hormuz Oil Shock"
 dd_hormuz_blockade_shock_desc:0 "Consumer goods +20% while the strait is closed. Stacks with the Saudi squeeze and the Gulf bombing shock."
 dd_hormuz_blockade_shock_half:0 "Escorted Oil Shock"
 dd_hormuz_blockade_shock_half_desc:0 "Consumer goods +10%. American escorts are halving the closed-strait penalty. Stacks with the other shocks."
 dd_hormuz_blockade_usa:0 "Strait Closed"
 dd_hormuz_blockade_usa_desc:0 "Stability -0.2% per week. National populism -0.01% per day. Stacks with the Saudi squeeze and the Gulf bombing shock."
 dd_hormuz_blockade_usa_half:0 "Escorts on the Strait"
 dd_hormuz_blockade_usa_half_desc:0 "Stability -0.1% per week. National populism -0.005% per day. Half of the closed-strait penalty, while the United States holds both seas."
 dd_hormuz_saudi_shock:0 "Saudi Oil Disrupted"
 dd_hormuz_saudi_shock_desc:0 "Stability -0.2% per week. National populism -0.01% per day. Stacks with the other Hormuz shocks."
 dd_hormuz_gulfbomb_usa:0 "Gulf Cities Bombarded"
 dd_hormuz_gulfbomb_usa_desc:0 "Stability -0.2% per week. National populism -0.01% per day. On for the day a raid hits Kuwait, Bahrain, Qatar, or the UAE. Gone the next day if no new raid lands. Stacks with the other shocks."
 dd_hormuz_squeeze_world:0 "Saudi Squeeze"
 dd_hormuz_squeeze_world_desc:0 "Consumer goods +10% while Iran is squeezing Saudi exports. Stacks with the strait and the Gulf bombing shock."
 dd_hormuz_gulfbomb_world:0 "Gulf Bombing Shock"
 dd_hormuz_gulfbomb_world_desc:0 "Consumer goods +10% for the day a raid hits Kuwait, Bahrain, Qatar, or the UAE. Gone the next day if no new raid lands. Stacks with the other shocks. Gulf Oil Cannot Clear the Strait, while the United States holds a strait sea, stacks with this."
 dd_gulf_oil_sealed:0 "Gulf Oil Cannot Clear the Strait"
 dd_gulf_oil_sealed_desc:0 "Civilian oil sales through the Persian Gulf stop, including with countries Iran is not fighting. Oil Revenue is suspended and pays nothing until this ends. Trade opinion falls."
 dd_per_oil_blocked:0 "Gulf Oil Cannot Clear the Strait"
 dd_per_oil_blocked_desc:0 "Consumer goods +20%. Treasury -3.5 billion per month. Oil Revenue is suspended and pays nothing until this ends. On while the United States holds the Arabian Sea or the Persian Gulf. The strait does not have to be closed. A contested sea does not apply it."
 dd_gulf_closed_to_usa:0 "American Access Revoked"
 dd_gulf_closed_to_usa_desc:0 "Military access, docking rights, and American guarantees do not stick. They are stripped each day."
 dd_per_const_11:0 "New Iranian Constitution"
 dd_per_const_11_desc:0 "The clergy keep a veto, and the oil stays public. Stability +16%, war support +10%, consumer goods -16%, factory output +10%."
 dd_per_const_12:0 "New Iranian Constitution"
 dd_per_const_12_desc:0 "The clergy keep a veto, and the bazaar is open. Stability +16%, war support +10%, trade opinion +50%, consumer goods -10%."
 dd_per_const_13:0 "New Iranian Constitution"
 dd_per_const_13_desc:0 "The clergy keep a veto, and the workers take a share. Stability +6%, war support +10%, factory output +20%, monthly population +10%."
 dd_per_const_21:0 "New Iranian Constitution"
 dd_per_const_21_desc:0 "An elected Islamic parliament, with the oil kept public. Political power +0.30, stability +10%, consumer goods -16%, factory output +10%."
 dd_per_const_22:0 "New Iranian Constitution"
 dd_per_const_22_desc:0 "An elected Islamic parliament and an open bazaar. Political power +0.30, stability +10%, trade opinion +50%, consumer goods -10%."
 dd_per_const_23:0 "New Iranian Constitution"
 dd_per_const_23_desc:0 "An elected Islamic parliament with a workers' share. Political power +0.30, factory output +20%, monthly population +10%."
 dd_per_const_31:0 "New Iranian Constitution"
 dd_per_const_31_desc:0 "A secular republic that keeps the oil public. Research speed +16%, factory output +20%, consumer goods -16%."
 dd_per_const_32:0 "New Iranian Constitution"
 dd_per_const_32_desc:0 "A secular republic with an open bazaar. Research speed +16%, factory output +10%, trade opinion +50%, consumer goods -10%."
 dd_per_const_33:0 "New Iranian Constitution"
 dd_per_const_33_desc:0 "A secular republic with a workers' share. Research speed +16%, factory output +30%, monthly population +10%, stability -10%."

 PER_zagros_forts:0 "Zagros Fortifications"
 PER_zagros_forts_desc:0 "Level-2 forts on the border provinces of Kurdistan, Khuzestan, Azerbaijan, and East Azerbaijan."
 PER_rescue_brigades:0 "Rescue Foreign Brigades"
 PER_rescue_brigades_desc:0 "Two veteran nine-battalion infantry brigades, with engineers and artillery, appear in Kurdistan."
 PER_islamabad:0 "Islamabad Memorandum"
 PER_islamabad_desc:0 "Pakistan hosts talks between Washington and Tehran. Political power +100. The world hears about it."
 PER_withdraw_proxies:0 "Withdraw Support for Proxies"
 PER_withdraw_proxies_desc:0 "Hamas loses Fractured Iranian Support. The Houthis lose Iranian Support. Hezbollah loses Iranian Support. Iraq loses Shiite Militias."
 PER_give_up_centrifuges:0 "Give Up Centrifuges"
 PER_give_up_centrifuges_desc:0 "Political power +100. Every reactor in Iran is dismantled, and new ones cannot be built. The Revolutionary Guard takes Khuzestan, Hormozgan, Sistan, and Kerman if we still hold them, with about a third of the army, and keeps IRGC Dominance. They will not join a faction."
 PER_conditional_peace:0 "Conditional Peace"
 PER_conditional_peace_desc:0 "Israel annexes Hamas and Hezbollah. Yemen annexes the Houthis. Iran makes peace with the United States, Israel, and the other outside enemies. The Guard, if it is still in the field, keeps fighting."
 PER_lift_sanctions:0 "Lift Sanctions"
 PER_lift_sanctions_desc:0 "Crippling Sanctions is removed."
 PER_popular_reforms:0 "Promise Popular Reforms"
 PER_popular_reforms_desc:0 "Mounting Popular Unrest is removed."
 PER_open_the_bazaar:0 "Open the Bazaar"
 PER_open_the_bazaar_desc:0 "Trade opinion +20%. Consumer goods -5%. Daily political power +0.10."
 PER_release_the_prisoners:0 "Release the Prisoners"
 PER_release_the_prisoners_desc:0 "Stability +10%. War support -5%."
 PER_develop_constitution:0 "Develop Constitution"
 PER_develop_constitution_desc:0 "A short chain of choices sets the ruling party, restores elections, and adds New Iranian Constitution."
 PER_restore_military:0 "Restore Military Capacity"
 PER_restore_military_desc:0 "Adds New Iranian Military. Division organization +10%, factory output +15%, military factory construction +15%."
 PER_blockade_hormuz:0 "Blockade Hormuz"
 PER_blockade_hormuz_desc:0 "Closes the strait. Importers take consumer goods +20%. The United States takes a stacking stability and national-populist penalty, shown under Global Economy Modifiers. Other Gulf oil profits stop. Gulf Oil Cannot Clear the Strait comes on for us only while the United States holds the Arabian Sea or the Persian Gulf. Russia and the other energy exporters are spared the consumer-goods hit."
 PER_total_war:0 "Total War"
 PER_total_war_desc:0 "Surrender limit +20%. Division recovery rate +10%. Consumer goods -20%. War support +20%. Regime authority moves one card toward Total Control. Strategic bombers and strike drones stay on Israel and the Gulf. A raid on Iran starts a five-day missile salvo. If no new raid lands, the missiles stop. The army is not ordered to rush."
 IRG_war_on_israel:0 "War on Israel"
 IRG_war_on_israel_desc:0 "Requires peace. Grants an annexation war goal against Israel."
 PER_empower_houthis:0 "Empower the Houthis"
 PER_empower_houthis_desc:0 "The Houthis keep Iranian Support. That spirit is the mark the Proxy Network supplies. If they have lost it, this puts it back."
 PER_activate_shiite:0 "Activate Shiite Militias"
 PER_activate_shiite_desc:0 "Iraq's Shiite Militias keep the off-map factory and gain daily theocratic absolutism support +0.1."
 PER_squeeze_saudis:0 "Squeeze the Saudis"
 PER_squeeze_saudis_desc:0 "Saudi Arabia gains Squeezed by Iran. Oil profits -70%, stability -30%, and a rotating monthly hit to buildings. Importers take consumer goods +10%. The United States takes another stacking stability and national-populist penalty."
 PER_ration_goods:0 "Ration Basic Goods"
 PER_ration_goods_desc:0 "Consumer goods +5%. Stability +5%. Regime authority moves one card toward Total Control."
 PER_diplomatic_stalling:0 "Diplomatic Stalling"
 PER_diplomatic_stalling_desc:0 "Diplomatic Stalling for 60 days. Repair speed +40% and construction speed +15%."
 PER_rally_muslims:0 "Rally the Muslim World"
 PER_rally_muslims_desc:0 "Muslim countries gain Called to the Defense of Islam for 365 days, theocratic absolutism support +0.01, and opinion of Iran +50."
 PER_press_demands:0 "Press Demands Against the USA"
 PER_press_demands_desc:0 "Unlocks Demand American Surrender on the Hormuz tab. If Washington accepts, America loses military access, docking rights, and guarantees in the Gulf, the war tab and the blockade fold, and we peace out with the United States and Israel. Israel may annex Hamas, not Hezbollah. The Houthi war is left alone."

 dd_per_smuggle_rifles:0 "Smuggle Rifles to the Houthis"
 dd_per_smuggle_rifles_desc:0 "Send 500 infantry equipment."
 dd_per_smuggle_artillery:0 "Smuggle Artillery to the Houthis"
 dd_per_smuggle_artillery_desc:0 "Send 24 artillery equipment."
 dd_per_smuggle_support:0 "Smuggle Support Gear to the Houthis"
 dd_per_smuggle_support_desc:0 "Send 20 support equipment."
 dd_hormuz_demand_surrender:0 "Demand American Surrender"
 dd_hormuz_demand_surrender_desc:0 "Washington must answer. It can be sent again after 30 days. The United States accepts only while its stability is under 10%. Acceptance pulls American forces and guarantees out of the Gulf and ends the war with the United States and Israel."
 dd_per_debug_category:0 "Iran Debug"
 dd_per_trigger_civil_war:0 "Trigger Civil War"
 dd_per_trigger_civil_war_desc:0 "The state collapses. The seven sides rise, and we choose which one to lead."
 dd_per_proxy_category:0 "Proxy Network"
 dd_per_proxy_category_desc:0 "Equipment for a proxy that carries Iranian Support. The Houthis start with it. Hezbollah can be supplied once Reconstitute Hezbollah puts the same spirit on them. The Shiites join after Anonymous Drone Attacks."
 dd_per_smuggle_rifles_hez:0 "Smuggle Rifles to Hezbollah"
 dd_per_smuggle_rifles_hez_desc:0 "Send 500 infantry equipment to Hezbollah."
 dd_per_smuggle_artillery_hez:0 "Smuggle Artillery to Hezbollah"
 dd_per_smuggle_artillery_hez_desc:0 "Send 24 artillery equipment to Hezbollah."
 dd_per_smuggle_support_hez:0 "Smuggle Support Gear to Hezbollah"
 dd_per_smuggle_support_hez_desc:0 "Send 20 support equipment to Hezbollah."
 dd_per_hez_popout:0 "Raise the Hezbollah Rebellion"
 dd_per_hez_popout_desc:0 "Hezbollah takes control of South Lebanon, raises three brigades, and goes to war with whoever held it. One use. Costs 50 command power."
 dd_per_hez_popout_cost:0 "£command_power  §Y50§!"
 dd_per_hez_popout_cost_blocked:0 "£command_power  §R50§!"
 dd_per_hez_popout_cost_tooltip:0 "Costs 50 command power."
 dd_per_smuggle_rifles_shiite:0 "Smuggle Rifles to the Shiites"
 dd_per_smuggle_rifles_shiite_desc:0 "Send 500 infantry equipment to the Shiite puppet."
 dd_per_smuggle_artillery_shiite:0 "Smuggle Artillery to the Shiites"
 dd_per_smuggle_artillery_shiite_desc:0 "Send 24 artillery equipment to the Shiite puppet."
 dd_per_smuggle_support_shiite:0 "Smuggle Support Gear to the Shiites"
 dd_per_smuggle_support_shiite_desc:0 "Send 20 support equipment to the Shiite puppet."
 dd_irq_volunteer_window:0 "Foreign Brigades"
 dd_irq_volunteer_window_desc:0 "Lend Iran's own divisions to the Shiite puppet as expeditionary forces. Move them onto land the Shiites control, then send them from the Shiite diplomacy screen."
 dd_shiite_iranian_support:0 "Iranian Direct Support"
 dd_shiite_iranian_support_desc:0 "Five off-map military factories and division organization +5%."
 dd_irq_taken_by_surprise:0 "Taken by Surprise"
 dd_irq_taken_by_surprise_desc:0 "Division organization -20%. Division defense -20%. Lasts 14 days."
 dd_irq_anonymous_drones:0 "Anonymous Drone Attacks"
 dd_irq_anonymous_drones_desc:0 "Division organization -10%. Stability -20%. Supply consumption +50%. Out-of-supply penalty +30%. Attrition +15%."
 dd_iran.40.t:0 "The Foreign Brigades Can Move"
 dd_iran.40.d:0 "Iran can lend its own divisions to the Shiite puppet as expeditionary forces while the Gulf war is on. Move them onto land the Shiites control, then send them from the Shiite diplomacy screen."
 dd_iran.40.a:0 "The brigades can move."

 dd_iran.1.t:0 "The Supreme Leader Is Dead"
 dd_iran.1.d:0 "Ali Khamenei has died in the first hours of the American and Israeli war. The state needs a successor before the Guard and the street choose one."
 dd_iran.1.a:0 "Masoud Pezeshkian will lead."
 dd_iran.1.b:0 "Mojtaba Khamenei will lead. Holy War."
 dd_iran.2.t:0 "Who Holds the State?"
 dd_iran.2.d:0 "The new constitution has to say who can overrule the parliament."
 dd_iran.2.a:0 "The clergy keep a veto."
 dd_iran.2.b:0 "An elected Islamic parliament is sovereign."
 dd_iran.2.c:0 "A secular republic."
 dd_iran.3.t:0 "Who Owns the Oil?"
 dd_iran.3.d:0 "The second article decides the economy. Elections are restored either way."
 dd_iran.3.a:0 "The oil stays public."
 dd_iran.3.b:0 "Open the bazaar to trade."
 dd_iran.3.c:0 "Give the workers a share."
 dd_iran.4.t:0 "Who Does the Law Protect?"
 dd_iran.4.d:0 "The third article decides private life. The clergy and the oil are already written down."
 dd_iran.4.a:0 "The moral code stays."
 dd_iran.4.b:0 "Reform the civil code."
 dd_iran.4.c:0 "Social progressivism."
 dd_per_social_1:0 "Moral Code"
 dd_per_social_1_desc:0 "The guidance patrols and the dress law stay. Stability +10%. War support +5%. Daily political power +0.10. Theocracy +15%. National populism +6%."
 dd_per_social_2:0 "Civil Reform"
 dd_per_social_2_desc:0 "Family law and the universities open. The dress law is no longer policed. Research speed +8%. Daily political power +0.15. Stability +5%. Social liberalism +12%. Islamic democracy +6%."
 dd_per_social_3:0 "Social Progressivism"
 dd_per_social_3_desc:0 "Equality of men and women is in the constitution. The morality police are abolished and the press is open. Research speed +15%. Factory output +10%. Monthly population +5%. Stability -8%. Progressive populism +24%. Social liberalism +12%."
 dd_iran.10.t:0 "Iran Demands Surrender"
 dd_iran.10.d:0 "Tehran will end the war if the United States drops its military access, docking rights, and guarantees across the Gulf. Israel would be left to annex Hamas. Hezbollah and the Houthis are not part of the offer. Acceptance is only on the table while American stability is under 10%."
 dd_iran.10.a:0 "Accept. Leave the Gulf."
 dd_iran.10.b:0 "Refuse."

 dd_iran_news.1.t:0 "Khamenei Is Dead"
 dd_iran_news.1.d:0 "The supreme leader has died as American and Israeli strikes open the war. Iran's proxies are being pulled under Tehran's command, and a successor has to be named."
 dd_iran_news.1.a:0 "The succession starts now."
 dd_iran_news.2.t:0 "The Islamabad Memorandum"
 dd_iran_news.2.d:0 "Pakistan has sat the United States and Iran down. The talks are public, and Tehran is treating them as a way out of the war."
 dd_iran_news.2.a:0 "Islamabad is mediating."
 dd_iran_news.3.t:0 "The Revolutionary Guard Revolts"
 dd_iran_news.3.d:0 "Dismantling the centrifuges split the Guard from the government. They have taken the south, including the oil and the strait, and they will not join a faction."
 dd_iran_news.3.a:0 "Iran is at war with itself."
 dd_iran_news.4.t:0 "Hormuz Is Closed to Oil"
 dd_iran_news.4.d:0 "Iran has shut civilian oil traffic through the Persian Gulf. Importers are paying for it. The energy exporters outside that traffic are not."
 dd_iran_news.4.a:0 "The strait is shut."
 dd_iran_news.5.t:0 "Washington Accepts Iran's Terms"
 dd_iran_news.5.d:0 "The United States is leaving the Gulf war. Access, docking, and guarantees there are revoked. Israel may take Hamas. Hezbollah and the Houthis are still fighting their own wars."
 dd_iran_news.5.a:0 "The American war is over."
 dd_iran_news.6.t:0 "Pezeshkian Succeeds Khamenei"
 dd_iran_news.6.d:0 "Masoud Pezeshkian has been named to lead Iran through the war."
 dd_iran_news.6.a:0 "A reformer in wartime."
 dd_iran_news.7.t:0 "Mojtaba Khamenei Succeeds His Father"
 dd_iran_news.7.d:0 "Mojtaba Khamenei has taken the leadership and declared a holy war."
 dd_iran_news.7.a:0 "The Guard's candidate."

 dd_per_irgc_revolt_tt:0 "About a third of the army joins the Revolutionary Guard in the south. Reactors are dismantled. IRGC Dominance moves to them, and they cannot join a faction."
 dd_per_conditional_peace_tt:0 "Israel annexes Hamas and Hezbollah. Yemen annexes the Houthis. Peace with every outside enemy except the Revolutionary Guard."
 dd_per_demand_peace_tt:0 "Israel may annex Hamas. Peace with the United States and Israel. The Gulf loses American access, docking, and guarantees. The Hormuz tab and the blockade end. Hezbollah and the Houthis keep fighting."

 DD_HORMUZ_BLOCKADE:0 "§RBlockade.§! Civilian Gulf oil is stopped. Importers have consumer goods +20%. American stability and national populism are ticking."
 DD_HORMUZ_SQUEEZE:0 "§RSaudi squeeze.§! Saudi oil profits -70%. The United States takes an extra consumer-goods and stability hit."

 dd_per_final_battle:0 "The Final Battle"
 dd_per_final_battle_desc:0 "Repair speed +30%."
 dd_per_final_battle_2:0 "The Final Battle"
 dd_per_final_battle_2_desc:0 "Repair speed +30%. Core attack and defense +10%. Factory output +10%."
 dd_per_final_battle_spirit:0 "The Final Battle"
 dd_per_final_battle_spirit_desc:0 "Repair speed stays. The later focus adds core attack, core defense, and factory output on this spirit."
 dd_per_the_irgc:0 "The IRGC"
 dd_per_the_irgc_desc:0 "Production cost -40% for reconnaissance drones, strike drones, loitering munitions, cruise missiles, and ballistic missiles."
 dd_per_artesh_navy:0 "Artesh Navy"
 dd_per_artesh_navy_desc:0 "Submarine attack +15%. Submarine surface visibility -20%."
 dd_per_irgc_navy:0 "IRGC Navy"
 dd_per_irgc_navy_desc:0 "Naval mine damage +25%. Screen ships: speed +25%, torpedo attack +20%, torpedo hit chance +15%, mine laying +30%. The screen-ship bonuses stand in for the Guard's fast-attack boats. The navy seeks battle in the Persian Gulf, the Arabian Sea, and the Red Sea."

 PER_final_battle:0 "The Final Battle"
 PER_final_battle_desc:0 "Requires a war with Israel. Adds The Final Battle. Repair speed +30%."
 PER_rally_public_support:0 "Rally Public Support"
 PER_rally_public_support_desc:0 "Requires The Final Battle. Unlocks Rally Citizen Support on the Hormuz war tab, for Iran only."
 PER_iran_against_the_world:0 "Iran Against the World"
 PER_iran_against_the_world_desc:0 "Requires The Final Battle. Upgrades The Final Battle. Repair speed +30% stays. Core attack and defense +10%. Factory output +10%."
 PER_invest_artesh:0 "Invest in the Artesh"
 PER_invest_artesh_desc:0 "Spend $50 billion and remove Underfunded Artesh."
 PER_secure_equipment:0 "Secure New Equipment"
 PER_secure_equipment_desc:0 "Two 100% research bonuses for small arms. One 100% research bonus for artillery."
 PER_the_irgc:0 "The IRGC"
 PER_the_irgc_desc:0 "Adds The IRGC. Production cost -40% for reconnaissance drones, strike drones, loitering munitions, cruise missiles, and ballistic missiles."
 PER_artesh_navy:0 "Artesh Navy"
 PER_artesh_navy_desc:0 "Submarine attack +15%. Submarine surface visibility -20%."
 PER_irgc_navy:0 "IRGC Navy"
 PER_irgc_navy_desc:0 "Naval mine damage +25%. Screen ships gain speed, torpedo attack, torpedo hit chance, and mine laying, standing in for the Guard's fast-attack boats. The navy seeks battle in the Persian Gulf, the Arabian Sea, and the Red Sea."

 dd_per_small_arms_bonus:0 "Secure New Equipment"
 dd_per_artillery_bonus:0 "Secure New Equipment"
 dd_per_rally_citizens:0 "Rally Citizen Support"
 dd_per_rally_citizens_desc:0 "Rally the public behind the war. Regime authority moves one card toward Total Control. Iran only. Usable again after 180 days."
 dd_per_rally_unlock_tt:0 "Unlocks Rally Citizen Support on the Hormuz war tab. Iran only. Each use moves regime authority one step toward Total Control, and it can be used again after 180 days."
 dd_per_rally_shift_tt:0 "Regime authority moves one card toward Total Control."
 dd_hormuz_auth_better_tt:0 "Regime authority moves one card toward Total Control."
 dd_world_econ_map_tt:0 "This country is paying a global Hormuz shock. The shocks stack. Each one costs the United States 0.2% stability per week and 0.01% national populism per day."
 dd_world_econ_category:0 "Global Economy"
 dd_per_rally_not_total_tt:0 "Regime authority is not already Total Control."
 dd_per_treasury_50_tt:0 "At least $50 billion in the treasury."

 KRD:0 "Kurds"
 KRD_DEF:0 "the Kurds"
 KRD_ADJ:0 "Kurdish"
 BLS:0 "Balochs"
 BLS_DEF:0 "the Balochs"
 BLS_ADJ:0 "Baloch"
 AHZ:0 "Ahwazi"
 AHZ_DEF:0 "the Ahwazi"
 AHZ_ADJ:0 "Ahwazi"
