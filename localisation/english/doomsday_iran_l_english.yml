 dd_iran_cw.1.t:0 "The State Has Collapsed"
 dd_iran_cw.1.d:0 "The regime no longer holds the country. The Revolutionary Guard, the monarchists, and the progressive populists are at war with everyone. The Kurds, Balochs, Ahwazi, and Azeris fight only those three. We choose which side to lead."
