l_english:
 social_democracy:0 "Social Democracy"
 social_democracy_noun:0 "Social Democrats"
 social_democracy_desc:0 "Elected government with a large welfare state. Private markets remain. Labour law and public services set the floor."
 social_democrat:0 "Social Democracy"
 social_democrat_desc:0 "Elected government with a large welfare state. Private markets remain. Labour law and public services set the floor."
 social_liberalism:0 "Social Liberalism"
 social_liberalism_noun:0 "Social Liberals"
 social_liberalism_desc:0 "Elected government that puts civil rights and open markets first. The state regulates. It does not run the economy."
 social_liberal:0 "Social Liberalism"
 social_liberal_desc:0 "Elected government that puts civil rights and open markets first. The state regulates. It does not run the economy."
 liberal_conservatism:0 "Liberal Conservatism"
 liberal_conservatism_noun:0 "Liberal Conservatives"
 liberal_conservatism_desc:0 "Elected government built on property, fiscal caution, and slow reform. Institutions stay, and change has to pass through them."
 liberal_conservative:0 "Liberal Conservatism"
 liberal_conservative_desc:0 "Elected government built on property, fiscal caution, and slow reform. Institutions stay, and change has to pass through them."
 progressive_populism:0 "Progressive Populism"
 progressive_populism_noun:0 "Progressive Populists"
 progressive_populism_desc:0 "Elected government claiming a mandate against elites, from the left. Redistribution and social change are the program."
 progressive_populist:0 "Progressive Populism"
 progressive_populist_desc:0 "Elected government claiming a mandate against elites, from the left. Redistribution and social change are the program."
 national_populism:0 "National Populism"
 national_populism_noun:0 "National Populists"
 national_populism_desc:0 "Elected government that puts the nation ahead of the cosmopolitan centre. Ballots continue. Courts, the press, and rivals are pressed."
 national_populist:0 "National Populism"
 national_populist_desc:0 "Elected government that puts the nation ahead of the cosmopolitan centre. Ballots continue. Courts, the press, and rivals are pressed."
 sovereign_democracy:0 "Sovereign Democracy"
 sovereign_democracy_noun:0 "Sovereign Democrats"
 sovereign_democracy_desc:0 "A managed state. Parties and parliaments exist, but the ruling circle does not leave office."
 oligarch:0 "Oligarchy"
 oligarch_desc:0 "A managed state. Parties and parliaments exist, but the ruling circle does not leave office."
 military_junta:0 "Military Junta"
 military_junta_noun:0 "Junta"
 military_junta_desc:0 "Officers hold the ministries. Civilian politics is suspended or reduced to a stamp."
 junta:0 "Military Junta"
 junta_desc:0 "Officers hold the ministries. Civilian politics is suspended or reduced to a stamp."
 absolute_monarchy:0 "Absolute Monarchy"
 absolute_monarchy_noun:0 "Monarchists"
 absolute_monarchy_desc:0 "The crown is the state. Ministers advise. They do not rule."
 absolute_monarchist:0 "Absolute Monarchy"
 absolute_monarchist_desc:0 "The crown is the state. Ministers advise. They do not rule."
 state_socialism:0 "State Socialism"
 state_socialism_noun:0 "Vanguardists"
 state_socialism_desc:0 "A vanguard party holds the state and the commanding heights of the economy."
 vanguardist:0 "Vanguardism"
 vanguardist_desc:0 "A vanguard party holds the state and the commanding heights of the economy."
 left_wing_nationalism:0 "Left-Wing Nationalism"
 left_wing_nationalism_noun:0 "Left Nationalists"
 left_wing_nationalism_desc:0 "National politics with a left program. The party claims to speak for the people and the country."
 left_nationalist:0 "Left-Wing Nationalism"
 left_nationalist_desc:0 "National politics with a left program. The party claims to speak for the people and the country."
 islamic_democracy:0 "Islamic Democracy"
 islamic_democracy_noun:0 "Islamic Democrats"
 islamic_democracy_desc:0 "Elected government inside an Islamic public order. Ballots and religious law share the constitution."
 islamic_democrat:0 "Islamic Democracy"
 islamic_democrat_desc:0 "Elected government inside an Islamic public order. Ballots and religious law share the constitution."
 theocratic_absolutism:0 "Theocratic Absolutism"
 theocratic_absolutism_noun:0 "Theocrats"
 theocratic_absolutism_desc:0 "Clerics hold sovereignty. Law is religious ruling, administered by the faithful."
 theocrat:0 "Theocratic Absolutism"
 theocrat_desc:0 "Clerics hold sovereignty. Law is religious ruling, administered by the faithful."
 jihadist_fundamentalism:0 "Jihadist Fundamentalism"
 jihadist_fundamentalism_noun:0 "Jihadists"
 jihadist_fundamentalism_desc:0 "Armed rule aimed at a purified Islamic order. The state is a camp on the way to a caliphate."
 jihadist:0 "Jihadist Fundamentalism"
 jihadist_desc:0 "Armed rule aimed at a purified Islamic order. The state is a camp on the way to a caliphate."
 democratic_confederalism:0 "Democratic Confederalism"
 democratic_confederalism_noun:0 "Confederalists"
 democratic_confederalism_desc:0 "Councils and communes govern from the bottom up, with a communal economy and armed self-defence, and without a conventional nation-state."
 confederalist:0 "Democratic Confederalism"
 confederalist_desc:0 "Councils and communes govern from the bottom up, with a communal economy and armed self-defence, and without a conventional nation-state."
 fascism:0 "Fascism"
 fascism_noun:0 "Fascists"
 fascism_desc:0 "The leader, the nation, and the party are one. Organized opposition is treated as treason."
 fascism_ideology:0 "Fascism"
 fascism_ideology_desc:0 "The leader, the nation, and the party are one. Organized opposition is treated as treason."
 communism:0 "Communism"
 communism_noun:0 "Communists"
 communism_desc:0 "A communist party rules in the name of the working class and aims at a classless society. The commanding heights are not private."
 marxism:0 "Communism"
 marxism_desc:0 "A communist party rules in the name of the working class and aims at a classless society. The commanding heights are not private."
 technocracy:0 "Technocracy"
 technocracy_noun:0 "Technocrats"
 technocracy_desc:0 "Engineers, managers, and planners govern. Expertise outranks party and faction."
 technocrat:0 "Technocracy"
 technocrat_desc:0 "Engineers, managers, and planners govern. Expertise outranks party and faction."
 anarcho_communism:0 "Anarcho-Communism"
 anarcho_communism_noun:0 "Anarcho-Communists"
 anarcho_communism_desc:0 "No state and no capital. Communes and mutual aid replace ministries."
 anarcho_communist:0 "Anarcho-Communism"
 anarcho_communist_desc:0 "No state and no capital. Communes and mutual aid replace ministries."
