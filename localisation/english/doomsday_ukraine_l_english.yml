l_english:
 UKR_desperate_defence:0 "Desperate Defence"
 UKR_desperate_defence_desc:0 "The line has to hold. Entrenchment speed +25%. Maximum entrenchment +10."
 UKR_secure_arms_support:0 "Secure Arms Support"
 UKR_secure_arms_support_desc:0 "Opens the arms requests. Each donor is a separate ask, 50 political power, and it can be made again after a year. National populist and fascist governments are less likely to say yes."
 UKR_the_front:0 "Men for the Trenches"
 UKR_the_front_desc:0 "The drones do not hold a trench. 25,000 men and rifles for the line."
 UKR_the_drone_line:0 "The Drone Line"
 UKR_the_drone_line_desc:0 "Reconnaissance drones, strike drones, and loitering munitions. The kill zone in front of the trenches is built out of airframes, not a new doctrine."
 UKR_drone_tactics:0 "Drone Tactics"
 UKR_drone_tactics_desc:0 "The drones are used to break an assault before it reaches the trench. Division defence +20%. Core defence +10%."
 UKR_home_shells:0 "Home Shells"
 UKR_home_shells_desc:0 "Two military factories and a batch of guns. Ends Shell Hunger if the reserve has already run out, and stops it from taking hold later."
 UKR_home_shells_tt:0 "Shell Hunger ends if it has already taken hold, and it will not take hold after this."
 UKR_long_shells:0 "Long Shells"
 UKR_long_shells_desc:0 "A standard shell dies inside the drone kill zone. Another plant and another batch, for the guns that have to reach past it."
 UKR_the_air_umbrella:0 "The Air Umbrella"
 UKR_the_air_umbrella_desc:0 "Patriot stocks ran thin, and the jet-powered drones are harder to hit. Sixteen interceptor missiles, and anti-air over Kyiv, Kharkiv, Chernihiv, and Odesa where Ukraine still holds them."
 UKR_the_funding_gap:0 "The Funding Gap"
 UKR_the_funding_gap_desc:0 "The defence budget is short about 27 billion for the year. If the treasury can cover it, 1.5 billion buys two military factories. If it cannot, one factory is stood up and stability drops."
 UKR_the_fortress_belt:0 "The Fortress Belt"
 UKR_the_fortress_belt_desc:0 "Concrete at Kramatorsk and Kharkiv, the cities the Donbas assaults are trying to crack. Forts go up only in states Ukraine still holds."
 UKR_electronic_warfare:0 "The Radar Net"
 UKR_electronic_warfare_desc:0 "Radar stations over Kyiv and Kharkiv, and another flight of reconnaissance drones."
 UKR_the_black_sea:0 "Naval Drones"
 UKR_the_black_sea_desc:0 "Strike drones, loitering munitions, and convoys for the boats working the Russian coast. The grain ships are still shut in while the war lasts."
 UKR_odesa_batteries:0 "Odesa Batteries"
 UKR_odesa_batteries_desc:0 "Coastal guns and anti-air on the Odesa port, if Ukraine holds it. If the port has already been lost, the boats get what can still be scraped together."
 UKR_deep_strike:0 "Deep Strike"
 UKR_deep_strike_desc:0 "Long-range drones for the Russian rear. A refinery hit after Washington's diesel warning still cuts Starlink for seven days."
 UKR_the_land_bridge:0 "The Land Bridge"
 UKR_the_land_bridge_desc:0 "Mechanized vehicles and tanks for the push at the occupied coast. The corridor is ground that has to be taken, not a permanent bonus."
 UKR_crimea:0 "Crimea"
 UKR_crimea_desc:0 "If the peninsula is already held, Sevastopol gets a naval base and coastal guns. If it is not, the focus delivers the drones, convoys, and experience for the campaign."
 UKR_the_grid:0 "The Grid"
 UKR_the_grid_desc:0 "Power sites and repaired roads in Kyiv, Kharkiv, Odesa, Mykolaiv, and Kramatorsk, where Ukraine holds them. Russia can knock this down again."
 UKR_the_veterans:0 "The Veterans"
 UKR_the_veterans_desc:0 "Requires peace. Housing and care in Kyiv for the men who come off the line. Either the 1991 path or the peace path can reach it, once the war has stopped."
 UKR_anti_corruption:0 "Anti-Corruption"
 UKR_anti_corruption_desc:0 "The donors have started to ask who is signing the contracts. One billion into the treasury, and better relations with the United States, Britain, France, Germany, and Poland."
 UKR_frozen_assets:0 "Frozen Assets"
 UKR_frozen_assets_desc:0 "Requires peace. A slice of immobilized Russian state assets, four billion, paid into the treasury. Not the whole sum."
 UKR_training_abroad:0 "Training Abroad"
 UKR_training_abroad_desc:0 "Operation Interflex and the other camps send a brigade's worth of men home, with rifles and army experience. They come home as soldiers, not as a training-time modifier."
 UKR_the_call_up:0 "The Call-Up"
 UKR_the_call_up_desc:0 "Budanov's figure is 30,000 men a month, and the draft is already the bitterest politics in the country. Either path can order it, after Koretskyi's cabinet or after Syrskyi stays. 40,000 men now. If the law is still short of it, conscription becomes Service by Requirement. Stability -6%. War support +5%."
 UKR_bring_them_back:0 "Bring Them Back"
 UKR_bring_them_back_desc:0 "Absent without leave is a hole in the units. An amnesty brings 20,000 of them back onto the rolls, and the home front steadies a little. Follows the call-up, so either political path can reach it."
 UKR_how_it_ends:0 "The War Aim"
 UKR_how_it_ends_desc:0 "Kyiv states what the war is for. Political power for the choice that follows: no concession, or a ceasefire."
 UKR_no_concession:0 "No Concession"
 UKR_no_concession_desc:0 "No land for a paper peace. War support, command power, and army experience. Mutually exclusive with A Ceasefire."
 UKR_to_the_1991_border:0 "To the 1991 Border"
 UKR_to_the_1991_border_desc:0 "The army is pointed at the 1991 border. Rifles, guns, and mechanized vehicles for that offensive, and war support."
 UKR_hold_what_we_take:0 "Hold What We Take"
 UKR_hold_what_we_take_desc:0 "A fort and road at Kherson, and infrastructure at Mykolaiv, where Ukraine still holds them. Claims on Kursk, Voronezh, Taganrog, Rostov, Krasnodar, the Caucasus Mountains, and Donetsk."
 UKR_a_ceasefire:0 "A Ceasefire"
 UKR_a_ceasefire_desc:0 "The home front steadies and the appetite for the war drops. Stability +8%. War support -8%. Mutually exclusive with No Concession. Peace ends the Western financial package."
 UKR_propose_the_freeze:0 "Propose the Freeze"
 UKR_propose_the_freeze_desc:0 "Moscow is asked to stop the war. If it accepts, Russia takes Crimea, Donetsk, Luhansk, the Azov coast, and the left bank of Kherson, and keeps any other Ukrainian state it still controls. Russia usually refuses unless the war is already going badly."
 UKR_the_price_of_peace:0 "The Price of Peace"
 UKR_the_price_of_peace_desc:0 "Requires peace. Stability +20%. Conscription becomes Volunteer Only. Ukrainian Reconstruction: repair speed +30%, construction speed +30%."
 UKR_the_grain_corridor:0 "The Grain Corridor"
 UKR_the_grain_corridor_desc:0 "Requires peace, and it follows the veterans. The Black Sea is shut to grain and metal while the shooting lasts. Once it stops, the convoys, a civilian factory, and half a billion in export money come back."
 UKR_who_holds_the_state:0 "Under Martial Law"
 UKR_who_holds_the_state_desc:0 "Martial law runs to 29 January 2027. There has been no election since 2019. The office and the general staff are the two centers of power."
 UKR_the_office_holds:0 "The Office Holds"
 UKR_the_office_holds_desc:0 "Zelenskyy stays the president and the war lead. Mutually exclusive with The Generals' Answer."
 UKR_koretskyi_cabinet:0 "The Koretskyi Cabinet"
 UKR_koretskyi_cabinet_desc:0 "Serhii Koretskyi, from Naftogaz, became prime minister on 16 July 2026 after the Rada dismissed Yuliia Svyrydenko. A civilian factory, and the power sites in Kyiv and Kharkiv are repaired."
 UKR_after_fedorov:0 "After Fedorov"
 UKR_after_fedorov_desc:0 "In July 2026 the defence minister Mykhailo Fedorov was dismissed after a clash with the generals. Protests followed, and he called for elections. The office survives it. He leaves the cabinet. Stability -5%. War support -2%."
 dd_reconstruction_capital:0 "Reconstruction Capital"
 dd_reconstruction_capital_desc:0 "Construction speed +10%. Consumer goods factories -5%."
 dd_saceur:0 "SACEUR"
 dd_saceur_desc:0 "Army attack +5%. Army defence +5%. Planning speed +10%."
 dd_digital_ministry:0 "Digital Ministry"
 dd_digital_ministry_desc:0 "Research speed +5%. Factory efficiency cap +5%."
 UKR_the_eu_chapter:0 "The EU Chapter"
 UKR_the_eu_chapter_desc:0 "Accession is how the war is paid for, and it is gated on the books being clean. One extra research slot, and better relations with France, Germany, and Poland."
 UKR_security_guarantees:0 "Security Guarantees"
 UKR_security_guarantees_desc:0 "Requires peace. The United States, Britain, France, Germany, and Poland are asked to guarantee Ukraine. Zelenskyy's line is that martial law lifts when the guarantees are real."
 UKR_security_guarantees_tt:0 "Each of those countries can accept or refuse. National populist and fascist governments usually refuse. Washington is unsure either way."
 UKR_the_generals_answer:0 "The General Staff"
 UKR_the_generals_answer_desc:0 "The army's name, not the office's, is what the polls keep returning to. The General Staff spirit: attack +5%, defence +5%, planning speed +10%. Army experience and command power. Mutually exclusive with The Office Holds. Syrskyi stays in command."
 UKR_syrskyi_stays:0 "Syrskyi Stays"
 UKR_syrskyi_stays_desc:0 "Oleksandr Syrskyi keeps the General Staff. His skill and defence rating go up."
 UKR_bring_zaluzhnyi_home:0 "Bring Zaluzhnyi Home"
 UKR_bring_zaluzhnyi_home_desc:0 "Valerii Zaluzhnyi leaves the embassy in London and takes a field command. He is not president yet. The vote, when it comes, follows the pie."
 UKR_the_other_commands:0 "The Other Commands"
 UKR_the_other_commands_desc:0 "Oleksandr Tarnavskyi and Kyrylo Budanov take corps commands. No political power."
 UKR_a_vote_when_it_is_over:0 "A Vote When It Is Over"
 UKR_a_vote_when_it_is_over_desc:0 "Requires peace. Martial law is what blocks a national vote. The largest party takes office. A tie stays with the party already ahead: Servant of the People, the Radical Party, European Solidarity, Batkivshchyna, Platform for Life, the Communists, then Svoboda."
 UKR_a_vote_when_it_is_over_tt:0 "The largest slice forms the government. Its leader becomes president."
 dd_ukr_western_package:0 "Western Financial Investment Package"
 dd_ukr_western_package_desc:0 "Eight civilian factories, paid for from abroad. Removed when Ukraine is at peace."
 dd_ukr_defensive_bulwark:0 "Defensive Bulwark"
 dd_ukr_defensive_bulwark_desc:0 "Division defence +30%."
 dd_ukr_desperate_defence:0 "Desperate Defence"
 dd_ukr_desperate_defence_desc:0 "Entrenchment speed +25%. Maximum entrenchment +10."
 dd_ukr_shell_hunger:0 "Shell Hunger"
 dd_ukr_shell_hunger_desc:0 "The artillery reserve hit zero. Artillery attack -10%. Factory output -5%. Home Shells ends it."
 dd_ukr_air_umbrella:0 "The Air Umbrella"
 dd_ukr_air_umbrella_desc:0 "Intercept efficiency +15%. Static anti-air hit chance +20%."
 dd_ukr_electronic_warfare:0 "Electronic Warfare"
 dd_ukr_electronic_warfare_desc:0 "Close air support damage taken -20%. Decryption +10%."
 dd_ukr_deep_strike:0 "Deep Strike"
 dd_ukr_deep_strike_desc:0 "Ground attack +15%. Strategic bombing +10%."
 dd_ukr_land_bridge:0 "The Land Bridge"
 dd_ukr_land_bridge_desc:0 "Division attack +10%. Breakthrough +5%."
 dd_ukr_crimea:0 "Crimea"
 dd_ukr_crimea_desc:0 "Naval invasion penalty -25%. Division attack +5%."
 dd_ukr_the_grid:0 "The Grid"
 dd_ukr_the_grid_desc:0 "Infrastructure construction +20%. Factory repair +15%."
 dd_ukr_veterans:0 "The Veterans"
 dd_ukr_veterans_desc:0 "Army morale +10%. Organization regain +10%. Stability +5%."
 dd_ukr_anti_corruption:0 "Anti-Corruption"
 dd_ukr_anti_corruption_desc:0 "Stability +5%. Political power gain +10%. Trade opinion +10%."
 dd_ukr_frozen_assets:0 "Frozen Assets"
 dd_ukr_frozen_assets_desc:0 "Consumer goods -5%."
 dd_ukr_training_abroad:0 "Training Abroad"
 dd_ukr_training_abroad_desc:0 "Division training time -15%. Army experience gain +10%."
 dd_ukr_the_call_up:0 "The Call-Up"
 dd_ukr_the_call_up_desc:0 "Recruitable population +1%. Stability -5%. War support +5%."
 dd_ukr_bring_them_back:0 "Bring Them Back"
 dd_ukr_bring_them_back_desc:0 "Army morale +10%. Organization regain +10%."
 dd_ukr_shell.1.t:0 "Shell Hunger"
 dd_ukr_shell.1.d:0 "The guns have been firing faster than shells could be replaced. Western deliveries lagged, and the domestic plants have not caught the rate of fire. The artillery reserve is empty."
 dd_ukr_shell.1.a:0 "The guns are hungry."
 dd_ukr_home_shells:0 "Home Shells"
 dd_ukr_home_shells_desc:0 "Artillery build cost -15%. Factory output +5%."
 dd_ukr_drone_line:0 "The Drone Line"
 dd_ukr_drone_line_desc:0 "Division attack +5%. Close air support efficiency +10%. Ground attack +10%."
 dd_ukr_general_staff:0 "The General Staff"
 dd_ukr_general_staff_desc:0 "Attack +5%. Defence +5%. Planning speed +10%."
 dd_ukr_reconstruction:0 "Ukrainian Reconstruction"
 dd_ukr_reconstruction_desc:0 "Repair speed +30%. Construction speed +30%."
 dd_ukr_drone_tactics:0 "Drone Tactics"
 dd_ukr_drone_tactics_desc:0 "Division defence +20%. Core defence +10%."
 dd_ukr_the_front:0 "The Front"
 dd_ukr_the_front_desc:0 "Division defence +10%. Core defence +5%."
 dd_ukr_black_sea:0 "The Black Sea"
 dd_ukr_black_sea_desc:0 "Convoy raiding +20%. Naval detection +15%."
 dd_ukr_the_office:0 "The Office Holds"
 dd_ukr_the_office_desc:0 "Stability +10%. War support +5%. Political power gain +10%."
 dd_ukr_koretskyi:0 "The Koretskyi Cabinet"
 dd_ukr_koretskyi_desc:0 "Factory repair +25%. Infrastructure construction +15%. Civilian factory construction +10%."
 dd_ukr_budanov:0 "Budanov Beside the President"
 dd_ukr_budanov_desc:0 "Planning speed +15%. Decryption +10%. Intelligence network gain +20%."
 dd_ukr_eu_track:0 "The EU Chapter"
 dd_ukr_eu_track_desc:0 "Research speed +5%. Trade opinion +15%."
 dd_ukr_guarantees:0 "Security Guarantees"
 dd_ukr_guarantees_desc:0 "Core defence +10%. War support +5%."
 dd_ukr_generals:0 "The Generals' Answer"
 dd_ukr_generals_desc:0 "Army experience gain +10%. Command power gain +15%. War support +5%."
 dd_ukr_syrskyi:0 "Syrskyi Stays"
 dd_ukr_syrskyi_desc:0 "Division defence +10%. Maximum entrenchment +5. Planning speed +10%."
 dd_ukr_no_concession:0 "No Concession"
 dd_ukr_no_concession_desc:0 "War support +10%. Division attack +5%. Core defence +5%."
 dd_ukr_to_the_border:0 "To the 1991 Border"
 dd_ukr_to_the_border_desc:0 "Division attack +10%. Breakthrough +5%."
 dd_ukr_hold_the_line_taken:0 "Hold What We Take"
 dd_ukr_hold_the_line_taken_desc:0 "Compliance gain +5%. Resistance target -10%. Core defence +5%."
 dd_ukr_ceasefire_track:0 "A Ceasefire"
 dd_ukr_ceasefire_track_desc:0 "Stability +5%. War support -10%. Consumer goods -5%."
 dd_ukr_price_of_peace:0 "The Price of Peace"
 dd_ukr_price_of_peace_desc:0 "Factory repair +20%. Construction speed +10%. Stability +5%."
 dd_ukr_starlink_disabled:0 "Starlink Disabled"
 dd_ukr_starlink_disabled_desc:0 "Seven days. Organization -5%. Close air support efficiency -20%. Close air support presence -25%. Ground attack -20%."
 dd_ukr_arms_category:0 "Arms Support"
 dd_ukr_arms_category_desc:0 "National populist and fascist governments are less likely to give support. Asking one country locks only that country for a year. The others stay open."
 dd_ukr_asked_usa:0 "The United States was already asked this year"
 dd_ukr_asked_ger:0 "Germany was already asked this year"
 dd_ukr_asked_eng:0 "Britain was already asked this year"
 dd_ukr_asked_nordics:0 "The Nordics were already asked this year"
 dd_ukr_asked_hol:0 "The Netherlands was already asked this year"
 dd_ukr_asked_fra:0 "France was already asked this year"
 dd_ukr_asked_pol:0 "Poland was already asked this year"
 dd_ukr_asked_can:0 "Canada was already asked this year"
 dd_ukr_ask_usa:0 "Request Arms from the United States"
 dd_ukr_ask_usa_desc:0 "Washington agrees about half the time."
 dd_ukr_aid_usa_tt:0 "If accepted: rifles 800, artillery 40, support equipment 36, air-defence missiles 12, mechanized 80."
 dd_ukr_aid_usa_hormuz_tt:0 "The Strait of Hormuz is closed. Washington may demand that Russian diesel be left alone."
 dd_ukr_ask_ger:0 "Request Arms from Germany"
 dd_ukr_ask_ger_desc:0 "Germany has been the largest European payer."
 dd_ukr_aid_ger_tt:0 "If accepted: rifles 250, artillery 20, support equipment 18, air-defence missiles 8, mechanized 48, tanks 12."
 dd_ukr_ask_eng:0 "Request Arms from the United Kingdom"
 dd_ukr_ask_eng_desc:0 "Britain is the other large European donor."
 dd_ukr_aid_eng_tt:0 "If accepted: rifles 400, artillery 16, support equipment 24, air-defence missiles 4, tanks 6."
 dd_ukr_ask_nordics:0 "Request Arms from the Nordics"
 dd_ukr_ask_nordics_desc:0 "One request. Denmark, Sweden, and Norway each answer on their own."
 dd_ukr_aid_nordic_tt:0 "Sweden, if it accepts: rifles 120, artillery 12, support equipment 8, mechanized 36. Norway, if it accepts: rifles 100, artillery 8, support equipment 10, air-defence missiles 6. Denmark, if it accepts: rifles 120, artillery 10, support equipment 6, fighters 3."
 dd_ukr_ask_hol:0 "Request Arms from the Netherlands"
 dd_ukr_ask_hol_desc:0 "Dutch air defence, aircraft, and armour."
 dd_ukr_aid_hol_tt:0 "If accepted: rifles 120, artillery 8, support equipment 8, air-defence missiles 5, mechanized 24, tanks 8, fighters 2."
 dd_ukr_ask_fra:0 "Request Arms from France"
 dd_ukr_ask_fra_desc:0 "French guns first, then lighter armour."
 dd_ukr_aid_fra_tt:0 "If accepted: rifles 220, artillery 18, support equipment 14, air-defence missiles 3, mechanized 20."
 dd_ukr_ask_pol:0 "Request Arms from Poland"
 dd_ukr_ask_pol_desc:0 "Poland has sent more tanks than anyone else."
 dd_ukr_aid_pol_tt:0 "If accepted: rifles 500, artillery 18, support equipment 16, tanks 14."
 dd_ukr_ask_can:0 "Request Arms from Canada"
 dd_ukr_ask_can_desc:0 "A smaller package: vehicles, shells, and some air defence."
 dd_ukr_aid_can_tt:0 "If accepted: rifles 220, artillery 8, support equipment 12, air-defence missiles 3, mechanized 20."
 dd_ukr_aid_accept:0 "Send the arms"
 dd_ukr_aid_reject:0 "Not this year"
 dd_ukr_aid.1.t:0 "Ukraine Asks for Arms"
 dd_ukr_aid.1.d:0 "Kyiv wants rifles, shells, air-defence missiles, and mechanized vehicles from American stocks."
 dd_ukr_aid.2.t:0 "Russian Diesel"
 dd_ukr_aid.2.d:0 "The Strait of Hormuz is closed. Ukraine is asking for weapons in the same season Washington is watching every barrel. A demand can be attached: leave Russian diesel alone."
 dd_ukr_aid.2.a:0 "Tell them to spare the diesel"
 dd_ukr_aid.2.b:0 "Send nothing extra"
 dd_ukr_aid.3.t:0 "Washington Names Its Price"
 dd_ukr_aid.3.d:0 "The United States wants Russian diesel left alone while the Strait of Hormuz is closed. A strike on a deep Russian refinery after this will cost the link for a week."
 dd_ukr_aid.3.a:0 "We heard them."
 dd_ukr_aid.4.t:0 "Starlink Disabled"
 dd_ukr_aid.4.d:0 "A deep Russian refinery was hit after Washington said to leave the diesel alone. For seven days the link is down. Organization -5%. Close air support is blunted."
 dd_ukr_aid.4.a:0 "Seven days in the dark."
 dd_ukr_aid.11.t:0 "Ukraine Asks Berlin"
 dd_ukr_aid.11.d:0 "Kyiv wants guns, air defence, mechanized vehicles, and tanks from Germany."
 dd_ukr_aid.12.t:0 "Ukraine Asks London"
 dd_ukr_aid.12.d:0 "Kyiv wants rifles, guns, and a handful of tanks from Britain."
 dd_ukr_aid.13.t:0 "Ukraine Asks Stockholm"
 dd_ukr_aid.13.d:0 "Kyiv wants guns and infantry fighting vehicles from Sweden."
 dd_ukr_aid.14.t:0 "Ukraine Asks Oslo"
 dd_ukr_aid.14.d:0 "Kyiv wants shells and air-defence missiles from Norway."
 dd_ukr_aid.15.t:0 "Ukraine Asks Copenhagen"
 dd_ukr_aid.15.d:0 "Kyiv wants guns and fighters from Denmark."
 dd_ukr_aid.16.t:0 "Ukraine Asks The Hague"
 dd_ukr_aid.16.d:0 "Kyiv wants air defence, armour, and fighters from the Netherlands."
 dd_ukr_aid.17.t:0 "Ukraine Asks Paris"
 dd_ukr_aid.17.d:0 "Kyiv wants guns and lighter armour from France."
 dd_ukr_aid.18.t:0 "Ukraine Asks Warsaw"
 dd_ukr_aid.18.d:0 "Kyiv wants rifles, guns, and tanks from Poland."
 dd_ukr_aid.19.t:0 "Ukraine Asks Ottawa"
 dd_ukr_aid.19.d:0 "Kyiv wants vehicles, shells, and some air defence from Canada."
 dd_ukr_aid.20.t:0 "Arms Received"
 dd_ukr_aid.20.d:0 "[From.GetNameDefCap] agreed to the request. The shipment is in our stocks."
 dd_ukr_aid.20.a:0 "Put it in the depots."
 dd_ukr_aid.21.t:0 "Arms Refused"
 dd_ukr_aid.21.d:0 "[From.GetNameDefCap] refused the request. They will not send arms this year."
 dd_ukr_aid.21.a:0 "Ask again next year."
 dd_ukr_peace.1.t:0 "Ukraine Offers a Freeze"
 dd_ukr_peace.1.d:0 "Kyiv proposes to stop the war. Russia would take Crimea, Donetsk, Luhansk, the Azov coast, and the left bank of Kherson, and keep any other Ukrainian state it still controls."
 dd_ukr_peace.1.a:0 "Take the ground and stop"
 dd_ukr_peace.1.b:0 "The war goes on"
 dd_ukr_peace.2.t:0 "Moscow Accepts the Freeze"
 dd_ukr_peace.2.d:0 "Russia keeps Crimea, Donetsk, Luhansk, the Azov coast, and the left bank of Kherson, and any other Ukrainian state it still held. The fighting stops. The Western financial package ends with the peace."
 dd_ukr_peace.2.a:0 "The guns stop."
 dd_ukr_peace.3.t:0 "Moscow Refuses"
 dd_ukr_peace.3.d:0 "Russia will not freeze the line. The war continues."
 dd_ukr_peace.3.a:0 "Then we keep fighting."
 UKR_ZALUZHNYI_DESC:0 "Valerii Zaluzhnyi commanded the army and then went to London as ambassador. Coming home gives him a field command. The presidency is the pie's to give."
 UKR_LYASHKO_DESC:0 "Oleh Lyashko leads the Radical Party, the national-populist list."
 UKR_POROSHENKO_DESC:0 "Petro Poroshenko leads European Solidarity, the liberal-conservative list."
 UKR_TYMOSHENKO_DESC:0 "Yulia Tymoshenko leads Batkivshchyna, the social-democratic list."
 UKR_BOYKO_DESC:0 "Yuriy Boyko leads the Platform for Life remnant, the sovereign-democratic list."
 UKR_SYMONENKO_DESC:0 "Petro Symonenko leads what is left of the Communist Party. The party is banned. The slice is the old electorate."
 UKR_TYAHNYBOK_DESC:0 "Oleh Tyahnybok leads Svoboda, the fascist list."
 dd_ukr_servant_party:0 "Servant of the People"
 dd_ukr_servant_party_long:0 "Volodymyr Zelenskyy. Servant of the People."
 dd_ukr_radical_party:0 "Radical Party"
 dd_ukr_radical_party_long:0 "Oleh Lyashko. The Radical Party."
 dd_ukr_eurosolidarity_party:0 "European Solidarity"
 dd_ukr_eurosolidarity_party_long:0 "Petro Poroshenko. European Solidarity."
 dd_ukr_batkivshchyna_party:0 "Batkivshchyna"
 dd_ukr_batkivshchyna_party_long:0 "Yulia Tymoshenko. Batkivshchyna."
 dd_ukr_platform_party:0 "Platform for Life"
 dd_ukr_platform_party_long:0 "Yuriy Boyko. The Platform for Life remnant."
 dd_ukr_cpu_party:0 "Communist Party"
 dd_ukr_cpu_party_long:0 "Petro Symonenko. The banned Communist Party's old electorate."
 dd_ukr_svoboda_party:0 "Svoboda"
 dd_ukr_svoboda_party_long:0 "Oleh Tyahnybok. Svoboda."
 dd_ukr_eu_opinion:0 "European Track"
 dd_ukr_guarantee.1.t:0 "Ukraine Asks for a Guarantee"
 dd_ukr_guarantee.1.d:0 "Kyiv says martial law stays until a guarantee is real, not merely until the shooting pauses. They are asking this country to guarantee Ukraine."
 dd_ukr_guarantee.1.a:0 "Guarantee Ukraine"
 dd_ukr_guarantee.1.b:0 "Not our war to underwrite"
 dd_ukr_guarantee.2.t:0 "A Guarantee"
 dd_ukr_guarantee.2.d:0 "[From.GetName] guarantees Ukraine."
 dd_ukr_guarantee.2.a:0 "That is something on paper."
 dd_ukr_guarantee.3.t:0 "No Guarantee"
 dd_ukr_guarantee.3.d:0 "[From.GetName] will not guarantee Ukraine."
 dd_ukr_guarantee.3.a:0 "Then the paper was never the point."

 UKR_the_grid_tt:0 "Opens Crew Rotation and National Overhaul. While the war goes on, bombing of a power city, or Russia's Strike the Power Grid decision, damages those sites and stacks Grid Under Fire. The cap is 20. Peace clears the stacks."
 UKR_shield_the_stations:0 "Shield the Stations"
 UKR_shield_the_stations_desc:0 "The batteries stay on the power stations. Ordinary bombing no longer adds a blackout stack."
 UKR_shield_the_stations_tt:0 "Strategic bombing stops raising Grid Under Fire. Russia's Strike the Power Grid decision still does."
 UKR_dispersed_power:0 "Dispersed Power"
 UKR_dispersed_power_desc:0 "The load is spread, so one strike cannot take the whole network down. Russian strikes add one stack instead of two, and the blackout cannot rise past ten."
 UKR_dispersed_power_tt:0 "Blackout cap becomes 10. Each Russian grid strike adds 1 stack and hits one city."
 UKR_repair_crews:0 "Repair Crews"
 UKR_repair_crews_desc:0 "Crews on the damaged stations. One stack comes off now, and Emergency Repair clears two from here on."
 UKR_repair_crews_tt:0 "Emergency Repair then clears two blackout stacks."
 dd_ukr_grid_category:0 "The Grid"
 dd_ukr_grid_category_desc:0 "Repair crews and transformer purchases. The live total is in Grid Status, above this list."
 dd_ukr_grid_status_category:0 "Grid Status"
 dd_ukr_grid_status_category_desc:0 "One stack is one blackout. The cards below are the live total and the rules. They are not buttons."
 dd_ukr_grid_status:0 "Blackout  [?dd_ukr_blackout|0] / [?dd_ukr_blackout_cap|0]"
 dd_ukr_grid_status_desc:0 "Each stack: factory output -4%. Stability -2%. Construction speed -3%. Consumer goods +2%.\n\nNow: factory output [?dd_ukr_grid_fac|%]. Stability [?dd_ukr_grid_stab|%]. Construction [?dd_ukr_grid_con|%]. Consumer goods [?dd_ukr_grid_cg|%].\n\n[GetDdUkrGridClock]"
 dd_ukr_grid_how:0 "How a Stack Is Gained"
 dd_ukr_grid_how_desc:0 "[GetDdUkrGridRules]"
 dd_ukr_grid_rules_open:0 "While the war with Russia lasts, a strategic bombing of Kyiv, western Kyiv, Kharkiv, Odesa, or Mykolaiv adds 1 stack, if Ukraine still holds that state. Bombing can add a stack only once every 21 days. Russia's Strike the Power Grid decision adds 2 stacks and damages two power cities, rotating through the network. The cap is 20. Peace clears every stack. Emergency Repair clears 1, or 2 after Repair Crews. Transformer imports clear 2. After The Grid, Crew Rotation clears 4 and National Overhaul clears 8."
 dd_ukr_grid_rules_shield:0 "The batteries are on the stations. Ordinary bombing no longer adds a stack. Russia's Strike the Power Grid decision still adds 2 stacks and damages two power cities. The cap is 20. Peace clears every stack. Emergency Repair clears 1, or 2 after Repair Crews. Transformer imports clear 2. Crew Rotation clears 4 and National Overhaul clears 8."
 dd_ukr_grid_rules_dispersed:0 "The load is spread. Bombing a power city still adds 1 stack, once every 21 days. Russia's Strike the Power Grid decision adds 1 stack and damages one city. The cap is 10. Peace clears every stack. Emergency Repair clears 1, or 2 after Repair Crews. Transformer imports clear 2. Crew Rotation clears 4 and National Overhaul clears 8."
 dd_ukr_grid_rules_both:0 "The batteries are on the stations, and the load is spread. Ordinary bombing adds nothing. Russia's Strike the Power Grid decision adds 1 stack and damages one city. The cap is 10. Peace clears every stack. Emergency Repair clears 1, or 2 after Repair Crews. Transformer imports clear 2. Crew Rotation clears 4 and National Overhaul clears 8."
 dd_ukr_grid_clock_shield:0 "Bombing cannot add a stack."
 dd_ukr_grid_clock_wait:0 "Bombing can add another stack in [?dd_ukr_grid_cd|0] days."
 dd_ukr_grid_clock_open:0 "A bombed power city can add a stack today."
 dd_ukr_emergency_repair:0 "Emergency Repair"
 dd_ukr_emergency_repair_desc:0 "Clear one blackout stack, or two after Repair Crews, and fix the sites in Kyiv, Kharkiv, and Odesa."
 dd_ukr_transformer_imports:0 "Transformer Imports"
 dd_ukr_transformer_imports_desc:0 "Spend 0.4 billion and clear two blackout stacks. The transformers are the part that cannot be made fast enough at home."
 dd_ukr_crew_rotation:0 "Crew Rotation"
 dd_ukr_crew_rotation_desc:0 "Opened by The Grid. Clear four blackout stacks and repair Kharkiv, Mykolaiv, and Chernihiv."
 dd_ukr_national_overhaul:0 "National Overhaul"
 dd_ukr_national_overhaul_desc:0 "Opened by The Grid. Spend 0.6 billion and clear eight blackout stacks across the main power cities."
 dd_sov_grid_category:0 "Ukrainian Grid"
 dd_sov_grid_category_desc:0 "Strike the power stations. The effect stacks on Ukraine until they repair it, or the war ends."
 dd_sov_strike_ukr_grid:0 "Strike the Power Grid"
 dd_sov_strike_ukr_grid_desc:0 "Damage Ukrainian power cities and add two blackout stacks, or one stack and one city if Ukraine has dispersed its power. The target rotates. Ninety days between strikes."
 dd_ukr_grid_blackout:0 "Grid Under Fire"
 dd_ukr_grid_blackout_desc:0 "Power stations are down. Each stack is factory output -4%, stability -2%, construction speed -3%, consumer goods +2%."
 dd_ukr_grid.1.t:0 "The Grid Is Hit"
 dd_ukr_grid.1.d:0 "Power stations are burning. Factories slow, repairs slow, and the cities go dark in turns. The stacks last until the crews catch up, or until the war stops."
 dd_ukr_grid.1.a:0 "Get the crews moving."
