 SOV_recover_finland:0 "Recover Finland"
 SOV_recover_finland_desc:0 "35 days. Annex war goal on Finland."
 SOV_recover_baltics:0 "Recover the Baltics"
 SOV_recover_baltics_desc:0 "35 days. Annex war goals on Estonia, Latvia, and Lithuania."
 SOV_mission_transnistria:0 "Mission to Transnistria"
 SOV_mission_transnistria_desc:0 "35 days. Requires Recover Finland and Recover the Baltics. Transnistria becomes a puppet. Annex war goal on Moldova."
 SOV_dismantle_nato:0 "Dismantle NATO"
 SOV_dismantle_nato_desc:0 "70 days. Annex war goal on the leader of NATO."
