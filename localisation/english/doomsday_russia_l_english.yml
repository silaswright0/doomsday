 SOV_militarize_population:0 "Militarize the Entire Population"
 SOV_militarize_population_desc:0 "35 days. Conscription becomes Service by Requirement if the current law is lower. Recruitable population +3%. War support +10%. Training time -10%."
 SOV_confiscate_property:0 "Confiscate Enemy Alien Property"
 SOV_confiscate_property_desc:0 "35 days. Political power +100. Four off-map civilian factories and two off-map military factories. Factory output +5%. Consumer goods -5%."
 SOV_penal_battalions:0 "Penal Vanguard Battalions"
 SOV_penal_battalions_desc:0 "35 days. Requires Militarize the Entire Population. Division attack +8%. Breakthrough +5%. Organization -8%. Recovery -5%. Recruitable population +2%."
 SOV_sixteen_hours:0 "16 Hour Factory Workdays"
 SOV_sixteen_hours_desc:0 "35 days. Requires Confiscate Enemy Alien Property. Factory output +15%. Production efficiency growth +10%. Stability -10%. Daily political power -0.05."
 SOV_novorossiya:0 "The Reconquista of Novorossiya"
 SOV_novorossiya_desc:0 "35 days. Requires the penal battalions and the 16 hour day. Claims Crimea, Odessa, Mykolaiv, Kherson, Nikopol, the Donbas, and the Azov shore. An annex war goal on Ukraine if we are not already at war."
 SOV_sacred_soil:0 "Sacred Soil Edict"
 SOV_sacred_soil_desc:0 "35 days. Core defense +15%. Surrender limit +10%. War support +10%. Entrenchment speed +25%."
 SOV_scorched_doctrine:0 "Asymmetric Scorched Doctrine"
 SOV_scorched_doctrine_desc:0 "35 days. Core defense +10%. Our attrition -10%. War support +5%. Enemies on our territory take more attrition and find less supply."
 SOV_scorched_doctrine_tt:0 "Every owned state inflicts extra attrition and cuts enemy local supply while this spirit lasts."
 SOV_tactical_arsenal:0 "Unshackle the Tactical Arsenal"
 SOV_tactical_arsenal_desc:0 "35 days. Requires the Sacred Soil Edict. Artillery attack +10%. Breakthrough +10%. Division attack +5%. Two 100% nuclear bonuses. Two 100% rocketry bonuses. Nuclear raids no longer need 100% world tension or a prior strike."
 SOV_dissolve_csto:0 "Dissolve the CSTO"
 SOV_dissolve_csto_desc:0 "35 days. Requires Asymmetric Scorched Doctrine. Every CSTO member is told to accept annexation. A subject accepts. Anyone who refuses is left, and we are ordered to war for their annexation. The faction is then dissolved. Political power +50. War support +5%."
 dd_sov_csto_end.1.t:0 "Moscow Demands Annexation"
 dd_sov_csto_end.1.d:0 "Russia is dissolving the CSTO and demands that we be annexed into the Russian state."
 dd_sov_csto_end.1.a:0 "Accept annexation"
 dd_sov_csto_end.1.b:0 "Refuse"
 dd_sov_csto_end.2.t:0 "[FROM.GetName] Refuses Annexation"
 dd_sov_csto_end.2.d:0 "[FROM.GetName] will not be annexed. The demand is war."
 dd_sov_csto_end.2.a:0 "Go to war"
