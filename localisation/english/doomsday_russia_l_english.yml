 SOV_decree_604:0 "Decree 604"
 SOV_decree_604_desc:0 "35 days. Factory output +2%. Factory repair speed +20%. Free repair +10%."
 SOV_shadow_fleet:0 "The Shadow Fleet"
 SOV_shadow_fleet_desc:0 "35 days. Escort efficiency +25%. Fuel gain from oil +10%. Resource gain +5%. Trade opinion +20%. Clears 2 fuel-fire stacks. The stack cap stays at 30."
 SOV_reduce_fuel_exports:0 "Reduce Fuel Exports"
 SOV_reduce_fuel_exports_desc:0 "35 days. Trade law becomes Limited Exports. Clears 2 fuel-fire stacks. The stack cap stays at 30."
 SOV_protect_citizens:0 "Protect Citizens Abroad"
 SOV_protect_citizens_desc:0 "35 days. Requires The Shadow Fleet and Reduce Fuel Exports. Claims on former Soviet states with large Russian populations along the western border, in the Baltics, and in northern Kazakhstan."
 SOV_continuous_recruitment:0 "Continuous Military Recruitment"
 SOV_continuous_recruitment_desc:0 "35 days. Conscription law becomes Limited Conscription."
 SOV_dewesternize:0 "De-Westernize Our Language"
 SOV_dewesternize_desc:0 "35 days. Base war support +5%. Surrender limit +5%."
 SOV_traditional_values:0 "Enforce Traditional Values"
 SOV_traditional_values_desc:0 "35 days. Base war support +5%. Surrender limit +5%."
 SOV_ninth_duma:0 "The 9th Duma"
 SOV_ninth_duma_desc:0 "35 days. Requires both language and values focuses. Political power +200. Adds The 9th Duma: daily political power +0.05. Later focuses in this branch add to that spirit."
 SOV_time_of_heroes:0 "Time of Heroes"
 SOV_time_of_heroes_desc:0 "35 days. Mutually exclusive with Reaffirm Arbat Street. Modifies The 9th Duma: war support +10%, recruitable population +1%. Shifts the Kremlin toward the Chekists."
 SOV_reaffirm_arbat:0 "Reaffirm Arbat Street"
 SOV_reaffirm_arbat_desc:0 "35 days. Mutually exclusive with Time of Heroes. Modifies The 9th Duma: stability +10%, factory output +5%. Shifts the Kremlin toward the old establishment."
 SOV_fifth_service:0 "Prioritize the 5th Service"
 SOV_fifth_service_desc:0 "35 days. Modifies The 9th Duma: decryption +10%, encryption +10%, intel network gain +20%, enemy operative detection +15%, subversive action cost -15%. Shifts the Kremlin toward the Chekists."
 SOV_audit_mod:0 "Audit the Ministry of Defence"
 SOV_audit_mod_desc:0 "70 days. Modifies The 9th Duma: division organization +2%. Shifts the Kremlin 20 points toward the Chekists."
 SOV_procurement_guilds:0 "Empower Defence Procurement Guilds"
 SOV_procurement_guilds_desc:0 "35 days. Modifies The 9th Duma: factory output +3%, maximum production efficiency +3%. Shifts the Kremlin toward the old establishment."
 SOV_traditional_bureaucracy:0 "Protect the Traditional Bureaucracy"
 SOV_traditional_bureaucracy_desc:0 "35 days. Modifies The 9th Duma: stability +5%, command power gain +20%. Shifts the Kremlin 20 points toward the old establishment."
 SOV_sovereign_runet:0 "Sovereign Runet"
 SOV_sovereign_runet_desc:0 "35 days. Requires Time of Heroes or Reaffirm Arbat Street. Modifies The 9th Duma: encryption +10%, stability +2%. Shifts the Kremlin 5 points toward the Chekists."
 SOV_monotowns:0 "Subsidize the Monotowns"
 SOV_monotowns_desc:0 "35 days. Requires Time of Heroes or Reaffirm Arbat Street. Modifies The 9th Duma: factory output +2%, maximum production efficiency +2%. Shifts the Kremlin 5 points toward the old establishment."
 SOV_hybrid_doctrine:0 "Hybrid Doctrine"
 SOV_hybrid_doctrine_desc:0 "35 days. Requires Sovereign Runet or Subsidize the Monotowns. Modifies The 9th Duma: strategic bombing +10%, rocket attack +10%. Shifts the Kremlin 5 points toward the Chekists."
 SOV_budget_commitments:0 "Long-Term Budget Commitments"
 SOV_budget_commitments_desc:0 "35 days. Requires Sovereign Runet or Subsidize the Monotowns. Modifies The 9th Duma: maximum production efficiency +4%. Shifts the Kremlin 5 points toward the old establishment."
 SOV_foreign_disruption:0 "Foreign Disruption"
 SOV_foreign_disruption_desc:0 "35 days. Requires Hybrid Doctrine or Long-Term Budget Commitments. Modifies The 9th Duma: boost ideology mission +25%, opinion gain with the same ideology +25%. Unlocks the Sovereign Influence operation. Shifts the Kremlin 5 points toward the Chekists."
 SOV_doctrine_at_scale:0 "Russian Doctrine at Scale"
 SOV_doctrine_at_scale_desc:0 "35 days. Requires Hybrid Doctrine or Long-Term Budget Commitments. Modifies The 9th Duma: artillery attack +5%, breakthrough +5%. Shifts the Kremlin 5 points toward the old establishment."
 SOV_chekist_monolith:0 "The Chekist Monolith"
 SOV_chekist_monolith_desc:0 "35 days. Requires Foreign Disruption and Russian Doctrine at Scale. Requires Chekist Ascendancy, 60 or more toward the Chekists. Mutually exclusive with Arbiter of Clans and Indomitable War Machine. Adds The Chekist Monolith: one operative slot, encryption +15%, decryption +10%, war support +5%, daily political power +0.10, subversive action cost -25%."
 SOV_centralize_services:0 "Centralize Special Services"
 SOV_centralize_services_desc:0 "35 days. Modifies The Chekist Monolith: one more operative slot, encryption and decryption +10%, foreign subversive activities -25%. Shifts the Kremlin toward the Chekists."
 SOV_subjugate_general_staff:0 "Subjugate the General Staff"
 SOV_subjugate_general_staff_desc:0 "35 days. The ruling party becomes Technocracy, led by Mikhail Mishustin. Technocracy support matches the current Chekist share of the Kremlin balance. Sergey Kiriyenko can be hired as an advisor."
 SOV_surveillance_net:0 "Total Surveillance Net"
 SOV_surveillance_net_desc:0 "35 days. Encryption +20%. Stability +5%. Garrison requirement -10%. Foreign subversive activities -30%. Shifts the Kremlin toward the Chekists."
 SOV_war_machine:0 "Indomitable War Machine"
 SOV_war_machine_desc:0 "35 days. Requires Foreign Disruption and Russian Doctrine at Scale. Requires the Old Establishment, 60 or more toward the military establishment. Mutually exclusive with The Chekist Monolith and Arbiter of Clans. Division attack and defense +10%. Breakthrough +10%. War support +10%. Division recovery +5%."
 SOV_high_command_autonomy:0 "Autonomy of High Command"
 SOV_high_command_autonomy_desc:0 "35 days. Modifies Indomitable War Machine: planning speed +20%, max planning +10%, army experience gain +10%."
 SOV_war_academy:0 "General Staff War Academy"
 SOV_war_academy_desc:0 "35 days. Army experience +25. Modifies Indomitable War Machine: army experience gain +15%, division organization +5%, planning speed +10%."
 SOV_marshals_directorate:0 "Marshal's Supreme Directorate"
 SOV_marshals_directorate_desc:0 "35 days. Modifies Indomitable War Machine: division attack and defense +10%, division organization +5%, breakthrough +5%. The ruling party becomes a Military Junta. Valery Gerasimov becomes the country leader."
 SOV_war_machine_tt:0 "Indomitable War Machine: division attack and defense +10%, breakthrough +10%, war support +10%, division recovery +5%."
 SOV_high_command_tt:0 "Indomitable War Machine gains planning speed +20%, max planning +10%, and army experience gain +10%."
 SOV_war_academy_tt:0 "Indomitable War Machine gains army experience gain +15%, division organization +5%, and planning speed +10%."
 SOV_marshals_tt:0 "Indomitable War Machine gains division attack and defense +10%, division organization +5%, and breakthrough +5%."
 SOV_arbiter_of_clans:0 "Arbiter of Clans"
 SOV_arbiter_of_clans_desc:0 "35 days. Requires Foreign Disruption and Russian Doctrine at Scale. Requires a Contested Kremlin. Mutually exclusive with The Chekist Monolith and Indomitable War Machine. Stability +10%. Daily political power +0.15. War support +5%. Political power +100. The Kremlin balance returns to the center."
 SOV_state_council:0 "State Council Presidium"
 SOV_state_council_desc:0 "35 days. Adds the State Council Presidium: daily political power +0.20, stability +5%, trade opinion +10%."
 SOV_sovereign_equilibrium:0 "Sovereign Equilibrium"
 SOV_sovereign_equilibrium_desc:0 "35 days. Mutually exclusive with Summon the Modern Zemsky Sobor. Modifies the State Council Presidium: stability +15%, daily political power +0.10, war support +5%. The Kremlin balance returns to the center."
 SOV_zemsky_sobor:0 "Summon the Modern Zemsky Sobor"
 SOV_zemsky_sobor_desc:0 "35 days. Mutually exclusive with Sovereign Equilibrium. Political power +50."
 SOV_adjust_constitution:0 "Adjust Chapter 1 of the Constitution"
 SOV_adjust_constitution_desc:0 "35 days. Base stability -10%. The ruling party becomes Absolute Monarchy."
 SOV_petrine_edict:0 "The Petrine Succession Edict"
 SOV_petrine_edict_desc:0 "35 days. Political power +100. Katerina Tikhonova becomes the country leader."
 dd_sov_sovereign_influence:0 "Sovereign Influence"
 dd_sov_sovereign_influence_desc:0 "Spread our ruling ideology in the target and improve their opinion of us."
 dd_sov_influence_tt:0 "The target gains 5% support for our ruling ideology and +30 opinion of us."
