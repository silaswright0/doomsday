 SOV_csto:0 "The CSTO"
 SOV_csto_desc:0 "70 days. Opens The CSTO decisions."
 SOV_csto_tt:0 "Faction members who are still independent can be tied to our economy in three steps, costing 50, then 100, then 200 political power. The last step makes them a Dominion."
 SOV_expand_influence:0 "Expand Our Influence"
 SOV_expand_influence_desc:0 "70 days. Opens decisions to buy influence in our puppets."
 SOV_expand_influence_tt:0 "For 100 political power, once every 90 days per puppet, lower that puppet's autonomy by 300."

 SOV_georgian_puppets:0 "Reassert Control over Georgian Puppets"
 SOV_georgian_puppets_desc:0 "35 days. Requires Challenge NATO. Abkhazia and South Ossetia become puppets."
 SOV_challenge_nato:0 "Challenge NATO"
 SOV_challenge_nato_desc:0 "35 days. Requires a war with Ukraine. War support +5%."
 SOV_antagonize_borders:0 "Antagonize Border States"
