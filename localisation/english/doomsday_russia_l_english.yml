 dd_sov_ukr_6:0 "2028"
 dd_sov_ukr_6_desc:0 "War support -3%. Division attack -3%. Consumer goods +8%."
 dd_sov_ukr_7:0 "2029"
 dd_sov_ukr_7_desc:0 "Stability -4%. War support -4%. Consumer goods +10%."
 dd_sov_ukr_8:0 "2030"
 dd_sov_ukr_8_desc:0 "Stability -5%. Division recovery rate -5%. Consumer goods +12%."
 dd_sov_ukr_9:0 "2031"
 dd_sov_ukr_9_desc:0 "Stability -5%. War support -5%. Division attack -5%. Division defence -5%. Consumer goods +16%."
 dd_sov_ukr_war:0 "The Ukraine War"
 dd_sov_ukr_war_desc:0 "One spirit. Each year adds its effect and the earlier years stay."
 dd_sov_ukr.1.t:0 "Russia Capitulates"
 dd_sov_ukr.1.d:0 "February 2031. Russia capitulates to Ukraine. Ukraine and its allies open a peace conference with the full victory score, against Russia and the CSTO."
 dd_sov_ukr.1.a:0 "Open the peace conference."
 dd_sov_ukr_cap_tt:0 "Ukraine imposes the peace on Russia and the CSTO."

 dd_sov_fuel_status_category:0 "Our Fuel"
 dd_sov_fuel_status_category_desc:0 "Our fires. One stack is one burning fuel site. Ukraine's grid is a separate tab."
 dd_sov_fuel_category:0 "The Fuel"
 dd_sov_fuel_category_desc:0 "Crews, rations, and fuel bought with treasury. Every cash cost is written on the card. The live total is in Our Fuel."
 dd_sov_fuel_status:0 "Our fuel fires  [?dd_sov_fuel|0] / [?dd_sov_fuel_cap|0]"
 dd_sov_fuel_status_desc:0 "Each stack: fuel gain -4%. Army fuel use +3%. Factory output -2%.\n\nNow: fuel gain [?dd_sov_fuel_gain|%]. Army fuel use [?dd_sov_fuel_use|%]. Factory output [?dd_sov_fuel_fac|%].\n\n[GetDdSovFuelClock]"
 dd_sov_fuel_how:0 "How a Stack Is Gained"
 dd_sov_fuel_how_desc:0 "While the war lasts, a strategic bombing of Moscow, Ryazan, Yaroslavl, Rostov, or Leningrad adds 1 stack, if Russia still holds that state. Bombing can add a stack only once every 21 days, or every 42 days after Harden the Depots. The cap starts at 30 and stays at 30. The Shadow Fleet and Reduce Fuel Exports each clear 2 stacks. Peace clears every stack. Patch the Tanks clears 1. Buy Fuel Abroad spends $0.4 billion and clears 2. Open the Reserve clears 3 and cuts stability by 5%. Charter Tankers spends $3 billion, clears 4, and adds 400,000 fuel. Ration the Rear spends no treasury."
 dd_sov_fuel_clock_wait:0 "Bombing can add another stack in [?dd_sov_fuel_cd|0] days."
 dd_sov_fuel_clock_open:0 "A bombed fuel state can add a stack today."
 dd_sov_fuel_patch:0 "Patch the Tanks"
 dd_sov_fuel_patch_desc:0 "Clear one stack and repair the fuel sites at Moscow, Ryazan, and Yaroslavl. Thirty days between patches. No treasury."
 dd_sov_fuel_buy:0 "Buy Fuel Abroad"
 dd_sov_fuel_buy_desc:0 "Spend $0.4 billion. Clear two stacks and repair the fuel sites at Rostov, Leningrad, and Samara. One hundred and twenty days between purchases."
 dd_sov_fuel_buy_cost_tt:0 "Requires $0.4 billion in the treasury."
 dd_sov_fuel_ration:0 "Ration the Rear"
 dd_sov_fuel_ration_desc:0 "For 90 days, consumer goods factories +5% and army fuel use -15%. The fires stay. No treasury."
 dd_sov_fuel_reserve:0 "Open the Reserve"
 dd_sov_fuel_reserve_desc:0 "Clear three stacks. Stability -5%. Seventy days between openings. No treasury."
 dd_sov_fuel_charter:0 "Charter Tankers"
 dd_sov_fuel_charter_desc:0 "Spend $3 billion. Clear four stacks and add 400,000 fuel. The damaged sites stay damaged. One hundred and fifty days between charters."
 dd_sov_fuel_charter_cost_tt:0 "Requires $3 billion in the treasury."
 dd_sov_fuel_harden:0 "Harden the Depots"
 dd_sov_fuel_harden_desc:0 "Spend $5 billion, once. After this, a bombing can add a stack only once every 42 days."
 dd_sov_fuel_harden_cost_tt:0 "Requires $5 billion in the treasury."
 dd_sov_fuel_fires:0 "Fuel Under Fire"
 dd_sov_fuel_fires_desc:0 "Refineries and depots are burning. Each stack is fuel gain -4%, army fuel use +3%, factory output -2%."
 dd_sov_fuel.1.t:0 "The Fuel Is Hit"
 dd_sov_fuel.1.d:0 "Another fuel site is burning. Fires are now [?dd_sov_fuel|0] / [?dd_sov_fuel_cap|0]. Earlier fires are still burning. Each stack is fuel gain -4%, army fuel use +3%, factory output -2%."
 dd_sov_fuel.1.a:0 "Get the crews moving."
 dd_sov_fuel.11.t:0 "A Russian Fuel Site Is Burning"
 dd_sov_fuel.11.d:0 "The strike landed. Russia's fires are now [?RUS.dd_sov_fuel|0] / [?RUS.dd_sov_fuel_cap|0]. Earlier fires are still burning."
 dd_sov_fuel.11.a:0 "Keep the pressure on."
 dd_sov_home_front_category:0 "The Home Front"
 dd_sov_home_front_category_desc:0 "Approach the Rosgvardia needs 30% fascist support. Ignite the Revolution needs 30% communist support."
 dd_sov_revolution_category:0 "Ignite the Revolution"
 dd_sov_revolution_category_desc:0 "Start the Soviet revolt at any time. The army, navy, and air that defect equal current communist support. Twenty-six militia divisions join them as well."
 DD_SOV_ANGER_LEFT_TITLE:0 "Left Wing Anger"
 DD_SOV_ANGER_LEFT_BODY:0 "The economic strain of the war raises radical left support. Once consumer goods from the war pass 30%, that burden raises communist support directly."
 DD_SOV_ANGER_LEFT_PCT:0 "§R[?party_popularity@communism|0%]§! communist"
 DD_SOV_ANGER_RIGHT_TITLE:0 "Right Wing Anger"
 DD_SOV_ANGER_RIGHT_BODY:0 "Military failure raises radical right support. Each year the war stalls adds 3%. Each core lost adds 5%. Each lost battle adds 0.01%."
 DD_SOV_ANGER_RIGHT_PCT:0 "§Y[?party_popularity@fascism|0%]§! fascist"
 dd_sov_approach_rosgvardia:0 "Approach the Rosgvardia"
 dd_sov_approach_rosgvardia_desc:0 "Requires 30% fascist support. The Rosgvardia takes the state and the ruling party becomes fascism."
 dd_sov_rosgvardia_tt:0 "Requires 30% fascist support."
 dd_sov_ignite_revolution:0 "Ignite the Revolution"
 dd_sov_ignite_revolution_desc:0 "Requires 30% communist support. We take command of the Soviet revolt. Communist support is [?party_popularity@communism|0%]. That share of the army, navy, and air defects. Twenty-six militia divisions appear across the major cities that join them. If Russia is at war with Ukraine, the Soviets are too."
 dd_sov_ignite_now:0 "Ignite the Revolution"
 dd_sov_ignite_now_desc:0 "Requires 30% communist support. We take command of the Soviet revolt. Communist support is [?party_popularity@communism|0%]. That share of the army, navy, and air defects. Twenty-six militia divisions appear across the major cities that join them. If Russia is at war with Ukraine, the Soviets are too."
 dd_sov_play_red_tt:0 "We take command of the Soviet revolt. The Kremlin keeps the rest of the country and is at war with us."
 dd_sov_revolution_tt:0 "Requires 30% communist support."
 dd_sov_revolution_capital_tt:0 "Requires control of Moscow, Leningrad, or Stalingrad."
 dd_sov_revolution_army_tt:0 "A share of the army, navy, and air equal to communist support ([?party_popularity@communism|0%]) joins the revolt, in addition to twenty-six militia divisions."
 SOV_SOVIETS:0 "Soviet Russia"
 SOV_revolt:0 "Soviet Union"
 SOV_revolt_DEF:0 "the Soviet Union"
 dd_sov_ukr.2.t:0 "The Cash Cushion Dwindles"
 dd_sov_ukr.2.d:0 "The reserves that carried the war are running out. The public will accept a culprit. Either choice adds 4% to that wing."
 dd_sov_ukr.2.a:0 "Blame the western cosmopolitans and the export oligarchs"
 dd_sov_ukr.2.b:0 "Blame the ultra wealthy and the monopolies"
 dd_sov_ukr.3.t:0 "The Static Frontline"
 dd_sov_ukr.3.d:0 "The line has not moved. Claimed ground in Ukraine is still outside our control. Either choice adds 4% to that wing."
 dd_sov_ukr.3.a:0 "Blame a cowardly military fighting a polite war"
 dd_sov_ukr.3.b:0 "Blame privatization and the capitalist contradictions in the military industry"
 dd_sov_csto_category_desc:0 "One card per independent member of our faction. Open the Market, deepen it, then make them a Dominion."
 dd_sov_their_grid_category:0 "Ukraine's Grid"
 dd_sov_their_grid_category_desc:0 "Ukraine's blackouts. Bomb Kiev, Kharkov, Odessa, Mykolaiv, or Chernigov."
 dd_sov_their_grid_status:0 "Ukraine's blackout  [?dd_seen_ukr_blackout|0] / [?dd_seen_ukr_cap|0]"
 dd_sov_their_grid_status_desc:0 "Bomb these Ukrainian states: Kiev, Kharkov, Odessa, Mykolaiv, Chernigov. One strategic bombing of a state they still hold adds 1 blackout, once every 21 days.\n\nEach of their stacks: factory output -4%. Stability -2%. Construction speed -3%. Consumer goods +2%.\n\nNow: factory output [?dd_seen_ukr_fac|%]. Stability [?dd_seen_ukr_stab|%]. Construction [?dd_seen_ukr_con|%]. Consumer goods [?dd_seen_ukr_cg|%]."
 dd_sov_their_grid_how:0 "States That Feed Ukraine's Grid"
 dd_sov_their_grid_how_desc:0 "Strategic bomb Kiev, Kharkov, Odessa, Mykolaiv, or Chernigov. The stack is added only while Ukraine controls that state."
