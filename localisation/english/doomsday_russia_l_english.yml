 SOV_peoples_international_tt:0 "Leave the CSTO, then found the People's International. Every communist country not at war with us gains +50 opinion."
 SOV_warsaw_pact:0 "Restore the Warsaw Pact"
 SOV_warsaw_pact_desc:0 "70 days. Annex war goals on Poland, East Germany, Czechoslovakia, Slovakia, Hungary, Romania, and Bulgaria. Opens a decision to invite any communist country that is outside a faction."
 SOV_warsaw_pact_tt:0 "Annex war goals on Poland, East Germany, Czechoslovakia, Slovakia, Hungary, Romania, and Bulgaria, when they exist and are not already with us. A decision can invite any communist country outside a faction."
