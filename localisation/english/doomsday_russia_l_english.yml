 dd_sov_fuel_status_category:0 "Fuel Status"
 dd_sov_fuel_status_category_desc:0 "One stack is one burning fuel site. The cards below are the live total and the rules. They are not buttons."
 dd_sov_fuel_category:0 "The Fuel"
 dd_sov_fuel_category_desc:0 "Patch crews and fuel bought abroad. The live total is in Fuel Status, above this list."
 dd_sov_fuel_status:0 "Fuel fires  [?dd_sov_fuel|0] / [?dd_sov_fuel_cap|0]"
 dd_sov_fuel_status_desc:0 "Each stack: fuel gain -4%. Army fuel use +3%. Factory output -2%.\n\nNow: fuel gain [?dd_sov_fuel_gain|%]. Army fuel use [?dd_sov_fuel_use|%]. Factory output [?dd_sov_fuel_fac|%].\n\n[GetDdSovFuelClock]"
 dd_sov_fuel_how:0 "How a Stack Is Gained"
 dd_sov_fuel_how_desc:0 "While the war lasts, a strategic bombing of Moscow, Ryazan, Yaroslavl, Rostov, or Leningrad adds 1 stack, if Russia still holds that state. Bombing can add a stack only once every 21 days. The cap is 20. Peace clears every stack. Patch the Tanks clears 1. Buy Fuel Abroad clears 2."
 dd_sov_fuel_clock_wait:0 "Bombing can add another stack in [?dd_sov_fuel_cd|0] days."
 dd_sov_fuel_clock_open:0 "A bombed fuel state can add a stack today."
 dd_sov_fuel_patch:0 "Patch the Tanks"
 dd_sov_fuel_patch_desc:0 "Clear one stack and repair the fuel sites at Moscow, Ryazan, and Yaroslavl. Thirty days between patches."
 dd_sov_fuel_buy:0 "Buy Fuel Abroad"
 dd_sov_fuel_buy_desc:0 "Spend treasury, clear two stacks, and repair the fuel sites at Rostov, Leningrad, and Samara. One hundred and twenty days between purchases."
 dd_sov_fuel_fires:0 "Fuel Under Fire"
 dd_sov_fuel_fires_desc:0 "Refineries and depots are burning. Each stack is fuel gain -4%, army fuel use +3%, factory output -2%."
 dd_sov_fuel.1.t:0 "The Fuel Is Hit"
 dd_sov_fuel.1.d:0 "A fuel state is burning. The army drinks more, the refineries give less, and the factories slow. The stacks last until the crews catch up, or until the war stops."
 dd_sov_fuel.1.a:0 "Get the crews moving."
