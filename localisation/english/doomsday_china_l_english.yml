 dd_chi_paranoia_value_text:0 "£SOV_paranoia_text_icon  Political Paranoia: [CHIGetParanoiaColor][?dd_chi_paranoia|0]%§! [CHIGetParanoiaGain]"
 dd_chi_para_gain_open:0 "(Monthly gain: §R4%§!)"
