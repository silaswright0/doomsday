 dd_chi_rev_category:0 "Prepare the Revolution"
 dd_chi_rev_category_desc:0 "Pick a Chinese state and spend 2000 guns. Sixty days later, Raise the Cells opens in this list. Two irregular divisions appear in that state. If an enemy holds it, they spawn there and attack. Each state can be used once."
 dd_chi_rev_prepare:0 "Prepare the Ground"
 dd_chi_rev_prepare_desc:0 "Spend 2000 guns. The state is marked. Raise the Cells opens after 60 days."
 dd_chi_rev_rise:0 "Raise the Cells in [From.GetName]"
 dd_chi_rev_rise_desc:0 "Two irregular divisions appear in [From.GetName]. If an enemy holds it, they spawn there and attack."
 dd_chi_rev_wait_ready_tt:0 "60 days have passed since this state was prepared."
 dd_chi_cw_category:0 "The Break"
 dd_chi_cw_category_desc:0 "Start the civil war without waiting for a lost war in Taiwan."
 dd_chi_manual_civil_war:0 "Force the Break"
 dd_chi_manual_civil_war_desc:0 "The south, the centre, Sichuan, and Xinjiang leave Beijing, and every side is at war with every other side. The party keeps the north, Manchuria, Jiangxi, Zunyi, Yunnan, Dali, and Tibet. This does not wait on confidence, the three strains, or Taiwan."
 dd_chi_strait_category:0 "The Strait"
 dd_chi_strait_category_desc:0 "The first war across the strait runs for 180 days, then stops."
 dd_chi_taiwan_countdown:0 "Strait Ceasefire"
 dd_chi_taiwan_countdown_desc:0 "When this runs out, China and Taiwan make peace. Land taken in the war goes back. A later war has no clock."
 dd_chi_tw.1.t:0 "The Strait Is on a Clock"
 dd_chi_tw.1.d:0 "This is the first war between Beijing and Taipei. It lasts 180 days. When the clock runs out, both sides stand down and occupied land goes back to its owner. A war that ends sooner, by capitulation, is not put back."
 dd_chi_tw.1.a:0 "One hundred and eighty days."
 dd_chi_tw.2.t:0 "The Strait Goes Quiet"
 dd_chi_tw.2.d:0 "The 180 days are up. The war is over. What was occupied goes back to the owner it had when the fighting started. Beijing does not hold Taiwan."
 dd_chi_tw.2.a:0 "The guns stop."
