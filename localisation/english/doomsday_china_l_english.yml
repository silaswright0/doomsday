 dd_chi_para_gain_halted:0 "(Monthly gain: §G0%§!)"
 dd_chi_color_red:0 "§R"
 dd_chi_color_yellow:0 "§Y"
 dd_chi_color_green:0 "§G"
 dd_chi_paranoia_text_tt:0 "Starts at 50. Climbs by 4 a month, by 1 after the centre has been brought to heel, or by 0 after Affirm State Supremacy.\n\nPolitical power gain: [?dd_chi_para_pp|+.2]\nStability: [?dd_chi_para_stab|%]\nFactory output: [?dd_chi_para_fac|%]\nArmy organization: [?dd_chi_para_org|%]\n\nAt 100 the security organs seize the capital. Stability -10%. War support -5%. Political power -75. The number is cut to 50. That takeover blocks the civil war."
 dd_chi_confidence_hover_tt:0 "Starts at 100. Full confidence has no penalty. Each purge cuts confidence by 25. Each New Year restores +10, up to the cap.\n\nPlanning speed: [?dd_chi_conf_plan|%]\nArmy attack: [?dd_chi_conf_atk|%]\nOrganization: [?dd_chi_conf_org|%]\nRecovery: [?dd_chi_conf_mor|%]\nCommand power gain: [?dd_chi_conf_cp|+.2]\nArmy experience gain: [?dd_chi_conf_xp|%]\n\nConfidence below 30, with the three economic crises still open and a failure in Taiwan, makes the regime §RVULNERABLE§!. The security takeover blocks that collapse."
