 dd_chi_enforce_loyalty:0 "Enforce Loyalty to the Party"
 dd_chi_enforce_loyalty_desc:0 "Paranoia -10. Confidence -5. Can be used again after 180 days. Available after Purge the Rocket Force."
 dd_chi_purge_leader:0 "Purge a Leader"
 dd_chi_purge_leader_desc:0 "Takes the next hired advisor, high command officer, service chief, field marshal, or general, and removes them. The popup uses that persons name. Paranoia -40. Confidence -10. Can be used again after 60 days. Available after Purge the Rocket Force."
 dd_chi_cw.1.t:0 "The Regime Breaks"
 dd_chi_cw.1.d:0 "The party still sits in Beijing, but the country has stopped listening. A lost war across the strait, empty confidence in the ranks, and years of unpaid bills have turned a closed system into open revolt. What follows is not one rebellion. It is five claims on China, and two warlords who will not wait for anyone else's permission.\n\nThe Beijing Government means to hold the centre by force of habit: the party, the north, and Manchuria, and a restoration that looks like the old order with the lights still on.\n\nThe Federal Republic wants a coastal charter. Market conservatism with room for liberals, a China that trades, votes in provinces, and no longer answers to a single office in the capital.\n\nNew Left China wants the factories and the streets. Progressive populism from Wuhan and Changsha: wages first, party privilege last, and a republic that answers to labour instead of lineage.\n\nThe Shanghai Business Council wants the ledger to outrank the flag. Sovereign democracy for the export coast: keep the ports open, keep the money moving, and keep politics quiet enough to do business.\n\nThe Chinese Guard wants order without the old faces. A military junta that treats the centre as a barracks, and every other claim as a mutiny to put down.\n\nChengdu and Xinjiang break away as warlords. They fight everyone. They are not a choice."
 dd_chi_cw.1.a:0 "Hold Beijing for the party."
 dd_chi_cw.1.frc:0 "Raise the Federal Republic."
 dd_chi_cw.1.nlc:0 "Stand with the New Left."
 dd_chi_cw.1.sbc:0 "Take the Business Council."
 dd_chi_cw.1.cmj:0 "Join the Chinese Guard."
