 dd_chi_confidence_tt:0 "[CHIGetConfidenceTip]"
 dd_chi_confidence_tt_full:0 "The officer corps trusts the leadership to leave command to soldiers. Full confidence carries no penalty. A purge cuts confidence by 25."
 dd_chi_confidence_tt_low:0 "The officer corps is hesitating. Planning speed [?dd_chi_conf_plan|%]. Army attack [?dd_chi_conf_atk|%]. Organization [?dd_chi_conf_org|%]. Recovery [?dd_chi_conf_mor|%]. Command power gain [?dd_chi_conf_cp|+.2]. Army experience gain [?dd_chi_conf_xp|%]. A purge cuts confidence by 25."
