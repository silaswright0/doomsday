 dd_chi_rocket.1.t:0 "The Rocket Force File"
 dd_chi_rocket.1.d:0 "The books of the Rocket Force do not match the missiles in the silos. The unnamed officers under Wang Houbin are taken. Paranoia -10. The commander himself is still in his post."
 dd_chi_rocket.1.a:0 "The ranks are cleared."
 dd_chi_rocket.2.t:0 "Wang Houbin"
 dd_chi_rocket.2.d:0 "Wang Houbin still commands the Rocket Force. A purge retires him. Leaving him in command keeps the officer, and the suspicion spreads."
 dd_chi_rocket.2.a:0 "Retire Wang Houbin."
 dd_chi_rocket.2.b:0 "Leave him in command."
 dd_chi_rocket.3.t:0 "The Commander Is Purged"
 dd_chi_rocket.3.d:0 "Wang Houbin is retired. Stability -3%. Army experience +20. Paranoia -20. Confidence -20. The officer corps has started to watch what it says."
 dd_chi_rocket.3.a:0 "The next name."
 dd_chi_rocket.4.t:0 "The Commander Stays"
 dd_chi_rocket.4.d:0 "Wang Houbin keeps the Rocket Force. The party reads that as protection. Paranoia +20. Confidence +20."
