l_english:
 TIG_REVOLT:0 "Tigray"
 TIG_REVOLT_DEF:0 "Tigray"
 TIG_REVOLT_ADJ:0 "Tigrayan"
 DD_FACTION_RED_SEA:0 "Red Sea Compact"

 dd_ethiopia.1.t:0 "Shererina"
 dd_ethiopia.1.d:0 "On 1 August 2026 fighting opened in western Tigray, near Shererina on the Sudan border. Addis and Debretsion Gebremichael's TPLF each say the other fired first. The November 2022 peace is broken. The Oromo Liberation Army, the militia that fought beside the Tigray Defense Forces in 2021, is putting brigades in the field with them. The Amhara Fano militia is not part of this."
 dd_ethiopia.1.a:0 "The TDF is in the field"
 dd_ethiopia.1.tt:0 "Tigray rises under Debretsion Gebremichael. Two Oromo Liberation Army brigades join that army. Fano does not."
 dd_ethiopia.1.tt2:0 "Tigray gets its own focus tree. It does not keep Ethiopia's."

 dd_tdf_and_ola:0 "TDF and the OLA"
 dd_tdf_and_ola_desc:0 "The Tigray Defense Forces and the Oromo Liberation Army are in the same field army. Attack and defense +10%. War support +10%."
 dd_eth_hold_addis:0 "Hold Addis"
 dd_eth_hold_addis_desc:0 "The federation fights the rising in Tigray. Core defense +10%. War support +5%."
 dd_uae_rsf_arms:0 "Emirati Arms"
 dd_uae_rsf_arms_desc:0 "Abu Dhabi's pipeline to the Rapid Support Forces. Attack +10%. Breakthrough +5%."
 dd_rsf_uae_support:0 "Emirati Support"
 dd_rsf_uae_support_desc:0 "Gold, guns, and drones from Abu Dhabi. Attack +5%."
 dd_sud_egypt_support:0 "Egyptian Support"
 dd_sud_egypt_support_desc:0 "Cairo backs the Sudanese army. Defense +5%."
 dd_uae_khartoum_pressure:0 "Emirati Pressure"
 dd_uae_khartoum_pressure_desc:0 "Gold, guns, and diplomacy are pointed at the Rapid Support Forces, not at the government in Khartoum. Consumer goods +5%. War support -5%."

 ETH_face_mekelle:0 "Face Mekelle"
 ETH_face_mekelle_desc:0 "The TDF never handed in its weapons. Debretsion's TPLF holds the region. Next: oppose them and march north, or prop them up and take their side."
 ETH_hold_the_federation:0 "Hold the Federation"
 ETH_hold_the_federation_desc:0 "Abiy Ahmed keeps the center. This is not a communist path. The Prosperity Party has no such tradition."
 ETH_the_other_war:0 "Fano Is a Different War"
 ETH_the_other_war_desc:0 "The Amhara Fano militia is fighting the federal government on its own. It does not join Tigray. Western Tigray is still the dispute between them."
 ETH_federal_offensive:0 "Federal Offensive"
 ETH_federal_offensive_desc:0 "The army goes north to put the TDF back under the Pretoria terms."
 ETH_addis_holds:0 "Addis Holds"
 ETH_addis_holds_desc:0 "Fano and the Oromo bush war have each been settled, one way or the other. Fragile Peace and Hold Addis come off. Spirit: The Federation Stands. Stability +10%. +75 political power."
 ETH_across_the_mereb:0 "Across the Mereb"
 ETH_across_the_mereb_desc:0 "A wargoal on Eritrea. It opens once the federation is at war with Tigray, or once that rising has been destroyed."
 ETH_the_sudan_road:0 "The Sudan Road"
 ETH_the_sudan_road_desc:0 "A wargoal on Sudan. It opens once the Eritrea war is underway, or once Eritrea has been beaten."
 dd_eth_tigray_open_tt:0 "At war with Tigray, or the Tigray rising has been destroyed."
 dd_eth_tigray_beaten_tt:0 "The Tigray rising has been destroyed."
 ETH_lift_fragile_peace:0 "Lift the Fragile Peace"
 ETH_lift_fragile_peace_desc:0 "Opens once Tigray has been beaten. Fragile Peace comes off. Stability +5%. +50 political power."
 dd_eth_eritrea_open_tt:0 "At war with Eritrea, or Eritrea has been beaten."
 ETH_tplf_cadre:0 "The TPLF Cadre"
 ETH_tplf_cadre_desc:0 "Only the Tigray side. The party that took Mekelle back is the old TPLF."
 ETH_ola_beside_them:0 "The OLA Beside Them"
 ETH_ola_beside_them_desc:0 "The Oromo Liberation Army stays in the field with the TDF, as it did in 2021."
 ETH_marxist_line:0 "The Marxist Line"
 ETH_marxist_line_desc:0 "The TPLF was built as a Marxist-Leninist party. Debretsion's wing puts that party over the state. Communism becomes the government."

 UAE_red_sea_portfolio:0 "The Red Sea Portfolio"
 UAE_red_sea_portfolio_desc:0 "Abu Dhabi opens a bloc for the clients and the governments it can still buy. Mohamed bin Zayed leads it."
 UAE_arm_the_rsf:0 "Arm the Rapid Support Forces"
 UAE_arm_the_rsf_desc:0 "The real war Abu Dhabi is already in. Mohamed Hamdan Dagalo's forces get weapons. Neither they nor Khartoum enter the compact while they are still fighting each other."
 UAE_southern_council:0 "The Southern Council"
 UAE_southern_council_desc:0 "Access for the Southern Transitional Council. The seat in the compact waits until they are at peace."
 UAE_pressure_khartoum:0 "Pressure Khartoum"
 UAE_pressure_khartoum_desc:0 "Abdel Fattah al-Burhan's government is not a client. The pressure hits Sudan while the Rapid Support Forces keep the guns."
 UAE_the_compact:0 "Close the Compact"
 UAE_the_compact_desc:0 "Bring in the Rapid Support Forces once the Sudan war is over, the Southern Council once it is at peace, and Somaliland once it still holds and is at peace. Sudan and Eritrea stay out."
 UAE_berbera:0 "Berbera"
 UAE_berbera_desc:0 "The port deal with Abdirahman Mohamed Abdullahi. Access, not a seat yet."
 UAE_somaliland_seat:0 "Somaliland's Seat"
 UAE_somaliland_seat_desc:0 "Somaliland enters the compact once it still holds its land and is at peace."
 UAE_stc_seat:0 "The South at Peace"
 UAE_stc_seat_desc:0 "The Southern Council enters the compact only once it is at peace."
 UAE_sudan_seat:0 "After the Sudan War"
 UAE_sudan_seat_desc:0 "The Rapid Support Forces enter once they are no longer fighting Khartoum. Sudan does not."

 DD_FACTION_LEVANT:0 "Levant Pact"
 dd_levant_shock_tt:0 "Locked until Israel holds Lebanon proper or a Syrian state, or Iran has split Iraq."
 dd_stc_at_peace_tt:0 "The Southern Council is at peace."
 dd_sml_held_tt:0 "Somaliland still holds its own land and is at peace."
 dd_sudan_war_over_tt:0 "The war between Sudan and the Rapid Support Forces is over."
 dd_levant_opinion:0 "Levant Partner"

 UAE_levant_file:0 "The Levant File"
 UAE_levant_file_desc:0 "A diplomacy file for Ankara, Riyadh, and Islamabad. The guarantees stay shut until Israel has taken Lebanon proper or Syrian land, or Iran has split Iraq."
 UAE_tie_ankara:0 "Ankara"
 UAE_tie_ankara_desc:0 "Military access with Turkey. Turkey and the Emirates guarantee each other. Turkey stays in its current faction."
 UAE_tie_riyadh:0 "Riyadh"
 UAE_tie_riyadh_desc:0 "Military access with Saudi Arabia. Saudi Arabia and the Emirates guarantee each other."
 UAE_tie_islamabad:0 "Islamabad"
 UAE_tie_islamabad_desc:0 "Military access with Pakistan. Pakistan and the Emirates guarantee each other."

 TUR_diplomacy:0 "The Diplomacy File"
 TUR_diplomacy_desc:0 "The diplomacy section. The rest of Turkey's tree comes later. Ankara guarantees the others once the Levant breaks. It does not form a faction."
 TUR_abu_dhabi:0 "Abu Dhabi"
 TUR_abu_dhabi_desc:0 "Military access with Mohamed bin Zayed."
 TUR_riyadh:0 "Riyadh"
 TUR_riyadh_desc:0 "Military access with Mohammed bin Salman."
 TUR_islamabad:0 "Islamabad"
 TUR_islamabad_desc:0 "Military access with Shehbaz Sharif."
 TUR_the_pact:0 "Mutual Guarantees"
 TUR_the_pact_desc:0 "Guarantee the Emirates, Saudi Arabia, and Pakistan. They guarantee Turkey back. No faction is formed."

 SAU_diplomacy:0 "The Diplomacy File"
 SAU_diplomacy_desc:0 "The diplomacy section. The rest of Saudi Arabia's tree comes later. Riyadh guarantees the others once the Levant breaks. It does not form a faction."
 SAU_abu_dhabi:0 "Abu Dhabi"
 SAU_abu_dhabi_desc:0 "Military access with Mohamed bin Zayed."
 SAU_ankara:0 "Ankara"
 SAU_ankara_desc:0 "Military access with Recep Tayyip Erdogan."
 SAU_islamabad:0 "Islamabad"
 SAU_islamabad_desc:0 "Military access with Shehbaz Sharif."
 SAU_the_pact:0 "Mutual Guarantees"
 SAU_the_pact_desc:0 "Guarantee the Emirates, Turkey, and Pakistan. They guarantee Saudi Arabia back. No faction is formed."

 PAK_diplomacy:0 "The Diplomacy File"
 PAK_diplomacy_desc:0 "The diplomacy section. The rest of Pakistan's tree comes later. Islamabad guarantees the others once the Levant breaks. It does not form a faction."
 PAK_abu_dhabi:0 "Abu Dhabi"
 PAK_abu_dhabi_desc:0 "Military access with Mohamed bin Zayed."
 PAK_ankara:0 "Ankara"
 PAK_ankara_desc:0 "Military access with Recep Tayyip Erdogan."
 PAK_riyadh:0 "Riyadh"
 PAK_riyadh_desc:0 "Military access with Mohammed bin Salman."
 PAK_the_pact:0 "Mutual Guarantees"
 PAK_the_pact_desc:0 "Guarantee the Emirates, Turkey, and Saudi Arabia. They guarantee Pakistan back. No faction is formed."

 dd_eth_rising_tt:0 "The Tigray rising has begun."

 ETH_prosperity:0 "The Prosperity Party"
 ETH_prosperity_desc:0 "Abiy Ahmed keeps the center. Medemer stays the line: one party, one army, and the regions answer Addis."
 ETH_amhara_bargain:0 "The Amhara Bargain"
 ETH_amhara_bargain_desc:0 "Gondar and Gojjam set the terms. Western Tigray stays Amhara. The Oromo militia is not offered talks. National populism +10%."
 ETH_the_regions:0 "The Regions"
 ETH_the_regions_desc:0 "The kilils come back into the bargain. Left-wing nationalism +8%. Social democracy +5%. This path does not hand Western Tigray to Amhara."
 ETH_call_the_endf:0 "Call the ENDF"
 ETH_call_the_endf_desc:0 "The federal army is rebuilt around the wars it is already in. Spirit: The ENDF. Attack +10%. Defense +5%. +20 army experience. +25 command power."
 ETH_the_rising:0 "The Rising"
 ETH_the_rising_desc:0 "Opens once fighting has started in Tigray. Spirit: Hold Addis. Core defense +10%. War support +10%."
 ETH_gondar_standard:0 "The Gondar Standard"
 ETH_gondar_standard_desc:0 "Abiy Ahmed takes the Amhara line. National populism becomes the government. Spirit: The Gondar Standard. Attack +5%. War support +10%. Stability -5%."
 ETH_restore_the_kilil:0 "Restore the Kilils"
 ETH_restore_the_kilil_desc:0 "Regional government is the offer, not a unitary party. Spirit: The Kilils. Stability +10%. Daily political power +0.15. Recruitable population -0.5%."
 ETH_west_for_gondar:0 "The West Stays Amhara"
 ETH_west_for_gondar_desc:0 "Welkait and the west stay with Amhara. Closed on the regions path. Fano quiets. Spirit: Western Tigray. Stability +5%. War support +5%."
 ETH_west_for_mekelle:0 "The West Returns"
 ETH_west_for_mekelle_desc:0 "Western Tigray is Tigray's. Closed on the Amhara path. Fano treats it as a betrayal. Spirit: Fano in the Field, and it is worse than the militia war already underway."
 ETH_shene_offensive:0 "Break the OLA"
 ETH_shene_offensive_desc:0 "The Oromo Liberation Army is hunted in Welega and the south. The bush penalty comes off. Spirit: Oromia Security. Attack +5%. Resistance target -5%."
 ETH_shene_talks:0 "Talks in Oromia"
 ETH_shene_talks_desc:0 "A limited amnesty. Closed on the Amhara path. The bush penalty comes off. Stability +5%. War support -5%. Left-wing nationalism +5%."
 ETH_fold_fano_in:0 "Fold Fano into the Army"
 ETH_fold_fano_in_desc:0 "The militia that took the west is brought into the federal army. +20,000 manpower. National populism +5%. War support +5%."
 ETH_break_fano:0 "Break Fano"
 ETH_break_fano_desc:0 "The campaign in Amhara. Fano in the Field comes off. Stability +10%. +15 army experience."
 ETH_militia_into_the_endf:0 "The Militia into the ENDF"
 ETH_militia_into_the_endf_desc:0 "The Amhara path only, after the west is conceded. +25,000 manpower. War support +5%. +10 army experience."
 ETH_oromo_wing:0 "The Oromo Wing"
 ETH_oromo_wing_desc:0 "After the kilils are restored and the Oromia talks are done. Stability +5%. +50 political power. Left-wing nationalism +8%."
 ETH_somali_region:0 "The Somali Region"
 ETH_somali_region_desc:0 "Jigjiga is kept in the federation by a political deal, not another front. +25 political power. Stability +3%. Opinion with Somalia."
 ETH_djibouti_dues:0 "Pay Djibouti"
 ETH_djibouti_dues_desc:0 "The corridor stays the port. -50 political power. Spirit: The Djibouti Corridor. Consumer goods +3%. Infrastructure construction +10%. Closes Berbera. The march on Eritrea stays open."
 ETH_recognize_hargeisa:0 "Recognize Hargeisa"
 ETH_recognize_hargeisa_desc:0 "The Berbera access becomes a base. Somalia objects. Spirit: Berbera Base. Dockyard output +10%. Fleet range +25%. +15 navy experience. Closes Djibouti. The march on Eritrea stays open."
 ETH_assab_road:0 "March on Eritrea"
 ETH_assab_road_desc:0 "The second step of the war. A wargoal on Eritrea for Assab. It opens once the federation is at war with Tigray, or once that rising has been destroyed. Spirit: To the Sea. War support +5%. Planning speed +10%."
 ETH_ankara_line:0 "The Ankara Line"
 ETH_ankara_line_desc:0 "Turkey already sells the air force its drones. +20 air experience. 8 fighters. Opinion with Ankara."
 ETH_gerd:0 "The Grand Ethiopian Renaissance Dam"
 ETH_gerd_desc:0 "The dam on the Blue Nile is full enough to bargain with, or to keep. +25 political power. Stability +3%."
 ETH_the_fill:0 "Fill the Dam"
 ETH_the_fill_desc:0 "Cairo does not get a veto. Spirit: The Dam Is Full. Factory output +10%. Construction speed +5%. Opinion with Egypt falls."
 ETH_power_for_cairo:0 "Power for Cairo"
 ETH_power_for_cairo_desc:0 "Electricity down the Nile in exchange for a quieter Egypt. Spirit: Nile Power. Factory output +5%. Trade opinion +10%."
 ETH_al_fashaga:0 "March on Sudan"
 ETH_al_fashaga_desc:0 "The third step of the war. A claim on Kassala and a wargoal on Sudan. It opens once the Eritrea war is underway, or once Eritrea has been beaten."
 ETH_border_camps:0 "The Border Camps"
 ETH_border_camps_desc:0 "The Sudan war pushes people across the frontier. Stability -3% now. +30,000 manpower. Spirit: Border Camps. Stability -5%. Monthly population +3%."
 ETH_imf_program:0 "The IMF Program"
 ETH_imf_program_desc:0 "The 2024 program, taken further. Spirit: The Program. Consumer goods +5%. Stability +5%. Daily political power +0.10. +75 political power. Closes the industrial parks."
 ETH_industrial_parks:0 "The Industrial Parks"
 ETH_industrial_parks_desc:0 "Hawassa and the Addis parks over the Fund. Spirit: The Parks. Factory output +10%. Civilian factory construction +15%. One civilian factory in Shewa if Addis is held. Closes the IMF program."
 ETH_wheat_push:0 "The Wheat Push"
 ETH_wheat_push_desc:0 "Spirit: Wheat. Monthly population +2%. Stability +3%."
 ETH_one_army:0 "One Army"
 ETH_one_army_desc:0 "After Addis has settled the internal wars. +30 army experience. Spirit: One Army. Organization +5%. Attack +5%. Training time -10%."

 dd_eth_fano:0 "Fano"
 dd_eth_fano_desc:0 "The Amhara militia is fighting the federal government on its own. It does not join Tigray. Stability -10%. Defense -5%. Resistance target +5%."
 dd_eth_fano_rage:0 "Fano in the Field"
 dd_eth_fano_rage_desc:0 "Western Tigray was promised back to Mekelle. Fano is now a war, not a militia problem. Stability -15%. Organization -5%. War support -5%."
 dd_eth_ola:0 "The Oromo Bush"
 dd_eth_ola_desc:0 "The Oromo Liberation Army is already in Welega and the south. Stability -10%. Daily political power -0.10. Resistance target +10%."
 dd_eth_endf:0 "The ENDF"
 dd_eth_endf_desc:0 "The federal army, called back to the wars it already has. Attack +10%. Defense +5%."
 dd_eth_amhara_standard:0 "The Gondar Standard"
 dd_eth_amhara_standard_desc:0 "Amhara demands are government policy. Attack +5%. War support +10%. Stability -5%."
 dd_eth_amhara_west:0 "Western Tigray"
 dd_eth_amhara_west_desc:0 "Welkait stays with Amhara. Fano has a reason to stop. Stability +5%. War support +5%."
 dd_eth_kilil:0 "The Kilils"
 dd_eth_kilil_desc:0 "The regions are back in the bargain. Stability +10%. Daily political power +0.15. Recruitable population -0.5%."
 dd_eth_oromia_security:0 "Oromia Security"
 dd_eth_oromia_security_desc:0 "The offensive against the Oromo Liberation Army. Attack +5%. Resistance target -5%."
 dd_eth_djibouti_corridor:0 "The Djibouti Corridor"
 dd_eth_djibouti_corridor_desc:0 "The port is paid for. Consumer goods +3%. Infrastructure construction +10%."
 dd_eth_berbera_base:0 "Berbera Base"
 dd_eth_berbera_base_desc:0 "A naval foothold in Somaliland. Dockyard output +10%. Fleet range +25%."
 dd_eth_to_the_sea:0 "To the Sea"
 dd_eth_to_the_sea_desc:0 "Assab is the port Ethiopia means to take. War support +5%. Planning speed +10%."
 dd_eth_gerd_full:0 "The Dam Is Full"
 dd_eth_gerd_full_desc:0 "The Blue Nile is held in Ethiopia. Factory output +10%. Construction speed +5%."
 dd_eth_gerd_export:0 "Nile Power"
 dd_eth_gerd_export_desc:0 "Electricity sold downriver. Factory output +5%. Trade opinion +10%."
 dd_eth_imf:0 "The Program"
 dd_eth_imf_desc:0 "The Fund's terms. Consumer goods +5%. Stability +5%. Daily political power +0.10."
 dd_eth_parks:0 "The Parks"
 dd_eth_parks_desc:0 "Export sheds and assembly lines. Factory output +10%. Civilian factory construction +15%."
 dd_eth_wheat:0 "Wheat"
 dd_eth_wheat_desc:0 "A push to feed the country and sell the surplus. Monthly population +2%. Stability +3%."
 dd_eth_border_camps:0 "Border Camps"
 dd_eth_border_camps_desc:0 "Refugees from the Sudan war. Stability -5%. Monthly population +3%."
 dd_eth_federation_stands:0 "The Federation Stands"
 dd_eth_federation_stands_desc:0 "Addis has a settlement with Fano and with Oromia. Stability +10%. Daily political power +0.10."
 dd_eth_one_army:0 "One Army"
 dd_eth_one_army_desc:0 "The militia wars are over and the ENDF is one force. Organization +5%. Attack +5%. Training time -10%."

 dd_eth_djibouti_opinion:0 "Djibouti Corridor"
 dd_eth_berbera_opinion:0 "Berbera Partner"
 dd_eth_somaliland_anger:0 "Somaliland Recognition"
 dd_eth_somali_region_opinion:0 "Somali Region"
 dd_eth_nile_anger:0 "The Dam"
 dd_eth_nile_deal:0 "Nile Power"
 dd_eth_ankara_opinion:0 "Ankara Line"

 TIG_NORTH:0 "Republic of Tigray"
 TIG_NORTH_DEF:0 "the Republic of Tigray"
 TIG_NORTH_ADJ:0 "Tigrayan"
 TIG_ADDIS:0 "Ethiopian Federation"
 TIG_ADDIS_DEF:0 "the Ethiopian Federation"
 TIG_ADDIS_ADJ:0 "Ethiopian"

 TIG_hold_mekelle:0 "Hold Mekelle"
 TIG_hold_mekelle_desc:0 "Debretsion Gebremichael's TPLF is back in the regional capital. The TDF did not disarm. +50 political power. War support +10%."
 TIG_the_cadre:0 "The Cadre"
 TIG_the_cadre_desc:0 "The party sits above the generals. Spirit: The Cadre. Daily political power +0.15. Ideology drift defense +25%. Organization -5%. Communism +15%."
 TIG_the_generals:0 "The Generals"
 TIG_the_generals_desc:0 "The TDF command runs the war and the party waits. Spirit: The Generals. Attack +10%. Organization +5%. Command power gain +0.15. Daily political power -0.10. +20 army experience."
 TIG_the_caches:0 "The Caches"
 TIG_the_caches_desc:0 "What Pretoria never collected. +12,000 manpower. 1,000 rifles. 40 support kits."
 TIG_keep_the_ola:0 "Keep the OLA"
 TIG_keep_the_ola_desc:0 "The Oromo brigades stay in this army, as they did in 2021. +8,000 manpower. War support +5%."
 TIG_send_them_south:0 "Send Them South"
 TIG_send_them_south_desc:0 "The Oromo Liberation Army is not Tigray's war. Their spirit comes off if it is on. Stability +5%. War support -5%."
 TIG_the_west:0 "The West Is Tigray"
 TIG_the_west_desc:0 "Welkait is not a gift to Gondar. Spirit: The West. Core attack and core defense +10%."
 TIG_wello:0 "Through Wollo"
 TIG_wello_desc:0 "A claim on Wollo. The road south runs through it. War support +5%."
 TIG_afar_corridor:0 "The Afar Corridor"
 TIG_afar_corridor_desc:0 "A claim on Afar. The coast is that way, and so is Djibouti. War support +5%."
 TIG_begemder:0 "Into Begemder"
 TIG_begemder_desc:0 "A claim on Gondar's country. This is the fight with Amhara, not a side show. War support +5%."
 TIG_across_the_mereb:0 "Across the Mereb"
 TIG_across_the_mereb_desc:0 "Eritrea's army was inside Tigray in the last war. A claim on Eritrea and a wargoal."
 TIG_kassala:0 "The Kassala Road"
 TIG_kassala_desc:0 "Shererina sits on the Sudan border. A claim on Kassala and a wargoal on Sudan."
 TIG_djibouti_ask:0 "Ask Djibouti"
 TIG_djibouti_ask_desc:0 "Once Afar is held. Military access and docking rights with Djibouti."
 TIG_secure_the_north:0 "Secure the North"
 TIG_secure_the_north_desc:0 "Requires Tigray, Wollo, and Afar. Those three become cores. Stability +10%. War support +5%."
 TIG_on_to_addis:0 "On to Addis"
 TIG_on_to_addis_desc:0 "Requires Addis, or a capitulated Ethiopia. Cores on the federation's states. The country becomes the Ethiopian Federation. Spirit: On to Addis. War support +10%. Attack +5%. Closes the northern republic."
 TIG_northern_state:0 "A Northern State"
 TIG_northern_state_desc:0 "Stop at Tigray, Wollo, and Afar. The country becomes the Republic of Tigray. Spirit: A Northern State. Core defense +15%. Stability +10%. Closes the road to Addis."

 dd_tig_cadre:0 "The Cadre"
 dd_tig_cadre_desc:0 "The TPLF above the TDF. Daily political power +0.15. Ideology drift defense +25%. Organization -5%."
 dd_tig_generals:0 "The Generals"
 dd_tig_generals_desc:0 "The TDF command. Attack +10%. Organization +5%. Command power gain +0.15. Daily political power -0.10."
 dd_tig_western:0 "The West"
 dd_tig_western_desc:0 "Western Tigray is not negotiable. Core attack +10%. Core defense +10%."
 dd_tig_on_addis:0 "On to Addis"
 dd_tig_on_addis_desc:0 "Mekelle is taking the federation, not leaving it. War support +10%. Attack +5%."
 dd_tig_northern_state:0 "A Northern State"
 dd_tig_northern_state_desc:0 "The war stops at the north. Core defense +15%. Stability +10%."

 ETH_oppose_tigray:0 "Oppose Tigray"
 ETH_oppose_tigray_desc:0 "The first step of the war. The federation fights the rising. Spirit: Hold Addis. Core defense +10%. War support +10%. Then march on Eritrea, then Sudan. Closes Prop Up Tigray."
 ETH_prop_up_tigray:0 "Prop Up Tigray"
 ETH_prop_up_tigray_desc:0 "Addis arms Mekelle instead of crushing it. Spirit: Backing Mekelle. Stability +5%. War support -10%. Daily political power +0.10. When the rising starts, you can take their side. Closes Oppose Tigray."
 ETH_arm_the_tdf:0 "Arm the TDF"
 ETH_arm_the_tdf_desc:0 "Extra rifles and men go to the Tigray Defense Forces when the rising starts."
 ETH_take_mekelle:0 "Take Their Side"
 ETH_take_mekelle_desc:0 "You leave Addis and play Tigray. Ethiopia keeps fighting. Use this if the rising has already started."
 dd_ethiopia.1.tt_play:0 "You propped up Tigray. You now play Tigray."
 dd_eth_mobilized:0 "Called Up"
 dd_eth_mobilized_desc:0 "The federation opens the manpower pool for the war in the north. Recruitable population +3%. War support +5%."
 dd_eth_backing_mekelle:0 "Backing Mekelle"
 dd_eth_backing_mekelle_desc:0 "Addis is feeding the TDF instead of fighting it. Stability +5%. War support -10%. Daily political power +0.10."
