l_english:
 doomsday_intel.news_ok:0 "Concerning."
 doomsday_intel.1.t:0 "Unrest Abroad"
 doomsday_intel.1.d:0 "Reports from [Root.GetName] describe sudden political turmoil and falling public confidence. No sponsor has been identified."
 doomsday_intel.3.t:0 "Commander Assassinated"
 doomsday_intel.3.d:0 "A senior military commander in [Root.GetName] has been killed. Investigators point to a carefully planned hit, but the trail goes cold."
 doomsday_intel.4.t:0 "Assassination Foiled"
 doomsday_intel.4.d:0 "Security services in [Root.GetName] claim to have disrupted an attempt on a military commander's life. The plotters remain unknown."
 doomsday_intel.5.t:0 "Insurgency Erupts"
 doomsday_intel.5.d:0 "Armed irregulars have appeared in [Root.GetName], striking near the capital. Outside backing is widely suspected, but unproven."
 doomsday_intel.6.t:0 "Insurgent Plot Collapses"
 doomsday_intel.6.d:0 "Rumours of a foreign-backed uprising in [Root.GetName] have faded without a clear outbreak. Whatever was planned never materialized."
 doomsday_intel.7.t:0 "Military Takeover"
 doomsday_intel.7.d:0 "The government of [Root.GetName] has been replaced by a military junta. Foreign fingerprints are alleged, but no proof has emerged."
 doomsday_intel.8.t:0 "Coup Attempt Foiled"
 doomsday_intel.8.d:0 "Authorities in [Root.GetName] say they have crushed a putsch. Accusations of foreign meddling circulate without confirmation."
 doomsday_intel.9.t:0 "Civil War Breaks Out"
 doomsday_intel.9.d:0 "[Root.GetName] has descended into civil conflict after a failed power struggle. Outside powers deny any role."
 doomsday_intel.10.t:0 "Infrastructure Attacked"
 doomsday_intel.10.d:0 "Critical facilities in [Root.GetName] have been sabotaged. The attack looks professional; no group has claimed responsibility."
 doomsday_intel.11.t:0 "Sabotage Scare"
 doomsday_intel.11.d:0 "Security alerts in [Root.GetName] warned of industrial sabotage, but damage appears limited or absent. The scare remains unexplained."
 doomsday_intel.12.t:0 "Technology Leak"
 doomsday_intel.12.d:0 "Sensitive technological secrets linked to [Root.GetName] appear to have been compromised. The beneficiary is unknown."
 doomsday_intel.13.t:0 "Espionage Thwarted"
 doomsday_intel.13.d:0 "Counter-intelligence in [Root.GetName] reports stopping an attempt to steal research. The case is sealed."
 doomsday_intel.14.t:0 "Cyber Attack"
 doomsday_intel.14.d:0 "Military networks in [Root.GetName] have suffered a damaging cyber intrusion. Attribution remains contested."
 doomsday_intel.20.t:0 "Assign Blame"
 doomsday_intel.20.d:0 "Our own operation has drawn unwanted attention at home. The public will demand a scapegoat.\n\nClick a foreign country on the map to blame them (−100 relations both ways, +5% war support for 2 years), or walk away."
 doomsday_intel.20.a:0 "Open the map and choose a scapegoat"
 doomsday_intel.20.b:0 "Refuse to blame anyone"
 doomsday_intel.30.t:0 "The Coup Has Succeeded"
 doomsday_intel.30.d:0 "A flawless putsch has removed our government. We can accept the junta, or take the army that remains and fight a civil war."
 doomsday_intel.30.a:0 "Accept the junta"
 doomsday_intel.30.b:0 "Fight the civil war"
