 USA_legislative_agenda:0 "Open the Legislative Agenda"
 USA_legislative_agenda_desc:0 "Opens Congress. A focus adds a bill to the House floor. The House needs 218 seats of that party. The Senate then needs 51, and 60 unless the filibuster is bypassed. The reward is paid when the Senate finishes the bill."
 USA_leg_care_act:0 "Add the American Health Care Act to the House Floor"
 USA_leg_care_act_desc:0 "Republican bill. If it passes: base stability +5%, war support +5%."
 USA_leg_big_beautiful_bill:0 "Add the Big Beautiful Bill to the House Floor"
 USA_leg_big_beautiful_bill_desc:0 "Republican bill. If it passes: treasury +$300 billion, factory output +10%, consumer goods -5%."
 USA_leg_secure_america_act:0 "Add the Secure America Act to the House Floor"
 USA_leg_secure_america_act_desc:0 "Republican bill. If it passes: national populism +10%."
 USA_leg_water_resource_management:0 "Add Water Resource Management to the House Floor"
 USA_leg_water_resource_management_desc:0 "Republican bill. If it passes: +1 infrastructure in every owned core state a river crosses."
 USA_leg_expand_medicare:0 "Add Expand Medicare to the House Floor"
 USA_leg_expand_medicare_desc:0 "Democratic bill. If it passes: healthcare becomes the National Health Service. +100 political power if that law, or better, is already in place."
 USA_leg_ban_arms_to_israel:0 "Add Ban Arms to Israel to the House Floor"
 USA_leg_ban_arms_to_israel_desc:0 "Democratic bill. If it passes: the Israel arms spirit is removed. +100 political power if it is already gone."
 USA_leg_american_homeownership_act:0 "Add the American Homeownership Act to the House Floor"
 USA_leg_american_homeownership_act_desc:0 "Democratic bill. If it passes: stability +10%, monthly population +5%."
 USA_leg_rural_telehealth:0 "Add the Rural Telehealth Initiative to the House Floor"
 USA_leg_rural_telehealth_desc:0 "Democratic bill. If it passes: a level 1 radar station in the three least-developed owned core states. A state on a foreign border is taken ahead of an inland state of the same kind."
 dd_usa_legislature_category:0 "Congress"
 dd_usa_legislature_category_desc:0 "1. Add a bill to the House floor. 2. The House clock runs at 218 seats of that party. 3. The Senate clock runs at 51 seats. Under 60 Senate seats, a filibuster stops it until you bypass it. The reward is paid when the Senate finishes."
 dd_usa_lobby_democratic_caucus:0 "Lobby for Democratic Support"
 dd_usa_lobby_democratic_caucus_desc:0 "Take 6 House seats and 2 Senate seats from the Republicans for 6 months. Stacks. Seats are what move a bill."
 dd_usa_lobby_republican_caucus:0 "Lobby for Republican Support"
 dd_usa_lobby_republican_caucus_desc:0 "Take 6 House seats and 2 Senate seats from the Democrats for 6 months. Stacks. Seats are what move a bill."
 dd_usa_use_filibuster_bypass:0 "Bypass the Filibuster"
 dd_usa_use_filibuster_bypass_desc:0 "Requires 51 Senate seats for your party. One use. Lets the Senate finish a bill without 60 seats."
 DD_USA_LEG_HEADER:0 "How a bill becomes law"
 DD_USA_LEG_HOUSE:0 "House seats   §4Dem [?dd_usa_house_dem_now|0]§!   §RRep [?dd_usa_house_rep_now|0]§!"
 DD_USA_LEG_HOUSE_TT:0 "Step 2. After a focus adds the bill, it advances here only while its party has 218 House seats. Lobby seats count."
 DD_USA_LEG_SENATE:0 "Senate seats   §4Dem [?dd_usa_senate_dem_now|0]§!   §RRep [?dd_usa_senate_rep_now|0]§!"
 DD_USA_LEG_SENATE_TT:0 "Step 3. The Senate votes after the House. 51 seats pass it. Fewer than 60 seats is a filibuster unless you spend the bypass."
 DD_USA_LEG_SUPPORT:0 ""
 DD_USA_LEG_SUPPORT_TT:0 "Social liberals and democratic socialists table Democratic bills. Conservatives and national populists table Republican bills. The reward is paid when the Senate finishes, not when the focus finishes."
 DD_USA_LEG_BILL:0 "On the floor: [GetDdUsaActiveBill]"
 DD_USA_LEG_BILL_TT:0 "You can table any bill of your own party. That only puts it on the floor. It still has to clear the House, then the Senate."
 DD_USA_LEG_STATUS:0 "[GetDdUsaBillChamber]  Days left: [?dd_usa_bill_days_left|0]  Need: [?dd_usa_bill_support_need|0]\n[GetDdUsaBillProgress]  [GetDdUsaFilibusterLine]"
 DD_USA_LEG_STATUS_TT:0 "The House runs first. When its days hit zero, the same bill moves to the Senate. The reward is paid when the Senate days hit zero."
