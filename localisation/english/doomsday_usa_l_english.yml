 dd_usa_noem.1.t:0 "Noem Is Out"
 dd_usa_noem.1.d:0 "The White House has fired Kristi Noem. Homeland Security invoices show contracts steered to donors who paid for time in her office. The same books show the wider habit: friends of the president sell meetings, and envoys fold private deals into official talks. The department keeps working."
 dd_usa_noem.1.a:0 "A glimpse inside the administration."
 dd_usa_news.12.t:0 "Lindsey Graham Has Died"
 dd_usa_news.12.d:0 "Lindsey Graham died on the evening of July 11, the day after he met with Zelensky in Kyiv. He was on his way back to Washington."
 dd_usa_news.12.a:0 "White Hawk Down."
 dd_usa_news.13.t:0 "Trump Found Dead"
 dd_usa_news.13.d:0 "Donald Trump has been found dead. JD Vance has taken leadership of MAGA."
 dd_usa_news.13.a:0 "Vance inherits the movement."
 dd_usa_cw.3.t:0 "The True Heir to MAGA"
 dd_usa_cw.3.d:0 "Trump is dead and Vance holds what is left of MAGA. The Heartland Conservatives can claim the inheritance now, or wait."
 dd_usa_cw.3.a:0 "The true heir to MAGA"
 dd_usa_cw.3.b:0 "Let's bide our time"
 dd_hormuz_category:0 "Hormuz Logistics"
 dd_hormuz_category_desc:0 "Who holds the Arabian Sea and the Persian Gulf, who is bombing whom, and how hard the Iranian state is holding."
 dd_hormuz_usa_escort:0 "Escort the Tankers"
 dd_hormuz_usa_escort_desc:0 "Push naval control of the strait toward the United States."
 dd_hormuz_usa_strike:0 "Strike the Strait"
 dd_hormuz_usa_strike_desc:0 "Bomb the naval bases, airfields, and oil sites on the Iranian side of the Gulf."
 dd_hormuz_per_mine:0 "Mine the Lanes"
 dd_hormuz_per_mine_desc:0 "Push naval control of the strait toward Iran."
 dd_hormuz_per_missiles:0 "Missile the Shipping"
 dd_hormuz_per_missiles_desc:0 "Hit the tanker traffic and throw the burden of the strait back on the United States."
 dd_hormuz_usa_closed:0 "Hormuz Closed"
 dd_hormuz_usa_closed_desc:0 "Iran holds the strait. Consumer goods +8%. Factory output -5%."
 dd_hormuz_usa_contested:0 "Hormuz Contested"
 dd_hormuz_usa_contested_desc:0 "The lanes are still in dispute. Consumer goods +4%."
 dd_hormuz_usa_open:0 "Hormuz Open"
 dd_hormuz_usa_open_desc:0 "American escorts hold the strait. Navy organization +5%. War support +5%."
 dd_hormuz_usa_shipping_hit:0 "Tanker Losses"
 dd_hormuz_usa_shipping_hit_desc:0 "Iranian missiles are hitting the shipping. Consumer goods +6%. Convoy escort efficiency -15%."
 dd_hormuz_per_holds:0 "Hormuz Held"
 dd_hormuz_per_holds_desc:0 "Iran holds the strait. War support +10%. Consumer goods -5%."
 dd_hormuz_per_contested:0 "Hormuz Contested"
 dd_hormuz_per_contested_desc:0 "The lanes are still in dispute. War support +3%."
 dd_hormuz_per_lost:0 "Hormuz Lost"
 dd_hormuz_per_lost_desc:0 "American escorts hold the strait. Stability -5%. Factory output -8%."
 dd_hormuz_per_battered:0 "Gulf Sites Burning"
 dd_hormuz_per_battered_desc:0 "The coastal bases and oil sites are being wrecked. Factory output -10%. Construction speed -10%."
 dd_hormuz.1.a:0 "Understood."
 dd_hormuz.20.t:0 "Iran Has Broken"
 dd_hormuz.20.d:0 "The Iranian state has collapsed into civil war. The foreign war is over. The Revolutionary Guard is left to fight its own country."
 dd_hormuz.20.a:0 "We held."
 dd_hormuz.10.t:0 "The Lanes Are Open"
 dd_hormuz.10.d:0 "Escorts have pushed the tankers through. The United States holds the Strait of Hormuz."
 dd_hormuz.10.a:0 "Keep them moving."
 dd_hormuz.11.t:0 "The Lanes Are Shut"
 dd_hormuz.11.d:0 "Mines and gunboats have closed the Strait of Hormuz again. Iranian control is back."
 dd_hormuz.11.a:0 "The strait is ours."
 dd_hormuz.12.t:0 "The Coastal Sites Are Burning"
 dd_hormuz.12.d:0 "Strikes on the Iranian side of the Gulf have torn up the bases and the oil sites."
 dd_hormuz.12.a:0 "Hit them again."
 dd_hormuz.13.t:0 "The Tankers Are Burning"
 dd_hormuz.13.d:0 "Missiles on the shipping lanes are sticking. The cost is landing on the American economy."
 dd_hormuz.13.a:0 "The pressure is working."
 dd_hormuz_news.1.t:0 "War with Iran"
 dd_hormuz_news.1.d:0 "On February 28, American and Israeli strikes hit Iran. The supreme leader is dead, a successor has to be named, and Iran's proxies are being pulled under Tehran's command. Hormuz Logistics shows who holds the Arabian Sea and the Persian Gulf, and whether either side is bombing the other."
 dd_hormuz_news.1.d_pez:0 "On February 28, American and Israeli strikes hit Iran. The supreme leader is dead. Masoud Pezeshkian has been named to lead the country through the war, and Iran's proxies are being pulled under Tehran's command. Hormuz Logistics shows who holds the Arabian Sea and the Persian Gulf, and whether either side is bombing the other."
 dd_hormuz_news.1.d_moj:0 "On February 28, American and Israeli strikes hit Iran. The supreme leader is dead. Mojtaba Khamenei has taken the leadership and declared a holy war, and Iran's proxies are being pulled under Tehran's command. Hormuz Logistics shows who holds the Arabian Sea and the Persian Gulf, and whether either side is bombing the other."
 dd_hormuz_news.1.a:0 "The Gulf is at war."
