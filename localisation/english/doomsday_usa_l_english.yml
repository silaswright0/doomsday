 dd_usa_alt.1.t:0 "The Alt Right Lost"
 dd_usa_alt.1.d:0 "November did not belong to the movement. The country is about to decide what that means."
 dd_usa_alt.1.a:0 "The game is over"
 dd_usa_alt.1.b:0 "Let's bide our time"
 dd_usa_alt.1.c:0 "It's now or never"
 dd_usa_fascism_outlawed_tt:0 "Fascism is outlawed. The election winner's path stays open."
 dd_usa_fuse.2.t:0 "Domestic Revolutionary Components on the Move"
 dd_usa_fuse.2.d:0 "Across the ideologies, armed networks are moving. Convoys, church vans, union halls, and militia barns are all in motion on the same night."
 dd_usa_fuse.2.a:0 "We see them"
 dd_usa_tariff.11.t:0 "American Firms Stay"
 dd_usa_tariff.11.d:0 "Washington wants American capital, energy contracts, and firms to stay in Canada, and Canada to keep buying American goods. Our exporters are the ones who will be told to stay home. Trade war points: [?dd_trade_war_points|0]. At 4 or more, the cabinet refuses."
 dd_usa_tariff.11.a:0 "Keep their firms."
 dd_usa_tariff.11.b:0 "We will not sign that."
 dd_usa_tariff.12.t:0 "Canada Left the Door Open"
 dd_usa_tariff.12.d:0 "Canada accepted American firms in its market. The second demand is that Canadian autos, steel, lumber, and dairy stay out of the American home market."
 dd_usa_tariff.12.a:0 "Send the second demand."
 dd_usa_tariff.13.t:0 "Stay Out of the American Market"
 dd_usa_tariff.13.d:0 "Washington's second demand: Canadian producers take quotas and stay out of the American home market. American firms keep their place in ours. Trade war points: [?dd_trade_war_points|0]. At 4 or more, the cabinet refuses."
 dd_usa_tariff.13.a:0 "Accept the quotas."
 dd_usa_tariff.13.b:0 "The talks are over."
 dd_usa_tariff.14.t:0 "Canada Walked Out"
 dd_usa_tariff.14.d:0 "Canada rejected the deal. Their share of the tariff spirit stays. Negotiations with Canada have to start over. Mexico is a separate table."
 dd_usa_tariff.14.a:0 "We will ask again."
 dd_usa_tariff.15.t:0 "Canada Signed"
 dd_usa_tariff.15.d:0 "Canada kept American firms and accepted being shut out of the home market. The Canada share of both tariff spirits comes off. Mexico's share, if any, stays."
 dd_usa_tariff.15.a:0 "File the agreement."
 dd_usa_tariff.21.t:0 "American Firms Stay"
 dd_usa_tariff.21.d:0 "Washington wants American capital and plants to stay in Mexico, and Mexico to keep buying American goods. Mexican exporters are the ones who will be told to stay home. Trade war points: [?dd_trade_war_points|0]. At 4 or more, the cabinet refuses."
 dd_usa_tariff.21.a:0 "Keep their firms."
 dd_usa_tariff.21.b:0 "We will not sign that."
 dd_usa_tariff.22.t:0 "Mexico Left the Door Open"
 dd_usa_tariff.22.d:0 "Mexico accepted American firms in its market. The second demand is that Mexican autos, steel, produce, and trucks stay out of the American home market."
 dd_usa_tariff.22.a:0 "Send the second demand."
 dd_usa_tariff.23.t:0 "Stay Out of the American Market"
 dd_usa_tariff.23.d:0 "Washington's second demand: Mexican producers take quotas and stay out of the American home market. American firms keep their place in ours. Trade war points: [?dd_trade_war_points|0]. At 4 or more, the cabinet refuses."
 dd_usa_tariff.23.a:0 "Accept the quotas."
 dd_usa_tariff.23.b:0 "The talks are over."
 dd_usa_tariff.24.t:0 "Mexico Walked Out"
 dd_usa_tariff.24.d:0 "Mexico rejected the deal. Their share of the tariff spirit stays. Negotiations with Mexico have to start over. Canada is a separate table."
 dd_usa_tariff.24.a:0 "We will ask again."
 dd_usa_tariff.25.t:0 "Mexico Signed"
 dd_usa_tariff.25.d:0 "Mexico kept American firms and accepted being shut out of the home market. The Mexico share of both tariff spirits comes off. Canada's share, if any, stays."
 dd_usa_tariff.25.a:0 "File the agreement."
 dd_usa_foreign.1.t:0 "A Foreign Policy"
 dd_usa_foreign.1.d:0 "The caucus can build a third campus, or it can deepen the one it already has."
 dd_usa_foreign.1.a:0 "A third campus"
 dd_usa_foreign.1.b:0 "Deepen the campus"
 dd_usa_dsa.1.t:0 "AOC Flees"
 dd_usa_dsa.1.d:0 "Alexandria Ocasio-Cortez and the DSA leave for Nicaragua and the rest of South America. Their support at home is gone."
 dd_usa_dsa.1.a:0 "Let them go"
 dd_usa_fuse.6.t:0 "The Scare Passes"
 dd_usa_fuse.6.d:0 "The two-day collapse in stability ends."
 dd_usa_fuse.6.a:0 "Still standing"
 dd_usa_news.1.t:0 "NATO Meets the Deadline"
 dd_usa_news.1.d:0 "Members who failed to grow their armies are out. Enough of the alliance complied that Washington stays."
 dd_usa_news.1.a:0 "Noted"
 dd_usa_news.2.t:0 "America Leaves NATO"
 dd_usa_news.2.d:0 "More than half the alliance failed the ultimatum. France takes the chair, and the United States walks out."
 dd_usa_news.2.a:0 "France takes the chair"
 dd_usa_news.3.t:0 "Shots Fired at the Capitol Hill Demonstration"
 dd_usa_news.3.d:0 "Shots were exchanged at a demonstration on Capitol Hill. Protesters are dead. Police are injured. Asked to condemn the crowd, Trump says they like him, the press does not, and he will not do it."
 dd_usa_news.3.a:0 "The giant stumbles"
 dd_usa_news.4.t:0 "Trump Declares a National Emergency"
 dd_usa_news.4.d:0 "The White House declares a national emergency and claims command of the National Guard."
 dd_usa_news.4.a:0 "He means it"
 dd_usa_news.5.t:0 "Governors Resist"
 dd_usa_news.5.d:0 "Statehouses refuse the federalization order. Armories are locking their gates. The governors are daring Washington to come and take them."
 dd_usa_news.5.a:0 "The states hold"
 dd_usa_news.10.t:0 "The Second American Civil War"
 dd_usa_news.10.d:0 "The United States has come apart. Texas fights only Texas. The fascists fight everyone but their Christian allies. The communists and their anarchist puppet fight everyone but Texas. The federal commands are not yet in a position to fight each other."
 dd_usa_news.10.a:0 "It has started"
 dd_usa_news.6.t:0 "The Emergency Holds"
 dd_usa_news.6.d:0 "Unused."
 dd_usa_news.6.a:0 "Noted"
 dd_usa_news.7.t:0 "The Country Comes Apart"
 dd_usa_news.7.d:0 "Unused."
 dd_usa_news.7.a:0 "Noted"
 dd_usa_news.11.t:0 "Executives Called Before the Tribunal"
 dd_usa_news.11.d:0 "Corporate officers who wrote the last decade of American policy have been ordered to appear in open court. The boards and the agencies that shielded them are named alongside them."
 dd_usa_news.11.a:0 "The court is in session"
