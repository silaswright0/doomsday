 dd_usa_greenland.1.t:0 "An Offer from Washington"
 dd_usa_greenland.1.d:0 "The United States offers to take Greenland as a puppet. Nuuk can accept, or it can refuse."
 dd_usa_greenland.1.a:0 "Accept the protectorate"
 dd_usa_greenland.1.b:0 "Greenland is not for sale"
 dd_usa_greenland.2.t:0 "Nuuk Refuses"
 dd_usa_greenland.2.d:0 "Greenland has declined. Declaring war frees the island from Denmark, gives NATO to France, and the United States leaves the alliance. Or demand security concessions that Nuuk will have to accept."
 dd_usa_greenland.2.a:0 "Declare war"
 dd_usa_greenland.2.b:0 "Demand security concessions"
 dd_usa_greenland.3.t:0 "American Security"
 dd_usa_greenland.3.d:0 "Greenland must host American forces. Deals with Russia and China are shut."
 dd_usa_greenland.3.a:0 "We have no choice"
 dd_usa_nato.1.t:0 "The Ultimatum Comes Due"
 dd_usa_nato.1.d:0 "The year is up. Every allied army was measured against the twenty-percent growth demand. Those who fell short are out of the alliance. If more than half failed, America leaves and France takes the chair."
 dd_usa_nato.1.a:0 "Enough of them complied"
 dd_usa_nato.1.b:0 "We are leaving NATO"
 dd_usa_convention.1.t:0 "Trump's Speech"
